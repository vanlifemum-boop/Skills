name: Fetch brand assets
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download generated assets
        run: |
          mkdir -p tussy-van/assets
          curl -fsSL -o tussy-van/assets/hero.png "https://d8j0ntlcm91z4.cloudfront.net/user_3G8b7lNnqUrqxsMVhc0S4VKGtKS/hf_20260707_061202_31ca64f8-e165-4500-924c-455792267d9b.png"
          curl -fsSL -o tussy-van/assets/interior.png "https://d8j0ntlcm91z4.cloudfront.net/user_3G8b7lNnqUrqxsMVhc0S4VKGtKS/hf_20260707_061217_9f91ecb3-690d-458d-881a-9852340c86db.png"
          curl -fsSL -o tussy-van/assets/van-compact.png "https://d8j0ntlcm91z4.cloudfront.net/user_3G8b7lNnqUrqxsMVhc0S4VKGtKS/hf_20260707_061611_a79ac9b2-25f0-40a2-8bf8-7822cb8f788e.png"
          curl -fsSL -o tussy-van/assets/van-family.png "https://d8j0ntlcm91z4.cloudfront.net/user_3G8b7lNnqUrqxsMVhc0S4VKGtKS/hf_20260707_061613_192b31cf-30f9-48a6-b888-2192d85ef01f.png"
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tussy-van/assets
          git commit -m "Add generated Tussy Van brand assets"
          git push
