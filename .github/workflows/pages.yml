name: Deploy demo to GitHub Pages

# Publishes the ./docs folder (the scroll-cinematic live demo) to GitHub Pages.
# Runs on the default branch and on the working branch so the page is viewable
# before the PR is merged. `configure-pages` with enablement:true turns Pages on
# automatically the first time this runs — no manual settings change needed.

on:
  push:
    branches:
      - main
      - claude/ethereal-dream-uploads-jnuddj
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload demo artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
