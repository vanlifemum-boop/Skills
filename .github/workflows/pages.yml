name: Website „Mittelfinger auf Reisen" veröffentlichen

# Veroeffentlicht sites/mittelfinger-auf-reisen/ ueber GitHub Pages.
# Laeuft auf dem Standard-Branch und auf dem Arbeits-Branch, damit die Seite
# schon vor dem Merge anzuschauen ist. `configure-pages` mit enablement:true
# schaltet Pages beim ersten Lauf selbst frei — keine Handarbeit in den
# Repository-Einstellungen noetig.

on:
  push:
    branches:
      - main
      - claude/mittelfinger-auf-reisen-sp7xcw
    paths:
      - "sites/mittelfinger-auf-reisen/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Seite als Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./sites/mittelfinger-auf-reisen

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
