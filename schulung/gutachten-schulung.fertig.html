:root{
  --schwarz:#111111; --weiss:#ffffff;
  --rot:#d6392e; --ocker:#e8a93d;
  --petrol:#1f6f6b; --petrol-hell:#2a8c87;
  --buehne:#0e1516; --karte:#16201f; --karte-hoch:#1c2827;
  --text:#e9e6df; --muted:#9aa5a3; --linie:rgba(233,230,223,.14);
  --gruen:#3f9d6d;
  --font-display:"Archivo Black","Arial Black",Arial,sans-serif;
  --font-text:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --max:900px; --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--buehne); color:var(--text);
  font-family:var(--font-text); font-size:17px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--font-display);font-weight:400;line-height:1.15;letter-spacing:-.01em;margin:0 0 .5em}
h1{font-size:clamp(28px,5vw,44px)}
h2{font-size:clamp(22px,3.6vw,31px)}
h3{font-size:19px}
p{margin:0 0 1em}
a{color:var(--ocker)}
strong{color:var(--weiss)}
em{color:var(--ocker);font-style:normal;font-weight:600}

/* ---------- Kopf ---------- */
.kopf{
  position:sticky;top:0;z-index:50;background:rgba(14,21,22,.94);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--linie);
}
.kopf-in{max-width:var(--max);margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.marke{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-size:14px;letter-spacing:.02em}
.kopf-rechts{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.xp{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.xp b{color:var(--ocker)}
.balken{height:3px;background:rgba(233,230,223,.1)}
.balken>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--petrol),var(--ocker));transition:width .5s ease}

/* ---------- Kompassrose ---------- */
.rose{width:26px;height:26px;position:relative;flex:0 0 auto}
.rose::before{
  content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,rgba(232,169,61,.55),rgba(31,111,107,.25) 55%,transparent 72%);
}
.rose::after{
  content:"";position:absolute;left:50%;top:12%;width:2px;height:76%;margin-left:-1px;border-radius:2px;
  background:linear-gradient(180deg,var(--ocker) 0 46%,var(--petrol-hell) 54% 100%);
  transform-origin:50% 50%;animation:nadel 14s cubic-bezier(.5,0,.3,1) infinite;
}
@keyframes nadel{0%,100%{transform:rotate(-13deg)}50%{transform:rotate(13deg)}}
.rose.gross{width:104px;height:104px}
@media (prefers-reduced-motion:reduce){.rose::after{animation:none}*{transition-duration:.01ms!important}}

/* ---------- Layout ---------- */
.wrap{max-width:var(--max);margin:0 auto;padding:34px 20px 96px}
.screen{display:none;animation:auf .4s ease both}
.screen.active{display:block}
@keyframes auf{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.karte{background:var(--karte);border:1px solid var(--linie);border-radius:var(--r);padding:22px}
.karte+.karte{margin-top:14px}

.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--petrol-hell);margin-bottom:8px;font-weight:700}
.merksatz{
  border-left:3px solid var(--ocker);background:rgba(232,169,61,.07);
  padding:14px 18px;border-radius:0 10px 10px 0;margin:18px 0;font-size:18px
}
.merksatz b{display:block;font-family:var(--font-display);color:var(--ocker);font-size:12px;letter-spacing:.12em;margin-bottom:4px}
.hinweis{border-left:3px solid var(--petrol-hell);background:rgba(42,140,135,.08);padding:13px 17px;border-radius:0 10px 10px 0;margin:16px 0;font-size:15.5px;color:var(--muted)}
.warnung{border-left:3px solid var(--rot);background:rgba(214,57,46,.09);padding:13px 17px;border-radius:0 10px 10px 0;margin:16px 0;font-size:15.5px}
blockquote{margin:16px 0;padding:14px 18px;background:rgba(255,255,255,.035);border-radius:10px;font-style:italic;color:#d6d2c9}

/* Bildplatzhalter */
.bild{
  aspect-ratio:16/9;border-radius:12px;margin:18px 0;overflow:hidden;
  background:
    radial-gradient(120% 90% at 22% 18%,rgba(232,169,61,.16),transparent 55%),
    radial-gradient(100% 100% at 80% 90%,rgba(31,111,107,.22),transparent 60%),
    #131c1c;
  border:1px solid var(--linie);display:grid;place-items:center;
}
.bild span{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(154,165,163,.6)}
.bild img{width:100%;height:100%;object-fit:cover;display:block}

table{width:100%;border-collapse:collapse;margin:16px 0;font-size:15.5px}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--linie);vertical-align:top}
th{color:var(--petrol-hell);font-size:12px;letter-spacing:.09em;text-transform:uppercase}
.tabellenrahmen{overflow-x:auto;-webkit-overflow-scrolling:touch}

ul,ol{margin:0 0 1em;padding-left:1.25em}
li{margin-bottom:.4em}

/* ---------- Knöpfe ---------- */
.btn{
  font:inherit;font-weight:600;cursor:pointer;border-radius:10px;padding:12px 20px;
  background:var(--petrol);color:#fff;border:1px solid transparent;transition:.16s
}
.btn:hover{background:var(--petrol-hell)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.geist{background:transparent;border-color:var(--linie);color:var(--text)}
.btn.geist:hover{border-color:var(--petrol-hell);background:rgba(42,140,135,.1)}
.btn.ocker{background:var(--ocker);color:#231a08}
.btn.ocker:hover{background:#f2bb5b}
.btn.klein{padding:8px 14px;font-size:14px}
.btn.richtig{border-color:var(--gruen);background:rgba(63,157,109,.22);color:var(--text)}
.btn.falsch{border-color:var(--rot);background:rgba(214,57,46,.18);color:var(--text)}
.reihe{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}
.reihe .rechts{margin-left:auto}

/* ---------- Interaktionen ---------- */
.opt{
  display:block;width:100%;text-align:left;font:inherit;cursor:pointer;
  background:var(--karte-hoch);border:1px solid var(--linie);color:var(--text);
  border-radius:11px;padding:14px 16px;margin-bottom:10px;transition:.15s
}
.opt:hover:not(:disabled){border-color:var(--petrol-hell);transform:translateX(2px)}
.opt:disabled{cursor:default}
.opt.gewaehlt{border-color:var(--ocker)}
.opt.richtig{border-color:var(--gruen);background:rgba(63,157,109,.13)}
.opt.falsch{border-color:var(--rot);background:rgba(214,57,46,.11)}
.fb{margin-top:9px;font-size:15px;color:var(--muted);display:none}
.fb.an{display:block;animation:auf .3s ease both}
.fb b{color:var(--text)}

.fortschritt-punkte{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.punkt{width:9px;height:9px;border-radius:50%;background:rgba(233,230,223,.16)}
.punkt.fertig{background:var(--petrol-hell)}
.punkt.jetzt{background:var(--ocker);transform:scale(1.35)}

.timer{height:4px;background:rgba(233,230,223,.12);border-radius:3px;overflow:hidden;margin-bottom:14px}
.timer>i{display:block;height:100%;background:var(--ocker);transition:width .95s linear}
.timer.knapp>i{background:var(--rot)}

.zuordnung{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:720px){.zuordnung{grid-template-columns:1fr 1fr}}
.z-spalte h4{margin:0 0 10px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--petrol-hell)}
.chip{
  display:block;width:100%;text-align:left;font:inherit;cursor:pointer;margin-bottom:8px;
  background:var(--karte-hoch);border:1px solid var(--linie);color:var(--text);
  border-radius:9px;padding:10px 13px;font-size:15px;transition:.15s
}
.chip:hover:not(:disabled){border-color:var(--petrol-hell)}
.chip.gewaehlt{border-color:var(--ocker);background:rgba(232,169,61,.1)}
.chip.fertig{opacity:.42;cursor:default;border-color:var(--gruen)}

.lvl-gitter{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}
.lvl-karte{
  background:var(--karte);border:1px solid var(--linie);border-radius:12px;padding:15px;
  cursor:pointer;transition:.16s;text-align:left;font:inherit;color:var(--text);width:100%
}
.lvl-karte:hover:not(.zu){border-color:var(--petrol-hell);transform:translateY(-2px)}
.lvl-karte.zu{opacity:.4;cursor:not-allowed}
.lvl-karte.fertig{border-color:rgba(63,157,109,.5)}
.lvl-nr{font-family:var(--font-display);font-size:12px;color:var(--ocker);letter-spacing:.08em}
.lvl-titel{font-weight:600;margin:5px 0 3px;font-size:15.5px;line-height:1.3}
.lvl-meta{font-size:12.5px;color:var(--muted)}

/* ---------- Glossar-Overlay ---------- */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(6,10,10,.82);backdrop-filter:blur(4px);display:none;padding:20px;overflow-y:auto}
.overlay.an{display:block}
.overlay-in{max-width:760px;margin:40px auto;background:var(--karte);border:1px solid var(--linie);border-radius:16px;padding:26px}
.gl-eintrag{padding:11px 0;border-bottom:1px solid var(--linie)}
.gl-eintrag:last-child{border-bottom:0}
.gl-wort{font-weight:700;color:var(--ocker)}

/* ---------- Merkblatt / Druck ---------- */
.merkblatt{background:var(--karte);border:1px solid var(--linie);border-radius:var(--r);padding:24px}
.check li{margin-bottom:.5em}

@media print{
  body{background:#fff;color:#111;font-size:11pt}
  .kopf,.balken,.reihe,.bild,.no-print,.overlay{display:none!important}
  .screen{display:none!important}
  .screen#s-merkblatt{display:block!important}
  .merkblatt,.karte{border:1px solid #bbb;background:#fff;padding:0;border-radius:0}
  h1,h2,h3{color:#111}
  strong,em,.gl-wort{color:#111}
  .merksatz{border-left:3px solid #888;background:none;color:#111}
  .wrap{padding:0;max-width:none}
  table{font-size:10pt}
  th{color:#111}
  a{color:#111;text-decoration:none}
}

.fuss{margin-top:40px;padding-top:18px;border-top:1px solid var(--linie);font-size:13px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>

 merksatz:"Ein Gutachten ist ein Beweismittel, kein Urteil.",
 text:`
  <p><strong>Das Gericht ordnet an, nicht das Jugendamt.</strong> Ein familienpsychologisches
  Gutachten wird vom Familiengericht durch <em>Beweisbeschluss</em> angeordnet. Darin steht, was
  genau untersucht werden soll — die Beweisfrage. Die sachverständige Person arbeitet diese Frage
  ab, nicht mehr und nicht weniger.</p>
  <p><strong>Und das Gericht ist nicht daran gebunden.</strong> Das Gutachten ist ein Beweismittel
  unter mehreren. Das Gericht muss es würdigen, darf ihm folgen — und darf begründet davon
  abweichen. Wer das weiß, liest ein ungünstiges Gutachten anders: nicht als Urteil, sondern als
  angreifbaren Beitrag.</p>
  <p><strong>Lies den Beweisbeschluss, bevor du irgendetwas anderes tust.</strong> Er ist dein
  Maßstab. Alles im Gutachten, was die Beweisfrage nicht beantwortet, ist Beiwerk. Und alles, was
  die Beweisfrage verlangt, aber im Gutachten fehlt, ist eine Lücke, die du benennen kannst.</p>
  <div class="hinweis">Notiere dir aus dem Beschluss: <strong>Name, Qualifikation und Institut</strong>
  der sachverständigen Person, die <strong>Beweisfrage im Wortlaut</strong> und eine etwaige
  <strong>Frist</strong>. Diese drei Angaben brauchst du in jedem späteren Schritt.</div>
  <p>Gute Beweisfragen sind offen und ergebnisneutral formuliert. Schlechte enthalten die Antwort
  schon in der Frage, verlangen eine rechtliche Wertung von einer psychologischen Fachperson oder
  sind so vage, dass jede Schlussfolgerung passt. Solche Fragen darfst du beanstanden.</p>`,
 ia:{ typ:"quiz", titel:"Finde die Schwachstelle", punkte:100,
  anleitung:"Drei Beweisfragen, drei Urteile. Was ist jeweils das Problem?",
  fragen:[
   { frage:"Was ist an dieser Beweisfrage problematisch?",
     material:"„Es soll ein Gutachten dazu eingeholt werden, ob die durch die Mutter verursachte Entfremdung des Kindes vom Vater fortbesteht.“",
     optionen:[
      {text:"Sie setzt das Ergebnis schon voraus.",richtig:true,fb:"Genau. „Die durch die Mutter verursachte Entfremdung“ behauptet Ursache und Verursacherin, bevor irgendetwas untersucht wurde. Eine ergebnisneutrale Frage würde fragen, <em>ob</em> eine Beeinträchtigung vorliegt und <em>wodurch</em> sie zu erklären ist."},
      {text:"Sie ist zu kurz.",richtig:false,fb:"Länge ist kein Kriterium. Das Problem liegt darin, dass die Frage ihr Ergebnis bereits enthält."},
      {text:"Sie nennt das Kind nicht beim Namen.",richtig:false,fb:"Das ist unerheblich. Entscheidend ist, dass Ursache und Verursacherin schon in der Frage festgeschrieben sind."}]},
   { frage:"Und hier?",
     material:"„Es soll begutachtet werden, welchem Elternteil das alleinige Sorgerecht zu übertragen ist.“",
     optionen:[
      {text:"Sie verlangt eine rechtliche Entscheidung von einer psychologischen Fachperson.",richtig:true,fb:"Richtig. Wem das Sorgerecht zusteht, entscheidet das Gericht. Die sachverständige Person liefert die psychologischen Grundlagen dafür — sie trifft die Entscheidung nicht. Eine Formulierung, die das vermischt, verschiebt Verantwortung."},
      {text:"Sie ist voreingenommen gegenüber einem Elternteil.",richtig:false,fb:"Voreingenommen ist sie nicht — sie ist unzuständig formuliert. Die Rechtsfrage gehört dem Gericht."},
      {text:"Sie ist völlig in Ordnung.",richtig:false,fb:"Nein. Sie überträgt eine Rechtsfrage an eine psychologische Fachperson."}]},
   { frage:"Letzte Frage — was fehlt hier?",
     material:"„Es soll ein Gutachten zur Erziehungsfähigkeit der Kindeseltern eingeholt werden.“",
     optionen:[
      {text:"Der Bezug zum konkreten Kind und zur konkreten Streitfrage.",richtig:true,fb:"Genau. „Erziehungsfähigkeit“ allein ist kein Maßstab. Erziehungsfähigkeit <em>wofür</em>, <em>für welches Kind</em>, <em>mit welchem Bedarf</em>? Ohne diesen Bezug passt am Ende jede Schlussfolgerung — und das ist ein Mangel, den du benennen kannst."},
      {text:"Nichts, das ist die übliche Formulierung.",richtig:false,fb:"Üblich heißt nicht gut. Ohne Bezug zum konkreten Kind ist die Frage nicht überprüfbar zu beantworten."},
      {text:"Die Frist für das Gutachten.",richtig:false,fb:"Die Frist steht an anderer Stelle im Beschluss. Hier fehlt der inhaltliche Bezug."}]}]}

 merksatz:"Eine Blankoerklärung öffnet deine komplette Krankengeschichte.",
 text:`
  <p><strong>Mitwirkung.</strong> Du kannst nicht zur Mitwirkung gezwungen werden. Eine Untersuchung
  darf gegen deinen Willen nicht zwangsweise durchgeführt werden. <em>Aber:</em> Eine Verweigerung
  ist nicht folgenlos — das Gericht darf sie würdigen. In der Praxis führt Nichtmitwirkung selten zu
  einem besseren Ergebnis, häufiger dazu, dass über dich entschieden wird, ohne dass deine Sicht
  überhaupt vorkommt. Nie spontan verweigern, nie im Termin, nie durch Fernbleiben — und eine
  <strong>Teilverweigerung</strong> ist möglich.</p>
  <p><strong>Ablehnung wegen Befangenheit.</strong> Bei konkreten Anhaltspunkten kannst du die
  sachverständige Person ablehnen — <strong>unverzüglich</strong>, sobald du den Grund kennst. Wer
  bis nach dem Gutachten wartet, verliert das Recht in der Regel. Ein unerwünschtes Ergebnis
  begründet keine Befangenheit; abwertende Äußerungen, Vorwegnahme des Ergebnisses oder deutliche
  Ungleichbehandlung schon.</p>
  <p><strong>Schweigepflichtentbindungen.</strong> Du wirst gebeten, Erklärungen zu unterschreiben,
  die Ärzte, Therapeuten, Kita und Schule von der Schweigepflicht entbinden. Diese Erklärungen sind
  häufig sehr weit formuliert. Eine Entbindung kann auf <strong>einzelne Stellen</strong>, auf
  <strong>Zeiträume</strong> und auf <strong>Themen</strong> begrenzt und für die Zukunft
  <strong>widerrufen</strong> werden.</p>
  <div class="warnung">Eine Blankoerklärung „alle behandelnden Ärztinnen und Ärzte, zeitlich
  unbegrenzt“ musst du nicht unterschreiben. Lass sie anwaltlich prüfen. Eine unbedachte
  Unterschrift öffnet deine gesamte Krankengeschichte für ein familiengerichtliches Verfahren —
  auch Behandlungen, die damit nichts zu tun haben.</div>
  <h3>Zwei Akten, zwei Wege</h3>
  <p>Hier verwechseln viele Eltern zwei völlig verschiedene Dinge. Die <strong>Gerichtsakte</strong>
  liegt beim Familiengericht; Einsicht läuft über deine Anwältin oder deinen Anwalt. Nutze das
  <em>vor</em> dem ersten Termin — die sachverständige Person hat die Akte gelesen.</p>
  <p>Die <strong>Jugendamtsakte</strong> folgt einem eigenen Regelwerk, dem
  Sozialverwaltungsverfahrensrecht:</p>
  <blockquote>„Die Behörde hat den Beteiligten Einsicht in die das Verfahren betreffenden Akten zu
  gestatten, soweit deren Kenntnis zur Geltendmachung oder Verteidigung ihrer rechtlichen Interessen
  erforderlich ist.“ <span style="font-style:normal;color:var(--muted)">§ 25 Abs. 1 S. 1 SGB X</span></blockquote>
  <p>Lies den Satz genau: <strong>„den Beteiligten“</strong> und <strong>„das Verfahren
  betreffenden“</strong>. Kein Anspruch auf alles, was das Jugendamt je gesammelt hat — sondern auf
  die Akten des konkreten Verfahrens, und nur, wenn du Beteiligter bist.</p>
  <p><strong>Die entscheidende Frage ist also nicht dein Sorgerecht, sondern deine
  Beteiligtenstellung.</strong> Wer Beteiligter ist, steht in <strong>§ 12 Abs. 1 SGB X</strong>.
  Und <strong>Absatz 2</strong> ist dein Hebel, wenn du es nicht ohnehin bist: Die Behörde
  <em>kann</em> auf Antrag hinzuziehen, wessen rechtliche Interessen berührt werden können — und sie
  <em>muss</em> es auf Antrag, wenn der Ausgang <strong>rechtsgestaltende Wirkung</strong> für dich
  hat.</p>
  <p><strong>Ohne Sorgerecht</strong> gibt es keinen automatischen Anspruch auf die ganze Akte.
  Beteiligter eines konkreten Verfahrens kannst du trotzdem werden. Unabhängig davon gibt
  <strong>§ 18 Abs. 3 SGB VIII</strong> Eltern und Umgangsberechtigten Anspruch auf Beratung und
  Unterstützung, und <strong>§ 1686 BGB</strong> gibt dir gegenüber dem <em>anderen Elternteil</em>
  — nicht gegenüber dem Jugendamt — Anspruch auf Auskunft über die persönlichen Verhältnisse des
  Kindes.</p>
  <div class="hinweis">Das ist die Rechtslage, nicht die Alltagspraxis. Akteneinsicht beim Jugendamt
  dauert und wird verzögert. Stell den Antrag trotzdem — <strong>schriftlich, mit Datum, mit Bezug
  auf § 25 SGB X, und behalte eine Kopie.</strong> Auch eine Ablehnung ist etwas wert: Sie ist
  begründungspflichtig und dokumentiert.</div>`,

   { lage:"Dir wird im Termin eine Schweigepflichtentbindung vorgelegt: „alle behandelnden Ärztinnen und Ärzte, zeitlich unbegrenzt“. Die sachverständige Person wartet.", xp:20,

      {text:"Unterschreiben — Kooperation ist wichtig.",gut:false,fb:"<b>Ungünstig.</b> Kooperation ja, Blankovollmacht nein. Du hast deine gesamte Krankengeschichte geöffnet, auch Behandlungen ohne Bezug zum Verfahren. Ein Widerruf wirkt nur für die Zukunft."},
      {text:"Sagen, dass du das anwaltlich prüfen lässt und begrenzt nachreichst.",gut:true,fb:"<b>Richtig.</b> Das ist keine Verweigerung, sondern ein normaler Vorbehalt. Die Entbindung lässt sich auf Stellen, Zeiträume und Themen begrenzen."}]},
   { lage:"Die sachverständige Person sagt im Erstgespräch: „Bei Müttern wie Ihnen weiß man ja, wie das ausgeht.“", xp:20,

      {text:"Sofort abbrechen und den Termin verlassen.",gut:false,fb:"<b>Ungünstig.</b> Nachvollziehbar, aber schädlich: Abbruch und Nichterscheinen werden gewürdigt. Notiere die Äußerung wörtlich, bring den Termin zu Ende und lass unverzüglich prüfen."},
      {text:"Die Äußerung wörtlich notieren und unverzüglich Ablehnung prüfen lassen.",gut:true,fb:"<b>Richtig.</b> Ein tragfähiger Anhaltspunkt — Vorwegnahme des Ergebnisses. Entscheidend ist „unverzüglich“."}]},
   { lage:"Du bist überzeugt, dass das Gutachten gegen dich ausgeht, und willst nicht mehr teilnehmen.", xp:20,

      {text:"Zum nächsten Termin einfach nicht erscheinen.",gut:false,fb:"<b>Ungünstig.</b> Die teuerste Variante. Es wird über dich entschieden, ohne dass deine Sicht vorkommt — auf Aktenlage und Angaben der Gegenseite."},
      {text:"Anwaltlich beraten lassen und ggf. schriftlich begründet gegenüber dem Gericht erklären.",gut:true,fb:"<b>Richtig.</b> Nie spontan, nie im Termin, nie durch Fernbleiben. Und eine Teilverweigerung ist möglich."}]},
   { lage:"Du willst das Gespräch mit dem Handy mitschneiden, um etwas in der Hand zu haben.", xp:20,
     optionen:[
      {text:"Heimlich aufnehmen.",gut:false,fb:"<b>Falsch, und gefährlich.</b> Heimliche Tonaufnahmen des nicht öffentlich gesprochenen Wortes sind strafbar und schaden dir im Verfahren massiv."},
      {text:"Vorher schriftlich anfragen und die Antwort dokumentieren.",gut:true,fb:"<b>Richtig.</b> Auch ein Nein ist ein Gewinn: eine dokumentierte Anfrage."}]},
   { lage:"Im Gutachten steht ein Befund zu deiner „Belastbarkeit“, ohne dass ein Verfahren genannt wird.", xp:20,

      {text:"Die vollständige Benennung aller eingesetzten Verfahren verlangen.",gut:true,fb:"<b>Richtig.</b> Ein Befund ohne benannte Methode ist nicht überprüfbar — und das ist selbst ein Mangel."}]},
   { lage:"Du hast kein Sorgerecht. Beim Jugendamt läuft ein Verfahren zu deinem Umgang. Du bittest telefonisch um Akteneinsicht und hörst: „Ohne Sorgerecht geht das nicht.“", xp:20,
     optionen:[
      {text:"Das hinnehmen — ohne Sorgerecht hast du eben keine Rechte.",gut:false,fb:"<b>Falsch, und ein teurer Irrtum.</b> Über die Akteneinsicht entscheidet die Beteiligtenstellung nach § 12 SGB X, nicht das Sorgerecht. Ein mündliches Nein ist zudem keine Entscheidung, gegen die du vorgehen könntest."},
      {text:"Schriftlich Hinzuziehung nach § 12 Abs. 2 SGB X beantragen und Akteneinsicht nach § 25 SGB X verlangen.",gut:true,fb:"<b>Richtig.</b> Damit erzwingst du eine Entscheidung. Bei rechtsgestaltender Wirkung <em>muss</em> die Behörde dich auf Antrag hinzuziehen — und eine Ablehnung ist begründungspflichtig und dokumentiert."}]}]}

  <p><strong>Der eine Fehler, der alles entwertet:</strong> Bewertungen hineinzuschreiben. Sobald
  in deiner Chronologie steht, der andere Elternteil sei „manipulativ“ oder „völlig unzuverlässig“,
  liest sie sich als Anklageschrift — und der Eindruck, der entsteht, ist einer über <em>dich</em>.
  Eine Tatsache ist etwas, das ein Video aufgezeichnet hätte.</p>
  <div class="hinweis">Faustregel: Wenn du das Wort nicht mit einem Datum und einem Dokument
  belegen kannst, gehört es nicht hinein. „Er kam dreimal nicht zum vereinbarten Umgang
  (12.03., 26.03., 09.04., WhatsApp-Verlauf)“ wirkt stärker als jedes Adjektiv.</div>
  <p>Sortiere parallel deine Unterlagen: Beschlüsse, Schriftsätze, Jugendamtsberichte, Nachweise
  über wahrgenommene Hilfen, Atteste, Schul- und Kitaunterlagen. <strong>Kopien, nie Originale.</strong>
  Und prüfe deine Chronologie gegen die Akte: Wo widersprechen sich Darstellungen, und welchen
  Nachweis hast du dafür?</p>`,

   {text:"„Er war schon immer völlig unzuverlässig.“",korb:1,fb:"Eine Bewertung ohne Datum und Beleg. Umschreiben in konkrete, datierte Vorfälle mit Nachweis."},

 merksatz:"Leugnen von Belegtem ist der teuerste Fehler.",
 text:`
  <p>Ein Gutachten besteht typischerweise aus sieben Bausteinen: <strong>Aktenstudium ·
  Explorationsgespräche · Hausbesuch · Gespräch mit dem Kind · Interaktionsbeobachtung ·
  Fragebogen- und Testverfahren · Auskünfte Dritter.</strong> Nicht jeder kommt in jedem Verfahren
  vor.</p>
  <p><strong>Der Hausbesuch</strong> beurteilt nicht deine Einrichtung, sondern ob dein Kind einen
  eigenen Platz hat, ob Grundversorgung sichtbar ist, ob es altersgerechte Anregung gibt und ob es
  sicher ist. Aufräumen ist erlaubt und normal. Ein steriler Vorzeigezustand wirkt eher befremdlich
  als überzeugend.</p>
  <p><strong>Auskünfte Dritter</strong> gehen häufig unkommentiert ins Gutachten ein, obwohl sie
  ihrerseits auf Hörensagen beruhen können. Frag nach, <em>welche</em> Auskünfte eingeholt wurden
  und <em>was</em> darin steht.</p>
  <h3>Belastende Fragen sind Methode, nicht Angriff</h3>
  <p>Fragen zu eigener Gewalterfahrung, Psychiatrie, Sucht oder eigenen Fehlern dienen der
  Einschätzung von Ressourcen und Risiken. Drei Orientierungen:</p>
  <ul>
   <li><strong>Etwas zugeben ist nicht dasselbe wie sich schaden.</strong> Ein Elternteil, der eine
   schwierige Phase benennen und einordnen kann, zeigt Problemeinsicht — ein zentrales Kriterium in
   fast jeder Fragestellung.</li>
   <li><strong>Leugnen von Aktenkundigem ist der teuerste Fehler.</strong> Steht es in der Akte und
   du bestreitest es pauschal, entsteht ein Befund über deine Glaubwürdigkeit — und der wiegt
   schwerer als der ursprüngliche Umstand.</li>
   <li><strong>Du darfst um Bedenkzeit bitten.</strong> „Darauf möchte ich in Ruhe antworten, darf
   ich das schriftlich nachreichen?“ ist eine zulässige und souveräne Antwort.</li>
  </ul>`,

  fragen:[
   { frage:"Im Explorationsgespräch wird eine Polizeimeldung von vor zwei Jahren angesprochen, die in der Akte liegt. Was tust du?",
     optionen:[
      {text:"Sie benennen, einordnen und sagen, was sich seitdem geändert hat.",richtig:true,fb:"Richtig. Das ist genau die Bewegung, die als Problemeinsicht gewertet wird: benennen, einordnen, Veränderung belegen."},
      {text:"Pauschal bestreiten, dass etwas vorgefallen ist.",richtig:false,fb:"Der teuerste Fehler. Es steht in der Akte. Aus einem alten Vorfall wird ein neuer Befund — über deine Glaubwürdigkeit."},
      {text:"Sagen, dass das nichts mit dem Verfahren zu tun hat, und das Thema wechseln.",richtig:false,fb:"Wirkt ausweichend. Ob es relevant ist, entscheidest nicht du — und die Ausweichbewegung wird dokumentiert."}]},
   { frage:"Beim Hausbesuch klingelt es unangekündigt früher als vereinbart. Die Wohnung ist unaufgeräumt.",
     optionen:[
      {text:"Öffnen, kurz benennen, dass gerade Alltag war, und den Termin normal durchführen.",richtig:true,fb:"Richtig. Alltag ist kein Mangel. Beurteilt werden Platz, Grundversorgung, Anregung und Sicherheit — nicht die Ordnung."},
      {text:"Nicht öffnen und auf die vereinbarte Uhrzeit bestehen.",richtig:false,fb:"Nachvollziehbar, aber es wird als Nichtverfügbarkeit dokumentiert. Öffne und benenne die Situation."},
      {text:"Sich ausführlich entschuldigen und die ganze Zeit über die Unordnung sprechen.",richtig:false,fb:"Verschiebt den Fokus auf etwas, das kein Kriterium ist — und wirkt unsicherer, als die Lage hergibt."}]},
   { frage:"Du erfährst, dass die Kita eine Auskunft gegeben hat. Was ist dein nächster Schritt?",
     optionen:[
      {text:"Nachfragen, welche Auskünfte eingeholt wurden und was darin steht.",richtig:true,fb:"Richtig. Fremdauskünfte gehen oft unkommentiert ins Gutachten ein. Du hast ein Interesse daran zu wissen, worauf sie beruhen."},
      {text:"Die Kita anrufen und um Korrektur bitten.",richtig:false,fb:"Riskant. Das kann als Einflussnahme gewertet werden. Der Weg führt über die sachverständige Person und deine Anwältin."},
      {text:"Abwarten, bis das Gutachten vorliegt.",richtig:false,fb:"Verschenkt Zeit. Später ist die Auskunft Teil eines fertigen Textes und schwerer aufzubrechen."}]}]}

 merksatz:"Belastung ist kein Beweis für Unfähigkeit.",
 text:`
  <p>In familienpsychologischen Gutachten kommen häufig standardisierte Fragebögen zum Einsatz —
  etwa das <strong>Eltern-Belastungs-Inventar (EBI)</strong>, der
  <strong>Elternstressfragebogen (ESF)</strong> oder das
  <strong>Eltern-Belastungs-Screening zur Kindeswohlgefährdung (EBSK)</strong>.</p>
  <div class="hinweis">Was diese Verfahren konkret fragen, steht hier bewusst <strong>nicht</strong>.
  Die Inhalte sind urheberrechtlich geschützt — und wer sie vorher kennt, schadet sich. Der Nutzen
  liegt eine Ebene höher: zu verstehen, <em>wie</em> solche Verfahren gebaut sind.</div>
  <p><strong>Ein Screening ist keine Diagnose.</strong> Es ist ein Grobfilter, der bewusst so
  eingestellt ist, dass er lieber zu viele Personen markiert als eine zu übersehen. Das heißt:
  <strong>falsch positive Ergebnisse sind Bauart, nicht Panne.</strong> Ein erhöhter Wert bedeutet
  „hier lohnt genaueres Hinsehen“ — nicht „hier liegt eine Gefährdung vor“.</p>
  <p><strong>Belastung ist nicht Unfähigkeit.</strong> Diese Verfahren messen erlebte Belastung. Ein
  Elternteil mitten in einem Sorgerechtsverfahren <em>ist</em> belastet. Ein erhöhter Belastungswert
  in dieser Lage ist erwartbar — und für sich genommen kein Befund über Erziehungsfähigkeit.</p>
  <p><strong>Kontrollskalen.</strong> Nahezu jeder ernstzunehmende Fragebogen enthält Skalen, die
  nicht den Inhalt messen, sondern das Antwortverhalten: Beschönigung, Übertreibung, Widersprüche.
  <strong>Ein Befund über beschönigendes Antwortverhalten wiegt schwerer als jeder erhöhte
  Belastungswert</strong> — denn er stellt alle deine übrigen Angaben in Frage.</p>
  <p><strong>Deine Prüfpunkte für die Stellungnahme:</strong> Ist die Normstichprobe passend
  (Sprache, Alter, Lebenslage)? Welcher Zeitbezug wurde erfragt — die letzten Wochen oder das letzte
  Jahr? Wurde der Verfahrenskontext bei der Interpretation berücksichtigt? Wird zwischen Screening
  und Diagnose sauber unterschieden?</p>`,
 ia:{ typ:"sort", titel:"Was wiegt schwerer?", punkte:140,
  anleitung:"Sechs Aussagen. Fachlich haltbar oder nicht?",
  koerbe:["Haltbar","Nicht haltbar"],
  items:[
   {text:"„Der erhöhte Belastungswert belegt, dass die Mutter überfordert ist.“",korb:1,fb:"Nicht haltbar. Belastung ist nicht Überforderung, und ein Screeningwert belegt gar nichts — er markiert Klärungsbedarf."},
   {text:"„Das Screening ergab einen auffälligen Wert; zur Klärung wurden ergänzende Verfahren eingesetzt.“",korb:0,fb:"Haltbar. Genau so ist ein Screening gedacht: als Anlass für genaueres Hinsehen, nicht als Ergebnis."},
   {text:"„Die Kontrollskala weist auf beschönigendes Antwortverhalten hin; die Selbstauskünfte sind daher nur eingeschränkt verwertbar.“",korb:0,fb:"Haltbar — und der Grund, warum sich Vorbereitung auf Testverfahren rächt. Dieser Befund wiegt schwerer als jeder Inhaltswert."},
   {text:"„Der Wert liegt im unauffälligen Bereich, also liegt keine Belastung vor.“",korb:1,fb:"Nicht haltbar. Ein unauffälliger Wert schließt nichts aus — Screenings sind auf Empfindlichkeit gebaut, nicht auf Genauigkeit in beide Richtungen."},
   {text:"„Die Normstichprobe bildet die Lebenslage der Untersuchten nicht ab; die Werte sind entsprechend zurückhaltend zu interpretieren.“",korb:0,fb:"Haltbar, und genau die Sorgfalt, die du einfordern darfst."},
   {text:"„Aus dem Screeningergebnis ergibt sich eine Kindeswohlgefährdung.“",korb:1,fb:"Nicht haltbar, und der schwerste der aufgeführten Fehler. Ein Screening kann eine Gefährdung nicht feststellen — dafür ist es nicht gebaut."}]}

 merksatz:"Bewertet wird nicht Perfektion, sondern Reparatur.",
 text:`
  <p>Bei der Interaktionsbeobachtung wird beobachtet, wie du und dein Kind miteinander umgehen —
  oft anhand strukturierter Aufgaben, teils videografiert. Ein verbreitetes Verfahren ist die
  <strong>Heidelberger Marschak-Interaktionsmethode (H-MIM)</strong>.</p>
  <div class="hinweis">Welche Aufgaben konkret gestellt werden, steht hier nicht — das ist
  Testmaterial und wird vorher nicht mitgeteilt. Wer es kennt und sich vorbereitet, produziert
  einstudiertes Verhalten, und genau das wird als solches dokumentiert.</div>
  <p><strong>Was du wissen darfst und sollst:</strong> Solche Verfahren enthalten
  <strong>absichtlich</strong> Aufgaben, die Anspannung erzeugen — etwas, das nicht sofort gelingt,
  eine Trennung, eine Anforderung. Das ist kein Fallstrick, sondern der Kern der Methode. Eine
  reibungslose Szene zeigt wenig. Interessant wird es, <em>wenn</em> es hakt.</p>
  <p><strong>Beobachtet werden ungefähr vier Dimensionen:</strong> Struktur (gibst du Halt und
  Rahmen?), Anregung (forderst du angemessen?), Fürsorge (nimmst du Bedürfnisse wahr?) und
  gemeinsame Freude (entsteht ein geteilter Moment?). Quer dazu die wichtigste Frage:
  <strong>Wie wird eine gekippte Situation wieder aufgefangen?</strong></p>
  <p>Das nennt man Reparatur, und es ist der eigentliche Prüfstein. Kein Kind wächst konfliktfrei
  auf. Fachlich interessant ist nicht, ob es kracht, sondern ob danach jemand die Beziehung
  wiederherstellt — und wer damit anfängt.</p>
  <div class="warnung">Frag vorher: Wird aufgezeichnet? Wer sieht die Aufnahme? Kommt sie zur Akte?
  Wie lange wird sie gespeichert, wann gelöscht? Das sind zulässige Fragen, und die Antworten sind
  dokumentiert.</div>`,
 ia:{ typ:"quiz", titel:"Die Szene kippt", punkte:140,
  anleitung:"Eine Beobachtungssituation in drei Schritten.",
  fragen:[
   { frage:"Dein vierjähriger Sohn soll eine Aufgabe machen, die ihm nicht gelingt. Er wirft das Material weg und schreit. Die sachverständige Person schreibt mit. Was tust du?",
     optionen:[
      {text:"Dich zu ihm setzen, den Ärger benennen und die Aufgabe kleiner machen.",richtig:true,fb:"Richtig. Gefühl anerkennen, Anforderung anpassen, dranbleiben — das ist Struktur und Fürsorge in einem."},
      {text:"Ihn ermahnen, dass sich das jetzt nicht gehört, weil jemand zuschaut.",richtig:false,fb:"Der Verweis auf die Zuschauerin macht die Situation zur Prüfung. Das erhöht den Druck auf das Kind und wird als solches gesehen."},
      {text:"Die Aufgabe schnell selbst lösen, damit es weitergeht.",richtig:false,fb:"Nimmt dem Kind die Erfahrung, etwas zu bewältigen. Beobachtet wird Anregung, nicht Ergebnis."}]},
   { frage:"Er beruhigt sich nicht und schubst dich weg. Du merkst, dass du selbst wütend wirst.",
     optionen:[
      {text:"Kurz Abstand nehmen, durchatmen, dann ruhig zurückkommen.",richtig:true,fb:"Richtig — und fachlich stark. Eigene Anspannung wahrnehmen und regulieren, statt sie auszuagieren, ist genau das, worauf geschaut wird."},
      {text:"Die Wut unterdrücken und betont fröhlich weitermachen.",richtig:false,fb:"Aufgesetzte Fröhlichkeit wird bemerkt und wirkt unecht. Echte Regulation ist überzeugender als gespielte Gelassenheit."},
      {text:"Ihn festhalten, bis er sich beruhigt.",richtig:false,fb:"Körperliche Durchsetzung in dieser Lage ist ungünstig und kann als grenzüberschreitend dokumentiert werden."}]},
   { frage:"Die Szene ist vorbei, er ist noch verstimmt. Der Termin läuft weiter.",
     optionen:[
      {text:"Den Moment ansprechen: „Das war blöd gerade, oder? Komm, wir machen zusammen weiter.“",richtig:true,fb:"Das ist Reparatur — und der Merksatz dieses Levels. Nicht die störungsfreie Szene zählt, sondern dass die Beziehung danach wiederhergestellt wird."},
      {text:"So tun, als wäre nichts gewesen.",richtig:false,fb:"Verpasste Gelegenheit. Das Übergehen wird eher als Vermeidung gelesen denn als Souveränität."},
      {text:"Dich bei der sachverständigen Person für sein Verhalten entschuldigen.",richtig:false,fb:"Verschiebt die Beziehung: Du sprichst mit der Beobachterin statt mit deinem Kind. Genau umgekehrt wäre richtig."}]}]}

 geltung:"<strong>Geltungsbereich:</strong> Dieses Level behandelt <strong>0 bis 6 Jahre</strong> — die Spanne, in der Kita-Berichte und Interaktionsbeobachtungen die größte Rolle spielen. Für Schulkinder und Jugendliche gelten andere Maßstäbe; dazu findest du hier bewusst nichts, statt Halbwissen.",
 text:`
  <p><strong>Warum das hier steht.</strong> Dieses Level ist keine Elternschule. Entwicklungswissen
  entscheidet an genau drei Stellen im Verfahren:</p>
  <ol>
   <li><strong>In der Exploration.</strong> „Erzählen Sie mir einen typischen Tag.“ Wer sein Kind
   konkret und altersbezogen beschreiben kann, hinterlässt einen anderen Eindruck. Ob deine
   Erwartungen zum Alter passen, ist ein anerkanntes Kriterium der Erziehungsfähigkeit.</li>
   <li><strong>In der Interaktionsbeobachtung.</strong> Was in einer Szene gelingen kann, hängt am
   Alter.</li>
   <li><strong>In deiner Stellungnahme.</strong> Der häufigste angreifbare Punkt überhaupt:
   altersnormatives Verhalten, das als Belastungssymptom gedeutet wird.</li>
  </ol>
  <h3>Meilenstein und Grenzstein</h3>
  <p>Fast alle Übersichten nennen <strong>Meilensteine</strong>: das Alter, in dem ein Kind im
  <em>Durchschnitt</em> etwas kann. Freies Laufen etwa im Mittel mit <strong>13 Monaten</strong>.
  Das ist die Zahl, die Eltern nachts wachhält — und die falsche Zahl. Manche Kinder laufen mit 11
  Monaten, andere mit 18. Beide sind unauffällig.</p>
  <p>Fachlich zählt der <strong>Grenzstein</strong>: das Alter, bis zu dem die allermeisten Kinder
  eine Fähigkeit erreicht haben. Erst wenn der überschritten wird, ist Abklärung angezeigt — nicht
  Alarm, sondern Abklärung.</p>
  <div class="tabellenrahmen"><table>
   <tr><th>0–1 Jahr</th><th>Vertrauen aufbauen, erste Bewegungen</th></tr>
   <tr><td>Körper</td><td>Kopf halten, Drehen, Sitzen, Krabbeln, Stehen, erste Schritte; Greifen und Festhalten</td></tr>
   <tr><td>Kognition</td><td>Lernen über Sinne und Bewegung (sensomotorische Phase); vertraute Personen erkennen; <strong>Objektpermanenz</strong></td></tr>
   <tr><td>Sozial-emotional</td><td>Aufbau einer sicheren Bindung; Lächeln, Freude, <strong>Fremdeln</strong></td></tr>
   <tr><td>Sprache</td><td>Lallen ab etwa dem 6. Monat; erste Wörter gegen Ende des Jahres</td></tr>
  </table></div>
  <div class="tabellenrahmen"><table>
   <tr><th>1–3 Jahre</th><th>Laufen, Sprechen, eigener Wille</th></tr>
   <tr><td>Körper</td><td>Sicheres Gehen, Rennen, Klettern; Malen, Bauen, Essen mit dem Löffel</td></tr>
   <tr><td>Kognition</td><td>Neugier und Erkundung; symbolisches Denken beginnt; einfache Ursache-Wirkung</td></tr>
   <tr><td>Sozial-emotional</td><td><strong>Autonomiephase</strong> („Trotzphase“); erste Freundschaften; Nachahmung</td></tr>
   <tr><td>Sprache</td><td>Schneller Wortschatzaufbau; Zwei- bis Dreiwortsätze (etwa ab 18–24 Monaten)</td></tr>
  </table></div>
  <div class="tabellenrahmen"><table>
   <tr><th>3–6 Jahre</th><th>Selbstständig werden, spielen, lernen</th></tr>
   <tr><td>Körper</td><td>Koordination und Gleichgewicht; Hüpfen, Balancieren, Radfahren; Schneiden, Malen</td></tr>
   <tr><td>Kognition</td><td>Fantasie und <strong>Rollenspiel</strong>; Gedächtnis und Konzentration; erstes Zahlenverständnis</td></tr>
   <tr><td>Sozial-emotional</td><td>Regeln verstehen; Empathie; Selbstständigkeit; Konflikte sprachlich lösen</td></tr>
   <tr><td>Sprache</td><td>Vollständige Sätze; sicherere Grammatik; Geschichten erzählen</td></tr>
  </table></div>
  <p><strong>Quer über alle drei Spannen:</strong> sichere Bindung, Motorik, Sprache, Denken,
  Selbstständigkeit, soziale Kompetenz — und <strong>Spielen als wichtigste Form des Lernens</strong>.
  Den letzten Punkt merk dir für Level 6: Wenn in einer Beobachtung gespielt wird, ist das der Ort,
  an dem bei kleinen Kindern Entwicklung überhaupt sichtbar wird.</p>
  <h3>Zwei Fehldeutungen, die real vorkommen</h3>
  <p><strong>„Das Kind fremdelte beim Termin — Hinweis auf unsichere Bindung.“</strong> Falsch, und
  zwar grundlegend. <strong>Fremdeln ist ein Zeichen von Bindung, nicht ihr Gegenteil.</strong> Ein
  Kind, das im zweiten Lebenshalbjahr bei einer fremden Person weint und zur Bezugsperson zurückwill,
  zeigt genau das Erwartbare: Es unterscheidet vertraut von fremd. Bemerkenswert wäre das Gegenteil.</p>
  <p><strong>„Das Kind nässt seit den Terminen wieder ein — Beleg für die Belastung durch den
  anderen Elternteil.“</strong> Vorsicht, in beide Richtungen. Rückschritte unter Belastung sind in
  diesem Alter normal. Sie belegen, <em>dass</em> das Kind belastet ist — nicht, <em>wer</em> oder
  <em>was</em> es belastet. Diese Lücke gilt auch dann, wenn die Deutung dir gerade in den Kram
  passen würde.</p>
  <h3>Alter und Kinderaussagen</h3>
  <ul>
   <li><strong>Zeitangaben sind vor dem Schulalter unzuverlässig.</strong> „Gestern“ kann letzte
   Woche heißen, „immer“ kann zweimal heißen.</li>
   <li><strong>Im Rollenspielalter mischen sich Fantasie und Erinnerung.</strong> Das ist
   Entwicklung, keine Lüge — es begrenzt nur, was aus einer einzelnen Äußerung folgt.</li>
   <li><strong>Kinder sind in diesem Alter suggestibel.</strong> Wie gefragt wird, beeinflusst, was
   erinnert wird. Deshalb ist es so schädlich, mit dem Kind zu üben.</li>
  </ul>
  <div class="warnung"><strong>Bitte einmal ernsthaft lesen.</strong> Eine Alterstabelle ist die
  Stelle, an der eine Schulung wie diese kippen kann.<br><br>
  <strong>1.</strong> Das hier ist <strong>kein Screening</strong>, sondern eine Orientierung, damit
  du Fachsprache einordnen kannst.<br>
  <strong>2.</strong> Wenn du dir Sorgen machst, gehört das <strong>zur Kinderärztin</strong> — zu
  den U-Untersuchungen, zur Frühförderung. Nicht in eine Stellungnahme.<br>
  <strong>3.</strong> Und der unangenehme Punkt: Benutze den Entwicklungsstand deines Kindes
  <strong>nicht als Waffe</strong> gegen den anderen Elternteil. Elternteile, die das tun, fallen
  damit auf — und es fällt auf sie zurück.</div>`,

  antworten:["altersnormativ","auffällig, gehört abgeklärt","sagt nichts über die Eltern aus"],
  karten:[
   {alter:"2 Jahre",text:"Wirft sich beim Anziehen schreiend auf den Boden.",richtig:[0,2],fb:"Autonomiephase — genau das Alter dafür. Und es sagt nichts über Erziehung."},
   {alter:"11 Monate",text:"Weint beim Gutachtertermin, dreht sich weg, will auf den Arm.",richtig:[0,2],fb:"<strong>Fremdeln — ein Zeichen von Bindung, nicht ihr Gegenteil.</strong> Wenn das als Defizit gedeutet wird, ist es ein Punkt für deine Stellungnahme."},
   {alter:"5 Jahre",text:"Erzählt eine ausgeschmückte, teils widersprüchliche Geschichte über den Umgangstag.",richtig:[0],fb:"Rollenspielalter: Fantasie und Erinnerung mischen sich. Keine Lüge — aber auch keine belastbare Chronologie."},
   {alter:"3 Jahre",text:"Nässt nach dem ersten Termin wieder ein.",richtig:[0,2],fb:"Rückschritt unter Belastung, in diesem Alter häufig. Belegt Belastung — nicht deren Ursache."},
   {alter:"4 Jahre",text:"Spricht ausschließlich in Einwortäußerungen, kaum verständlich.",richtig:[1],fb:"Hier ist ein Grenzstein deutlich überschritten. Kein Verfahrensthema — ein Thema für die Kinderärztin."},
   {alter:"18 Monate",text:"Läuft noch nicht frei.",richtig:[0],fb:"Innerhalb der normalen Spanne (etwa 11–18 Monate). Beim nächsten U-Termin ansprechen, mehr nicht."},
   {alter:"6 Jahre",text:"Kann im Streit nachgeben und sich entschuldigen.",richtig:[0,2],fb:"Altersgemäße soziale Kompetenz. Positiv — aber kein Beleg für die Überlegenheit eines Elternteils."},
   {alter:"9 Monate",text:"Sucht ein Spielzeug, das unter einer Decke verschwunden ist.",richtig:[0],fb:"Objektpermanenz — ein normaler kognitiver Entwicklungsschritt."}]}

 merksatz:"Kinder erzählen zuverlässig, dass sie etwas erzählen sollten.",
 text:`
  <p><strong>Vorher.</strong> Sag altersangemessen die Wahrheit, kurz und ruhig. Sinngemäß:</p>
  <blockquote>„Wir gehen morgen zu einer Frau, die mit Familien arbeitet. Wir spielen dort ein
  bisschen zusammen und sie schaut zu. Später redet sie auch allein mit dir. Es gibt nichts, was du
  richtig oder falsch machen kannst. Ich bin da.“</blockquote>
  <p>Was du <strong>nicht</strong> tun solltest: keine Instruktionen, was das Kind sagen soll; keine
  Warnungen; keine Vermittlung, dass es „um viel geht“; keine Belohnung für „gutes Verhalten“; kein
  Üben von Antworten.</p>
  <p>Der Grund wird oft unterschätzt: <strong>Kinder erzählen zuverlässig, dass sie etwas erzählen
  sollten.</strong> Nicht aus Illoyalität, sondern weil sie es als bemerkenswert erleben. Und dann
  steht nicht mehr die Frage im Raum, wie es deinem Kind geht, sondern was du mit ihm besprochen
  hast.</p>
  <p><strong>Nachher.</strong> Frag nicht aus. Wenn dein Kind erzählen will, hör zu. Wenn nicht, ist
  das in Ordnung. Bewerte nicht und korrigiere nicht. Rechne mit Reaktionen in den Tagen danach:
  Schlafprobleme, Anhänglichkeit, Rückschritte, Wut. Das ist normal (siehe Level 7) und kein Zeichen,
  dass etwas schiefgelaufen ist. Plane etwas Ruhiges und Vertrautes ein.</p>
  <div class="warnung">Sprich nicht mit deinem Kind über das Verfahren. Dein Kind ist nicht dein
  Verbündeter. Das ist hart formuliert, aber es schützt euch beide.</div>`,
 ia:{ typ:"timed", titel:"Rapid-Fire", punkte:100, sekunden:8,
  anleitung:"Zehn Sätze, acht Sekunden pro Satz. Gut oder besser nicht? Was du verpasst, kommt am Ende in Ruhe nochmal.",
  aussagen:[
   {text:"„Wir gehen zu einer Frau, die mit Familien arbeitet. Ich bin da.“",gut:true,fb:"Kurz, wahr, beruhigend."},
   {text:"„Sag bloß nichts davon, dass Papa geschrien hat.“",gut:false,fb:"Eine Instruktion — und Kinder erzählen genau das weiter."},
   {text:"„Es gibt nichts, was du richtig oder falsch machen kannst.“",gut:true,fb:"Nimmt Leistungsdruck raus. Genau richtig."},
   {text:"„Wenn du dich gut benimmst, gibt es danach ein Eis.“",gut:false,fb:"Eine Belohnung macht aus dem Termin eine Prüfung."},
   {text:"„Sie schaut uns beim Spielen zu, und später redet sie allein mit dir.“",gut:true,fb:"Ehrlich und altersangemessen — Überraschungen sind belastender als Wahrheit."},
   {text:"„Da geht es um ganz viel, streng dich an.“",gut:false,fb:"Erzeugt genau den Druck, unter dem Kinder verstummen."},
   {text:"Nach dem Termin: „Und? Was hat sie dich gefragt?“",gut:false,fb:"Ausfragen. Wenn dein Kind erzählen will, erzählt es von allein."},
   {text:"Nach dem Termin gemeinsam etwas Vertrautes machen und nicht nachbohren.",gut:true,fb:"Genau das braucht dein Kind jetzt."},
   {text:"„Das hast du falsch erzählt, so war das nicht.“",gut:false,fb:"Korrigieren bringt dein Kind in einen Loyalitätskonflikt."},
   {text:"Dem Kind vorher erklären, wer die Personen im Verfahren sind und was sie über euch denken.",gut:false,fb:"Verfahrensthemen gehören nicht zum Kind — auch nicht in Erklärform."}]}

 merksatz:"Kritik am Verfahren und Kooperation im Alltag sind kein Widerspruch.",
 text:`
  <p>Bis hierher galt alles für alle. Jetzt wird es speziell. Für sechs Konstellationen gibt es
  jeweils einen Hebel, der wirksamer ist als die naheliegende Reaktion — und für vier von ihnen gilt
  derselbe Satz: <strong>Kritik am Verfahren und Kooperation im Alltag sind kein Widerspruch.</strong>
  Du darfst eine Maßnahme angreifen und dich gleichzeitig kooperativ verhalten. Wer beides
  vermischt, verliert meist beides.</p>
  <ul>
   <li><strong>Laufende Inobhutnahme.</strong> Die Beobachtungsbedingungen sind künstlich —
   begleiteter Umgang, fremder Ort, kurze Zeitfenster. Verlange, dass diese Bedingungen im Gutachten
   ausdrücklich benannt werden.</li>
   <li><strong>Vorwurf körperlicher Misshandlung oder medizinische Verdachtsdiagnose.</strong> Hier
   ist fachliche Gegenexpertise entscheidend, nicht Empörung. Medizinische Befunde werden mit
   medizinischen Mitteln geprüft.</li>
   <li><strong>Hochkonflikt-Umgangsverfahren.</strong> Der wirksamste Hebel ist Bindungstoleranz:
   nachweisbar den Kontakt zum anderen Elternteil unterstützen, auch wenn es schwerfällt.</li>
   <li><strong>Kind lebt in einer Pflegefamilie.</strong> Achte darauf, dass die Bindung zur
   Pflegefamilie nicht gegen dich verwendet wird, ohne dass die Umstände ihrer Entstehung
   mitbewertet werden.</li>
   <li><strong>Psychische Erkrankung eines Elternteils.</strong> Eine Diagnose ist kein Befund über
   Erziehungsfähigkeit. Entscheidend sind Behandlung, Stabilität und Vorsorge — und die lassen sich
   belegen.</li>
   <li><strong>Sprachbarriere.</strong> Du hast Anspruch auf sprachliche Verständigung. Ein Gutachten,
   das auf lückenhafter Verständigung beruht, ist methodisch angreifbar — verlange eine qualifizierte
   Dolmetschung, keine Familienangehörigen.</li>
  </ul>`,
 ia:{ typ:"cards", titel:"Fallauswahl", punkte:120,
  anleitung:"Sechs Konstellationen. Was ist jeweils der wirksamere Hebel?",
  karten:[
   { lage:"<strong>Laufende Inobhutnahme.</strong> Dein Kind lebt seit sechs Wochen in einer Einrichtung. Die Interaktionsbeobachtung findet im begleiteten Umgang statt.", xp:20,
     optionen:[
      {text:"Im Termin ausführlich erklären, dass die Inobhutnahme ungerechtfertigt war.",gut:false,fb:"Verständlich, aber es verschiebt den Fokus auf den Konflikt statt auf dein Kind — und kostet Zeit, die der Beziehung fehlt."},
      {text:"Verlangen, dass die künstlichen Beobachtungsbedingungen im Gutachten benannt werden.",gut:true,fb:"<b>Richtig.</b> Ein Umgang unter Aufsicht, an fremdem Ort, nach Wochen Trennung ist keine Alltagssituation. Wird das nicht benannt, ist die Schlussfolgerung methodisch angreifbar."}]},
   { lage:"<strong>Medizinische Verdachtsdiagnose.</strong> Ein Attest deutet eine Verletzung als nicht-akzidentell.", xp:20,
     optionen:[
      {text:"In der Stellungnahme scharf widersprechen und die Ärztin für befangen erklären.",gut:false,fb:"Empörung ersetzt keine Fachlichkeit. Ohne medizinische Gegenexpertise steht deine Behauptung gegen einen Befund."},
      {text:"Eine fachmedizinische Zweitbeurteilung veranlassen.",gut:true,fb:"<b>Richtig.</b> Medizinische Befunde werden mit medizinischen Mitteln geprüft. Das ist der einzige Weg, der trägt."}]},
   { lage:"<strong>Hochkonflikt.</strong> Der andere Elternteil hält Absprachen nicht ein. Du überlegst, den Umgang auszusetzen, bis er sich daran hält.", xp:20,
     optionen:[
      {text:"Den Umgang aussetzen, bis Absprachen eingehalten werden.",gut:false,fb:"Der teuerste Zug im Hochkonflikt. Er wird als mangelnde Bindungstoleranz gelesen — und das ist eines der wirksamsten Kriterien gegen dich."},
      {text:"Den Umgang weiter ermöglichen und die Verstöße sachlich dokumentieren.",gut:true,fb:"<b>Richtig.</b> Du behältst die Bindungstoleranz und hast trotzdem einen Nachweis. Beides gleichzeitig — genau der Merksatz dieses Levels."}]},
   { lage:"<strong>Pflegefamilie.</strong> Im Gutachten steht, dein Kind habe eine enge Bindung zur Pflegefamilie aufgebaut.", xp:20,
     optionen:[
      {text:"Bestreiten, dass diese Bindung besteht.",gut:false,fb:"Ungünstig und meist unwahr. Eine gewachsene Bindung zu bestreiten wirkt, als stelltest du deine Interessen über die des Kindes."},
      {text:"Anerkennen — und verlangen, dass die Umstände ihrer Entstehung mitbewertet werden.",gut:true,fb:"<b>Richtig.</b> Die Bindung ist real. Die Frage ist, ob Kontaktabbrüche oder Verfahrensdauer zu ihrer Entstehung beigetragen haben — und ob das gewürdigt wurde."}]},
   { lage:"<strong>Psychische Erkrankung.</strong> Du warst vor drei Jahren in stationärer Behandlung. Die Diagnose steht in der Akte.", xp:20,
     optionen:[
      {text:"Möglichst wenig darüber sagen und hoffen, dass es nicht vertieft wird.",gut:false,fb:"Ausweichen wirkt wie fehlende Problemeinsicht — und die Akte liegt ohnehin vor. Das kostet doppelt."},
      {text:"Behandlung, Stabilität und Vorsorge offen benennen und belegen.",gut:true,fb:"<b>Richtig.</b> Eine Diagnose ist kein Befund über Erziehungsfähigkeit. Belegte Behandlung und ein Krisenplan sind Nachweise von Problemeinsicht."}]},
   { lage:"<strong>Sprachbarriere.</strong> Die Exploration soll auf Deutsch stattfinden. Du verstehst vieles, aber nicht alles. Dein Bruder bietet an zu dolmetschen.", xp:20,
     optionen:[
      {text:"Den Bruder mitnehmen — besser als nichts.",gut:false,fb:"Riskant. Angehörige als Dolmetscher gelten als nicht neutral, und Missverständnisse gehen später zu deinen Lasten."},
      {text:"Eine qualifizierte Dolmetschung verlangen und die Anfrage dokumentieren.",gut:true,fb:"<b>Richtig.</b> Du hast Anspruch auf Verständigung. Ein Gutachten auf Basis lückenhafter Kommunikation ist methodisch angreifbar — aber nur, wenn du es rechtzeitig angesprochen hast."}]}]}
},

 geltung:"<strong>Geltungshinweis:</strong> Dieses und das folgende Level beziehen sich auf den <strong>Bayerischen Bildungs- und Erziehungsplan (BayBEP)</strong>. Andere Bundesländer haben eigene Bildungspläne — die Grundlogik ist ähnlich, die Bezeichnungen unterscheiden sich. Die Datenschutzregeln in Level 11 gelten dagegen bundesweit, weil sie aus dem SGB VIII stammen.",
 text:`
  <p>Wenn dein Kind eine Kita besucht, ist sie in vielen Verfahren die wichtigste externe
  Informationsquelle — sie sieht dein Kind täglich über Jahre. Was von dort kommt, wandert
  unkommentiert ins Gutachten, wenn niemand hinschaut. Deshalb lohnt es zu wissen,
  <strong>was</strong> die Kita beobachtet und <strong>in welcher Sprache</strong>.</p>
  <p>Kernstück des BayBEP sind die <strong>Basiskompetenzen</strong>. Genau dieses Vokabular findest
  du in Entwicklungsberichten wieder.</p>
  <p><strong>Resilienz — der Begriff, der dich betrifft.</strong> Der BayBEP definiert Resilienz
  nicht als Abwesenheit von Problemen, sondern als <em>Kompetenz unter riskanten
  Lebensumständen</em>. Sie zeigt sich überhaupt erst, wenn belastende Umstände vorliegen — als
  Beispiele nennt der Plan ausdrücklich elterliche Trennung und Scheidung. Und er benennt die
  entscheidende soziale Ressource an erster Stelle: <strong>sichere Bindungen und positive
  Beziehungen zu den erwachsenen Bezugspersonen.</strong></p>
  <p>Das ist doppelt wichtig. Wenn dein Kind trotz eines belastenden Verfahrens stabil bleibt, ist
  das kein Zeichen dafür, dass die Belastung „nicht so schlimm“ war — es sagt auch etwas über die
  Beziehungen, in denen dein Kind steht. Und diese Begriffe stehen dir in der Stellungnahme genauso
  zur Verfügung wie der Gegenseite.</p>
  <blockquote>Eltern „kennen ihr Kind länger und aus unterschiedlicheren Situationen als
  Erzieherinnen, und Kinder können sich in ihrer Familie ganz anders verhalten als in der
  Einrichtung.“</blockquote>
  <p>Wenn im Gutachten steht, das Kind sei in der Kita zurückhaltend, während du es zu Hause anders
  erlebst, ist das kein Widerspruch, den du auflösen musst — es ist ein normaler Befund über zwei
  Kontexte. Problematisch wird es erst, wenn aus einer Beobachtung in einem Kontext eine Aussage
  über den anderen gemacht wird.</p>
  <div class="hinweis">Kita und Eltern begegnen sich nach dem BayBEP als gleichberechtigte Partner
  (Art. 6 Abs. 2 GG, Art. 14 BayKiBiG, § 22a Abs. 2 SGB VIII). Das ist deine Verhandlungsgrundlage:
  Du darfst Einsicht in die Dokumentation über dein Kind verlangen, dem Bericht widersprechen und
  verlangen, dass deine Sicht mit aufgenommen wird.</div>`,
 ia:{ typ:"match", titel:"Bericht entschlüsseln", punkte:90,
  anleitung:"Ein fiktiver Auszug. Ordne die sieben Fachbegriffe ihrer Bedeutung zu.",
  material:`„L. zeigt ein stabiles <strong>Selbstwertgefühl</strong> und traut sich zunehmend, eigene
   Vorschläge einzubringen. Im Freispiel wählt sie selbstständig Material aus und bringt Angefangenes
   zu Ende (<strong>Autonomieerleben</strong>, <strong>Kompetenzerleben</strong>). In Konflikten
   sucht sie inzwischen häufiger sprachliche Lösungen (<strong>soziale Kompetenzen</strong>). Ihr
   <strong>Selbstkonzept</strong> im Bereich Bewegung ist ausgeprägt positiv. Sie fragt nach, wenn
   sie etwas nicht versteht, und erinnert sich an eigene Lösungswege (<strong>lernmethodische
   Kompetenz</strong>). Trotz der derzeitigen familiären Belastung bleibt L. im Alltag ausgeglichen
   und beziehungsfähig (<strong>Resilienz</strong>).“`,
  paare:[
   {begriff:"Selbstwertgefühl",deutung:"Wie das Kind seine eigenen Eigenschaften und Fähigkeiten bewertet"},
   {begriff:"Selbstkonzept",deutung:"Das Wissen des Kindes über sich selbst — schulisch, sozial, emotional, körperlich"},
   {begriff:"Autonomieerleben",deutung:"Das Kind erlebt sich als Verursacher seiner Handlungen"},
   {begriff:"Kompetenzerleben",deutung:"Das Kind erfährt, dass es etwas kann, und sucht passende Herausforderungen"},
   {begriff:"Soziale Kompetenzen",deutung:"Beziehungen aufnehmen, sich einfühlen, kooperieren, Konflikte lösen"},
   {begriff:"Lernmethodische Kompetenz",deutung:"„Lernen, wie man lernt“ — Wissen erwerben, anwenden, darüber nachdenken"},
   {begriff:"Resilienz",deutung:"Widerstandsfähigkeit; zeigt sich erst unter belastenden Umständen"}],
  abschlussfrage:{ punkte:30,
   frage:"Der letzte Satz nennt Resilienz <em>trotz</em> familiärer Belastung. Was heißt das fachlich?",
   optionen:[
    {text:"Dass das Kind trotz belastender Umstände Kompetenz zeigt — und dass die Beziehungen, in denen es steht, dazu beitragen.",richtig:true,fb:"Richtig. Sichere Bindungen zu den Bezugspersonen sind die erstgenannte soziale Ressource für Resilienz."},
    {text:"Dass die Belastung nicht schlimm war.",richtig:false,fb:"Nein. Resilienz zeigt sich nach dem BayBEP überhaupt erst dann, wenn belastende Umstände vorliegen."},
    {text:"Dass das Kind seine Gefühle unterdrückt.",richtig:false,fb:"Das wäre eine Deutung, die der Bericht nicht hergibt — und eine, die du angreifen könntest, wenn sie im Gutachten stünde."}]}}

 merksatz:"Ohne deine Einwilligung geht die Kita-Dokumentation nicht an Dritte.",
 text:`
  <p>Der BayBEP ist an dieser Stelle ungewöhnlich klar, und die Regeln dahinter gelten
  <strong>bundesweit</strong>, weil sie aus dem SGB VIII stammen.</p>
  <p><strong>Der Grundsatz.</strong> Beobachtungsdaten über ein Kind dürfen an außenstehende Dritte
  <strong>grundsätzlich nur mit Einwilligung der Eltern</strong> übermittelt werden
  (§ 65 Abs. 1 S. 1 Nr. 1 SGB VIII). „Außenstehende Dritte“ — das ist auch die sachverständige
  Person.</p>
  <p><strong>Die Ausnahme nach innen.</strong> Der Austausch im Team derselben Einrichtung ist
  zulässig (§ 64 Abs. 1 SGB VIII). Das ist keine Weitergabe nach außen, sondern fachliche Arbeit.</p>
  <p><strong>Die Ausnahme bei Gefährdung.</strong> Bei gewichtigen Anhaltspunkten für eine
  Kindeswohlgefährdung ist die Übermittlung ans Jugendamt zulässig — als letztes Mittel, nach dem
  Verfahren des § 8a SGB VIII.</p>
  <div class="hinweis">Und ein Punkt, der entlastet: Der BayBEP stellt ausdrücklich fest, dass
  pädagogisches Personal <strong>nicht dafür ausgebildet ist, Gefährdungen zu diagnostizieren</strong>.
  Eine Kita-Einschätzung ist eine Beobachtung mit Sorge — keine Feststellung.</div>
  <p><strong>Was das praktisch heißt.</strong> Die Schweigepflichtentbindung aus Level 2 ist genau
  der Schlüssel, der diese Tür öffnet. Du kannst sie begrenzen: auf die Kita, auf einen Zeitraum,
  auf ein Thema. Und du kannst verlangen zu erfahren, was übermittelt wurde.</p>`,

   {text:"„Die Kita darf der sachverständigen Person ohne meine Einwilligung Auskunft über mein Kind geben.“",korb:1,fb:"Irrtum. Die sachverständige Person ist außenstehende Dritte — Übermittlung grundsätzlich nur mit Einwilligung (§ 65 Abs. 1 S. 1 Nr. 1 SGB VIII)."},
   {text:"„Die Erzieherinnen dürfen sich im Team über mein Kind austauschen.“",korb:0,fb:"Fakt. Der Austausch innerhalb derselben Einrichtung ist zulässig (§ 64 Abs. 1 SGB VIII) und ist fachliche Arbeit, keine Weitergabe."},
   {text:"„Bei Anhaltspunkten für eine Kindeswohlgefährdung darf die Kita das Jugendamt einschalten.“",korb:0,fb:"Fakt — als letztes Mittel und nach dem Verfahren des § 8a SGB VIII."},
   {text:"„Wenn die Kita eine Gefährdung feststellt, ist das ein fachlicher Befund.“",korb:1,fb:"Irrtum, und ein entlastender. Pädagogisches Personal ist ausdrücklich nicht dafür ausgebildet, Gefährdungen zu diagnostizieren. Es ist eine Beobachtung mit Sorge."},
   {text:"„Ich kann meine Schweigepflichtentbindung auf die Kita und einen Zeitraum begrenzen.“",korb:0,fb:"Fakt. Genau das ist der Hebel aus Level 2 — Stellen, Zeiträume, Themen."},
   {text:"„Diese Datenschutzregeln gelten nur in Bayern.“",korb:1,fb:"Irrtum. Der Bildungsplan ist bayerisch, die §§ 64 und 65 SGB VIII gelten bundesweit."}]}

 text:`
  <p>Nach jedem Termin: setz dich hin und schreib auf, was war. <strong>Am selben Tag.</strong>
  Nicht am nächsten, nicht am Wochenende. Erinnerung verblasst schneller und selektiver, als man
  glaubt — und Monate später, wenn du eine Stellungnahme schreibst, ist dieses Protokoll oft das
  Einzige, was du gegen eine Darstellung setzen kannst.</p>
  <p>Ein Protokoll ist keine Erzählung. Es ist eine <strong>Feldliste</strong>, nüchtern
  abgearbeitet — und es folgt derselben Regel wie deine Chronologie aus Level 3:
  <strong>Tatsachen, keine Bewertungen.</strong> Wörtliche Zitate gehören in Anführungszeichen,
  Eindrücke ausdrücklich als Eindruck markiert oder weggelassen.</p>
  <div class="hinweis">Führe daneben eine <strong>Terminliste</strong>: Datum, Uhrzeit von–bis,
  Ort, Anwesende, Art des Termins. Sie klingt banal, aber wenn im Gutachten steht, es habe „mehrere
  ausführliche Gespräche“ gegeben, und deine Liste zeigt zwei Termine à 40 Minuten, ist das ein
  belegter Widerspruch.</div>`,

 text:`
  <p><strong>Zuerst die Frist.</strong> Sobald das Gutachten vorliegt, trag die Stellungnahmefrist
  in den Kalender — mit Vorlauf. Versäumte Fristen sind schwer zu heilen.</p>
  <p><strong>Dann einmal lesen und weglegen.</strong> Die erste Lektüre ist emotional, das ist
  normal. Arbeiten kannst du erst bei der zweiten.</p>
  <h3>Die Vier-Farben-Lektüre</h3>
  <p>Geh das Gutachten mit vier Farben durch und markiere jeden Satz nach seiner Art:</p>
  <ul>
   <li><strong>Petrol — Tatsache aus der Akte.</strong> Etwas, das dokumentiert ist.</li>
   <li><strong>Grün — eigene Erhebung.</strong> Etwas, das die sachverständige Person selbst
   beobachtet oder erhoben hat.</li>
   <li><strong>Ocker — Bewertung.</strong> Eine Einschätzung, Deutung, Gewichtung.</li>
   <li><strong>Weiß/grau — Schlussfolgerung.</strong> Die Antworten auf die Beweisfrage.</li>
  </ul>
  <p>Danach zieh von jeder Schlussfolgerung eine Linie nach unten: Worauf stützt sie sich? Landet
  sie in Petrol oder Grün, ist sie getragen. Landet sie nur in Ocker — <strong>eine Bewertung, die
  auf einer Bewertung steht</strong> —, hast du einen Angriffspunkt. Und wenn eine tragende
  Schlussfolgerung auf gar keiner eigenen Erhebung beruht, ist das der stärkste Einwand überhaupt.</p>
  <h3>Das Prüfraster</h3>
  <p>Wurden <strong>Alternativerklärungen</strong> geprüft und begründet verworfen? Das ist der
  zentrale Prüfstein. Wurden alle eingesetzten <strong>Verfahren benannt</strong> und Ergebnisse
  zugeordnet? Stimmen <strong>Terminangaben</strong> mit deiner Liste überein? Wird zwischen
  <strong>Screening und Diagnose</strong> unterschieden? Werden <strong>Fremdauskünfte</strong> als
  solche gekennzeichnet? Ist die <strong>Beweisfrage vollständig</strong> beantwortet?</p>
  <div class="warnung"><strong>Und dann kürze.</strong> Der häufigste Fehler in Stellungnahmen ist
  Vollständigkeit. Vierzig empörte Einwände lesen sich als Rundumschlag und entwerten einander.
  Fünf präzise belegte Einwände mit Seitenverweis zwingen zu einer Antwort.</div>
  <p><strong>Die Eskalationsleiter,</strong> von unten: Stellungnahme mit Seitenverweisen →
  Ergänzungsfragen → Antrag auf mündliche Erläuterung der sachverständigen Person → methodenkritische
  Stellungnahme durch eine eigene Fachperson → Antrag auf ein weiteres Gutachten. Die mündliche
  Erläuterung wird unterschätzt: Vieles, was schriftlich glatt wirkt, hält einer strukturierten
  Befragung nicht stand.</p>`,
 ia:{ typ:"quiz", titel:"Vier-Farben-Lektüre", punkte:160,
  anleitung:"Vier Auszüge aus einem fiktiven Gutachten. Was ist das jeweils — und was folgt daraus?",
  fragen:[
   { frage:"Welche Art von Satz ist das?",
     material:"„Ausweislich des Jugendamtsberichts vom 14.02.2026 fanden zwischen Oktober und Januar sieben begleitete Umgangskontakte statt.“",
     optionen:[
      {text:"Tatsache aus der Akte — überprüfbar.",richtig:true,fb:"Richtig. Datiert, belegt, nachprüfbar. Genau das prüfst du gegen deine eigene Terminliste."},
      {text:"Eigene Erhebung der sachverständigen Person.",richtig:false,fb:"Nein — die Angabe stammt aus dem Jugendamtsbericht, nicht aus eigener Beobachtung."},
      {text:"Bewertung.",richtig:false,fb:"Es wird nichts gewichtet, nur wiedergegeben."}]},
   { frage:"Und dieser?",
     material:"„Die Mutter wirkte im Gespräch angespannt und wenig zugewandt.“",
     optionen:[
      {text:"Bewertung — und ohne Beleg für die Deutung.",richtig:true,fb:"Richtig. „Wirkte“ ist eine Deutung. Zulässig als Eindruck, aber nur, wenn beschrieben wird, woran das festgemacht wurde. Fehlt das, ist es angreifbar."},
      {text:"Tatsache aus der Akte.",richtig:false,fb:"Nein, das ist ein Eindruck aus dem Gespräch, keine Aktentatsache."},
      {text:"Schlussfolgerung auf die Beweisfrage.",richtig:false,fb:"Noch nicht — es ist eine Zwischenbewertung, die später eine Schlussfolgerung tragen soll."}]},
   { frage:"Jetzt der wichtige. Was ist hier das Problem?",
     material:"„Da die Mutter im Gespräch wenig zugewandt wirkte, ist von einer eingeschränkten Feinfühligkeit im Alltag auszugehen.“",
     optionen:[
      {text:"Eine Schlussfolgerung, die nur auf einer Bewertung steht — ohne eigene Erhebung im Alltag.",richtig:true,fb:"Genau. Vom Eindruck in einem Gespräch wird auf das Verhalten im Alltag geschlossen, ohne dass der Alltag erhoben wurde. Das ist der stärkste Einwand, den du formulieren kannst — und er lässt sich in zwei Sätzen belegen."},
      {text:"Nichts, das ist eine übliche fachliche Einschätzung.",richtig:false,fb:"Üblich vielleicht, tragfähig nicht. Zwischen Gesprächseindruck und Alltagsverhalten liegt eine Lücke, die begründet werden müsste."},
      {text:"Die Wortwahl ist zu hart.",richtig:false,fb:"Der Ton ist nicht das Problem. Die fehlende Grundlage ist es."}]},
   { frage:"Du hast elf Einwände gesammelt. Wie gehst du in die Stellungnahme?",
     optionen:[
      {text:"Die vier bis fünf stärksten, jeweils mit Seitenverweis und Beleg.",richtig:true,fb:"Richtig. Wenige, präzise, belegte Einwände zwingen zu einer Antwort. Ein Rundumschlag entwertet auch die guten Punkte."},
      {text:"Alle elf, damit nichts unter den Tisch fällt.",richtig:false,fb:"Der häufigste Fehler. Elf Einwände lesen sich als Empörung, und die zwei starken gehen zwischen den neun schwachen unter."},
      {text:"Keinen — lieber gleich ein Gegengutachten beantragen.",richtig:false,fb:"Zu früh und teuer. Die Eskalationsleiter beginnt unten: Stellungnahme, Ergänzungsfragen, mündliche Erläuterung."}]}]}
