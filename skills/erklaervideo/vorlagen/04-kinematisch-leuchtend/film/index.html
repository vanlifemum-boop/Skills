<body><canvas id="out" width="1920" height="1080"></canvas>
<script src="zeiten.js"></script>
<script>
'use strict';
// Halt Versicherungsmakler – V7 (nur Text/Hervorhebung/Timing neu, alle Zeiten aus K). Handschrift von „A Cosmic Journey“ (CoAnimator): flache, satt gefärbte Flächen,
// die komplett durch einen Ölpinsel-Fluss laufen; leuchtende goldene Figuren mit Pinselflocken und weißen Augen;
// dünne Versalien mit Glühen, die sich Buchstabe für Buchstabe aufbauen. Jedes Bild ist eine reine Funktion von t.
const W = 1920, H = 1080, Q = .25;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v)), lin = (t, a, b) => clamp((t - a) / (b - a)), mix = (a, b, k) => a + (b - a) * k;

const eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const sine = x => -(Math.cos(Math.PI * clamp(x)) - 1) / 2;
const back = x => { x = clamp(x); const c1 = 1.6, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

function mk(w = W, h = H) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mixc = (a, b, k) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(mix(v, B[i], k))).join(',')})`; };

// Ebenen: Szene A/B (werden gemalt), Glühen A/B (Viertelauflösung, weichgezeichnet), Überlage (Schrift, Regen, feine Lichtlinien)
const cvA = mk(), cvB = mk(), cvEA = mk(W * Q, H * Q), cvEB = mk(W * Q, H * Q), cvGA = mk(W * Q, H * Q), cvGB = mk(W * Q, H * Q), cvT = mk();
const gA = cvA.getContext('2d'), gB = cvB.getContext('2d'), eA = cvEA.getContext('2d'), eB = cvEB.getContext('2d'), T = cvT.getContext('2d');
const GA = cvGA.getContext('2d'), GB = cvGB.getContext('2d');

// ---------- Farben (gemessen am Original, siehe STILBIBEL.md) ----------
const P = {
  navy0: '#080b1a', navy1: '#0d1124', navy2: '#141b45', navy3: '#1f2a66',
  lamp: '#f5eed6', cone: '#cdc6b1',
  vio: '#4c495a', vioL: '#6f6a79', vioD: '#2d2d3f', step: '#aba5a1', stepL: '#c8c4cc',
  gold: '#996a2f', goldL: '#c6a451', goldD: '#5d3c1c',
  red: '#7d161a', redL: '#9c2326', redD: '#530f1c', redX: '#2a0d14', cream: '#bcb498', creamL: '#d8d2bc',
  green: '#83a637', greenL: '#9cbf45', greenD: '#6a912c', earth: '#8d6f3c',
  umb: '#c8202a', band1: '#8e4d27', band2: '#613825', band3: '#2a3a8a', band4: '#3a1d3f',

// ---------- Kamera ----------
function cam(c, s, cx, cy, dx = 0, dy = 0) {
  const tx = W / 2 + dx - cx * s, ty = H / 2 + dy - cy * s;
  c.g.setTransform(s, 0, 0, s, tx, ty); c.e.setTransform(s * Q, 0, 0, s * Q, tx * Q, ty * Q); c.S = [s, tx, ty];
}
function scr(c) { c.g.setTransform(1, 0, 0, 1, 0, 0); c.e.setTransform(Q, 0, 0, Q, 0, 0); }
function oCam(c) { const [s, tx, ty] = c.S; T.setTransform(s, 0, 0, s, tx, ty); }
function logmix(a, b, k) { return Math.exp(mix(Math.log(a), Math.log(b), k)); }

// ---------- Grundformen ----------
function rect(g, x, y, w, h, col) { g.fillStyle = col; g.fillRect(x, y, w, h); }
function vgrad(g, y0, y1, stops) { const gr = g.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, c]) => gr.addColorStop(o, c)); return gr; }
function radial(g, x, y, r, stops) { const gr = g.createRadialGradient(x, y, 0, x, y, r); stops.forEach(([o, c]) => gr.addColorStop(o, c)); return gr; }
function glowDot(e, x, y, r, col, a = 1) { if (a <= 0) return; e.save(); e.globalAlpha = a; e.fillStyle = radial(e, x, y, r, [[0, col], [.4, col.replace(/[\d.]+\)$/, '0.45)')], [1, col.replace(/[\d.]+\)$/, '0)')]]); e.fillRect(x - r, y - r, 2 * r, 2 * r); e.restore(); }

function fillBG(c, stops, y0 = 0, y1 = H) { scr(c); c.g.fillStyle = vgrad(c.g, y0, y1, stops); c.g.fillRect(0, 0, W, H); }

// ---------- Leuchtende Figur ----------
// Winkel: 0 = nach unten, +π/2 = nach +x, π = nach oben. arms/legs: [L1, L2(relativ), R1, R2]
const dirv = a => [Math.sin(a), Math.cos(a)];
const segp = (p, a, l) => { const d = dirv(a); return [p[0] + d[0] * l, p[1] + d[1] * l]; };
const FLK = {};
function flecks(id) {
  if (FLK[id]) return FLK[id]; const r = rng(id * 7919 + 13), L = [];
  for (let part = 0; part < 11; part++) { const n = part >= 7 ? 16 : 10; for (let i = 0; i < n; i++) L.push({ part, u: r(), side: r() < .5 ? -1 : 1, ang: (r() - .5) * 2.4, sz: 4 + r() * 7, dark: r(), inset: r() < .25 }); }
  return FLK[id] = L;
}
const FIG = ['#fff7cf', '#ffeaa0', '#fbd06a', '#f5a33c', '#de6a22'];
function person(c, F) {
  const { g, e } = c, on = F.on ?? 1; if (on <= .01 || F.a === 0) return;
  if (F.gy !== undefined) F = { ...F, y: F.gy - 141 * F.s };
  const al = F.a ?? 1;
  const A = F.arms || [-.12, .1, .12, -.1], L = F.legs || [-.05, 0, .05, 0];
  const sh = [[-21, -94], [21, -94]], hp = [[-10, -4], [10, -4]];
  const arm = k => { const e1 = segp(sh[k], A[2 * k], 50); return [sh[k], e1, segp(e1, A[2 * k] + A[2 * k + 1], 48)]; };
  const leg = k => { const k1 = segp(hp[k], L[2 * k], 72); return [hp[k], k1, segp(k1, L[2 * k] + L[2 * k + 1], 70)]; };
  const ar = [arm(0), arm(1)], lg = [leg(0), leg(1)];
  const dim = 1 - on;
  const cols = FIG.map((h, i) => mixc(h, ['#6b4a2a', '#6b4a2a', '#5a3a22', '#4a2a18', '#3a2012'][i], dim * .75));
  const tf = gg => { gg.translate(F.x, F.y); gg.rotate(F.rot || 0); gg.scale(F.s * (F.flip ? -1 : 1), F.s); };
  g.save(); g.globalAlpha = al; tf(g);
  const gr = g.createLinearGradient(0, -150, 0, 142); [0, .2, .5, .75, 1].forEach((o, i) => gr.addColorStop(o, cols[i]));
  g.fillStyle = gr; g.strokeStyle = gr; g.lineCap = 'round'; g.lineJoin = 'round';
  const limb = (pts, w1, w2) => { g.lineWidth = w1; g.beginPath(); g.moveTo(...pts[0]); g.lineTo(...pts[1]); g.stroke(); g.lineWidth = w2; g.beginPath(); g.moveTo(...pts[1]); g.lineTo(...pts[2]); g.stroke(); };
  limb(lg[0], 25, 18); limb(lg[1], 25, 18);
  g.beginPath(); g.moveTo(-19, 6); g.lineTo(-24, -58); g.quadraticCurveTo(-32, -99, -12, -104); g.lineTo(12, -104); g.quadraticCurveTo(32, -99, 24, -58); g.lineTo(19, 6); g.closePath(); g.fill();
  g.fillRect(-6, -114, 12, 14);
  g.beginPath(); g.ellipse(F.look || 0, -128, 19, 21, 0, 0, 6.283); g.fill();
  limb(ar[0], 17, 14); limb(ar[1], 17, 14);
  // helle Mitte (Glut im Rumpf)
  g.fillStyle = radial(g, 0, -70, 60, [[0, `rgba(255,252,225,${.55 * on})`], [1, 'rgba(255,245,200,0)']]); g.fillRect(-60, -130, 120, 120);
  // Pinselflocken an den Rändern (dunkel-orange Blättchen, wie im Original)
  const parts = [[[-16, 4], [-21, -58], [-12, -103]], [[16, 4], [21, -58], [12, -103]], ar[0], ar[1], [[0, -110], [0, -110], [0, -147]], [[-6, -112], [-6, -112], [6, -112]], [[-17, -128], [-17, -128], [17, -128]], lg[0], lg[0], lg[1], lg[1]];
  const pw = [10, 10, 7, 7, 17, 6, 17, 10, 10, 10, 10];
  for (const f of flecks(F.id || 1)) {
    const pp = parts[f.part]; const u = f.u; let a0, a1, uu;
    if (f.part >= 7) { const hi = f.part % 2 === 1; a0 = hi ? pp[0] : pp[1]; a1 = hi ? pp[1] : pp[2]; uu = u; } else { const first = u < .5; a0 = first ? pp[0] : pp[1]; a1 = first ? pp[1] : pp[2]; uu = first ? u * 2 : u * 2 - 1; }
    const x = mix(a0[0], a1[0], uu), y = mix(a0[1], a1[1], uu); let dx = a1[0] - a0[0], dy = a1[1] - a0[1]; const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
    const off = (f.inset ? .3 : 1) * pw[f.part] * f.side; const px = x - dy * off, py = y + dx * off;
    const ang = Math.atan2(-dx * f.side, dy * f.side) + f.ang; const sz = f.sz * (y > 0 ? 1.15 : .8);
    g.fillStyle = f.dark < .5 ? mixc('#8a3a14', '#3a2012', dim * .6) : mixc('#c0561c', '#4a2a18', dim * .6);
    g.globalAlpha = al * (.55 + .45 * f.dark);
    g.beginPath(); g.moveTo(px + Math.cos(ang) * sz, py + Math.sin(ang) * sz); g.lineTo(px + Math.cos(ang + 2.5) * sz * .45, py + Math.sin(ang + 2.5) * sz * .45); g.lineTo(px + Math.cos(ang - 2.5) * sz * .45, py + Math.sin(ang - 2.5) * sz * .45); g.closePath(); g.fill();
  }
  g.globalAlpha = al;
  // Augen
  const ey = -129, lx = F.look || 0;
  if (!F.back) { g.fillStyle = `rgba(255,255,250,${.35 + .65 * on})`; [[lx - 6.5, ey], [lx + 6.5, ey]].forEach(([x, y]) => { g.beginPath(); g.arc(x, y, 4.6, 0, 6.283); g.fill(); }); }
  g.restore();
  // Glühen
  e.save(); e.globalAlpha = al * on; tf(e); e.fillStyle = 'rgba(255,170,70,.42)'; e.strokeStyle = 'rgba(255,170,70,.42)'; e.lineCap = 'round';
  e.beginPath(); e.moveTo(-16, 4); e.lineTo(-22, -100); e.lineTo(22, -100); e.lineTo(16, 4); e.fill(); e.beginPath(); e.arc(lx, -128, 20, 0, 6.283); e.fill();
  [...lg, ...ar].forEach(p => { e.lineWidth = 18; e.beginPath(); e.moveTo(...p[0]); e.lineTo(...p[1]); e.lineTo(...p[2]); e.stroke(); });
  if (!F.back) { e.fillStyle = 'rgba(255,255,255,1)'; [[lx - 6.5, ey], [lx + 6.5, ey]].forEach(([x, y]) => { e.beginPath(); e.arc(x, y, 9, 0, 6.283); e.fill(); }); }
  e.restore();
}
// Posen
const POSE = {
  stand: { arms: [-.12, .08, .12, -.08], legs: [-.05, 0, .05, 0] },
};
function walk(ph, amp = 1) { const s = Math.sin(ph), c2 = Math.cos(ph); return { arms: [-.1 - .35 * s * amp, .25, .1 + .35 * s * amp, .25], legs: [.38 * s * amp, Math.max(0, -c2) * .6 * amp, -.38 * s * amp, Math.max(0, c2) * .6 * amp] }; }

// ---------- Gegenstände ----------
function umbrella(g, x, y, w, col, holes = 0, hcol = '#000', seed = 1, open = 1, handle = '#cfc6ae') {
  if (open <= 0) return; const r = w / 2, hh = r * .62 * open;
  g.save(); g.translate(x, y);
  g.strokeStyle = handle; g.lineWidth = Math.max(3, w * .035); g.lineCap = 'round';
  g.beginPath(); g.moveTo(0, -hh); g.lineTo(0, r * 1.05); g.arc(-r * .1, r * 1.05, r * .1, 0, Math.PI); g.stroke();
  g.fillStyle = col; g.beginPath(); g.moveTo(-r * open, 0);
  g.bezierCurveTo(-r * open, -hh * 1.3, r * open, -hh * 1.3, r * open, 0);
  const n = 5; for (let i = n; i > 0; i--) { const x1 = r * open * (2 * (i - 1) / n - 1), xm = r * open * (2 * (i - .5) / n - 1); g.quadraticCurveTo(xm + (r * open * 2 / n) * .0, -hh * .22, x1, 0); }
  g.closePath(); g.fill();
  if (holes) { const rr = rng(seed); g.fillStyle = hcol; for (let i = 0; i < holes; i++) { g.beginPath(); g.ellipse((rr() - .5) * r * 1.1, -hh * (.25 + rr() * .5), w * (.05 + rr() * .04), w * (.035 + rr() * .03), rr(), 0, 6.283); g.fill(); } }
  g.restore();
}
function house(g, x, y, w, h, wall, roof, win, door = '#3a3040', lit = 0) {
  // x,y = Mitte unten
  rect(g, x - w / 2, y - h, w, h, wall);
  poly(g, [[x - w / 2 - w * .08, y - h + 4], [x, y - h - w * .45], [x + w / 2 + w * .08, y - h + 4]], roof);
  rect(g, x + w * .22, y - h - w * .42, w * .09, w * .22, roof);
  const ww = w * .2, wh = h * .3;
  [[x - w * .33, y - h * .72], [x + w * .13, y - h * .72]].forEach(([wx, wy]) => rect(g, wx, wy, ww, wh, win));
  rect(g, x - w * .07, y - h * .48, w * .16, h * .48, door);
}
function bike(g, x, y, ang, spin, col = '#bdb6a4') {
  // x,y = Aufstandspunkt Vorderrad; ang>0 hebt das Hinterrad
  g.save(); g.translate(x, y); g.rotate(ang); g.translate(-85, -46);
  g.strokeStyle = col; g.lineCap = 'round'; g.lineJoin = 'round';
  for (const wx of [-85, 85]) { g.lineWidth = 8; g.beginPath(); g.arc(wx, 0, 44, 0, 6.283); g.stroke(); g.lineWidth = 2.5; for (let k = 0; k < 4; k++) { const a = spin + k * Math.PI / 4; g.beginPath(); g.moveTo(wx + Math.cos(a) * 42, Math.sin(a) * 42); g.lineTo(wx - Math.cos(a) * 42, -Math.sin(a) * 42); g.stroke(); } }
  g.lineWidth = 8; g.beginPath(); g.moveTo(-85, 0); g.lineTo(-10, 0); g.lineTo(-34, -70); g.lineTo(58, -70); g.lineTo(-10, 0); g.moveTo(58, -70); g.lineTo(85, 0); g.moveTo(58, -70); g.lineTo(52, -96); g.lineTo(78, -100); g.moveTo(-34, -70); g.lineTo(-38, -86); g.stroke();
  g.lineWidth = 10; g.beginPath(); g.moveTo(-52, -88); g.lineTo(-24, -88); g.stroke();
  g.restore();
}
// Lichtspur mit glühendem Kopf (Voyager-Spur des Originals)
function trail(c, pts, a, b, col, glowCol, width, headR = 0, alpha = 1) {
  // pts: Polyline; a,b: sichtbarer Abschnitt 0..1
  if (b <= a || alpha <= 0) return; const { g, e } = c;
  const L = []; let tot = 0; for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); L.push(d); tot += d; }
  const at = u => { let d = u * tot; for (let i = 0; i < L.length; i++) { if (d <= L[i]) { const k = d / L[i]; return [mix(pts[i][0], pts[i + 1][0], k), mix(pts[i][1], pts[i + 1][1], k)]; } d -= L[i]; } return pts[pts.length - 1]; };
  const seg = []; const n = 60; for (let i = 0; i <= n; i++) seg.push(at(mix(a, b, i / n)));
  for (const [cx, lw, st] of [[g, width, col], [e, width * 2.4, glowCol]]) { cx.save(); cx.globalAlpha = alpha; cx.strokeStyle = st; cx.lineWidth = lw; cx.lineCap = 'round'; cx.beginPath(); seg.forEach((p, i) => i ? cx.lineTo(...p) : cx.moveTo(...p)); cx.stroke(); cx.restore(); }
  if (headR > 0) { const h = at(b); g.save(); g.globalAlpha = alpha; g.fillStyle = '#fffbe8'; g.beginPath(); g.arc(h[0], h[1], headR, 0, 6.283); g.fill(); g.restore(); glowDot(e, h[0], h[1], headR * 5, 'rgba(255,240,200,1)', alpha); }
  return at;
}
function polyAt(pts) { const L = []; let tot = 0; for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); L.push(d); tot += d; }
  return u => { let d = clamp(u) * tot; for (let i = 0; i < L.length; i++) { if (d <= L[i]) { const k = d / L[i]; return [mix(pts[i][0], pts[i + 1][0], k), mix(pts[i][1], pts[i + 1][1], k)]; } d -= L[i]; } return pts[pts.length - 1]; }; }
function curve(p0, p1, p2, n = 24) { const r = []; for (let i = 0; i <= n; i++) { const u = i / n; r.push([(1 - u) * (1 - u) * p0[0] + 2 * (1 - u) * u * p1[0] + u * u * p2[0], (1 - u) * (1 - u) * p0[1] + 2 * (1 - u) * u * p1[1] + u * u * p2[1]]); } return r; }

// ---------- Regen (Überlage, scharf wie im Original) ----------
const RAIN = (() => { const r = rng(4242); return Array.from({ length: 170 }, () => ({ x: r() * 2100 - 90, y0: r() * 1200, v: 900 + r() * 500, l: 18 + r() * 26, a: .3 + r() * .5 })); })();
function rain(t, alpha, x0 = 0, x1 = W, dens = 1) {

    T.strokeStyle = `rgba(214,222,255,${d.a * alpha})`; T.lineWidth = 2; T.beginPath(); T.moveTo(x, y); T.lineTo(x - d.l * .06, y + d.l); T.stroke(); });

}
const STARS = (() => { const r = rng(99); return Array.from({ length: 150 }, () => ({ x: r() * W, y: r() * H, r: .6 + r() * r() * 1.8, ph: r() * 6.28 })); })();
function stars(c, t, a = 1) { scr(c); c.g.fillStyle = '#fff'; STARS.forEach(s => { c.g.globalAlpha = a * (.35 + .35 * Math.sin(t * 2 + s.ph)); c.g.beginPath(); c.g.arc(s.x, s.y, s.r * 1.4, 0, 6.283); c.g.fill(); }); c.g.globalAlpha = 1; }

// ---------- Funken ----------
function sparks(c, x, y, t0, t, n, seed, col = 'rgba(255,200,110,1)', spd = 260) {
  const dt = t - t0; if (dt < 0 || dt > 1.4) return; const r = rng(seed); const { g, e } = c;
  for (let i = 0; i < n; i++) { const a = -Math.PI * (.1 + .8 * r()), v = spd * (.4 + r()), life = .5 + r() * .8; if (dt > life) { r(); continue; }

    g.fillStyle = `rgba(255,230,160,${k})`; g.beginPath(); g.arc(px, py, 2.6, 0, 6.283); g.fill(); glowDot(e, px, py, 14, col, k); }
}

// =====================================================================================
// SZENEN
// =====================================================================================
// 1) Nacht, Regen, Laterne: Sturz vom Rad; Monde ziehen vorbei (monatelang)
function s1(c, t) {
  const { g, e } = c; const imp = K.sturz + .41;
  fillBG(c, [[0, '#0a0e2a'], [.55, P.navy2], [.8, '#1b2354'], [1, P.navy0]]);
  const sh = t > imp ? Math.exp(-(t - imp) * 6) * 16 * Math.sin((t - imp) * 55) : 0;
  const s = mix(1.3, 1.4, sine(lin(t, 0, K.cut.b)));
  cam(c, s, 1120, 650, 0, sh);
  // Mond (drei Monatsbögen)
  for (let k = 0; k < 3; k++) { const a0 = K.monate - .3 + k * .52, u = lin(t, a0, a0 + .72); if (u <= 0 || u >= 1) continue;
    const mx = mix(420, 1780, u), my = 560 - Math.sin(Math.PI * u) * 150, r = 46;
    g.fillStyle = '#e8e2cc'; g.beginPath(); g.arc(mx, my, r, 0, 6.283); g.fill();
    g.fillStyle = '#131a46'; const ph = [.55, 1.05, 3][k]; if (ph < 2) { g.beginPath(); g.arc(mx + r * ph, my - 6, r * 1.02, 0, 6.283); g.fill(); }
    glowDot(e, mx, my, 170, 'rgba(230,225,200,.7)'); }
  // Boden
