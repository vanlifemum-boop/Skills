    txt(X, euro(v), x, y, 88, a, { ls: .04, col: hot > 0 ? `rgb(255,${Math.round(mix(246, 150, hot))},${Math.round(mix(238, 130, hot))})` : '#fbf6ee' });
    arrow(X, x + 330, y - 20, 34, true, '#ff7a5e', a * eo(lin(t, K.steigt - .25, K.steigt - .02)));
  }
  // 3) Name wie der Titel des Originals, während die Blüte zur Solarzelle wird
  word(X, t, 'SONNENHOF SOLAR', 110, 118, 50, K.sonnenhof, { ls: .3, w: 500, until: K.cut.house + .2, sh: .8, shb: .9 });   // oben links wie der Titel „HELIOTROPE“ im Original, frei von der Blüte
  // 4) Etiketten am Haus (Planung am Dach, Anmeldung am Mast)
  if (HS.t === t && t > K.cut.house && t < K.cut.drop2 + .3) {
    const q = HS.roof, top = [(q[2][0] + q[3][0]) / 2, Math.min(q[2][1], q[3][1]) - 34];
    word(X, t, 'PLANUNG', top[0], top[1], 36, K.planung, { align: 'center', until: K.montage - .2 });
    word(X, t, 'ANMELDUNG', HS.pole[0], HS.pole[1] - 36, 36, K.anmeldung, { align: 'center', until: K.hand });
    // 5) Speicher: kleines Gerät an der Seitenwand -> Wort daneben mit Hinweislinie
    const bat = bil(HS.side, .085, .51), br = HS.side[1], lx = Math.min(br[0] + 40, W - 270), ly = bat[1] + 12;
    const la = eo(lin(t, K.speicher - .25, K.speicher - .02)) * (1 - lin(t, K.cut.drop2 - .1, K.cut.drop2 + .2));
    lead(X, [bat[0] + HS.s * .5, bat[1]], [lx - 10, bat[1]], la);
    word(X, t, 'SPEICHER', lx, ly, 36, K.speicher, { until: K.cut.drop2 + .2 });
  }
  // 6) Tropfen am Morgen: Betrag fällt, grüner Pfeil, −70 %
  if (t > K.cut.drop2 && t < K.cut.brand) { const a = eo(lin(t, K.rechnung - .25, K.rechnung - .02)) * (1 - lin(t, K.cut.brand - .45, K.cut.brand - .2));
    const v = mix(2140, 642, eio(lin(t, K.sinkt - .25, K.siebzig - .02))); const x = DROP.x + DROP.R + 95, y = DROP.y + 10;
    bolt(X, x - 38, y - 8, 64, a);
    txt(X, euro(v), x, y, 88, a, { ls: .04 });
    arrow(X, x + 330, y - 2, 34, false, '#9fe39a', a * eo(lin(t, K.sinkt - .25, K.sinkt - .02)));
    txt(X, '−70 %', x, y + 104, 88, a * eo(lin(t, K.siebzig - .25, K.siebzig - .02)), { ls: .06, col: '#b8f0a8', w: 500 });
  }
  // 7) Marke: Name, zwei Wörter Angebot, Kontakt
  if (t > K.cut.brand - .3) {
    word(X, t, 'SONNENHOF SOLAR', W / 2, 330, 96, K.sonnenhof2, { align: 'center', ls: .34 });
    X.save(); X.font = '400 40px CG'; X.letterSpacing = `${.22 * 40}px`; const w1 = X.measureText('DACH-CHECK ').width, w2 = X.measureText('KOSTENLOS').width; X.restore();
    const x0 = W / 2 - (w1 + w2) / 2;
    word(X, t, 'DACH-CHECK', x0, 420, 40, K.check, { col: '#fff0cf' });
    word(X, t, 'KOSTENLOS', x0 + w1, 420, 40, K.kostenlos, { col: '#fff0cf' });
    word(X, t, 'SONNENHOF-SOLAR.DE · 07531 88 20 40', W / 2, 900, 30, K.kostenlos + .4, { align: 'center', ls: .18 });
  }
}

const OUTC = document.getElementById('out'), OUT = OUTC.getContext('2d');
function seek(t) { t = clamp(t, 0, DUR); frame(t); }
window.FILM = { duration: DUR, width: W, height: H, ready: Promise.all([document.fonts.load('400 50px CG'), document.fonts.load('500 50px CG')]).then(() => { seek(0); return true; }), seek };
</script>
