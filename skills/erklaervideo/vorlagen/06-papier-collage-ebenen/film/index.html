<script>
'use strict';
// Pfotenhaus – V7 (nur Text/Hervorhebung/Timing neu, alle Zeiten aus K) in der Handschrift von „Moon Festival“ (Ring Hyacinth, p5.js): Papiercollage in Nachtblau mit
// gerissenen Kanten (weißer Faserkern), Faserkorn, Schlagschatten zwischen den Ebenen, getigerte Sticker-Katze mit
// Tintenkontur und weißem Schnittrand, Mond mit fehlendem Stück, Tiefenschärfe, warme Vignette. Reine Funktion von t.
const W = 1920, H = 1080;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v)), lin = (t, a, b) => clamp((t - a) / (b - a)), mix = (a, b, k) => a + (b - a) * k;

const eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const sine = x => -(Math.cos(Math.PI * clamp(x)) - 1) / 2;
const back = x => { x = clamp(x); const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

Object.assign(K, { ihr: .434, ist: .82, aber: 1.73, mit: 2.44, der: 2.68, hat: 4.494, keine: 4.704, leute: 6.25, ihrer: 6.75, sie: 10.23, eigenen: 10.66, und2: 13.49, frisches: 14.05, dazwischen: 15.35,
  bekommen: 18.674, aufs: 20.164, genie: 21.34, ihren: 21.67, und3: 22.5, ihre3: 22.73, das: 25.06 });

// ---------- Papier: Farbe + Faserkorn als Kachel ----------
function makePaper(col, seed, str = 1) {

  for (let i = 0; i < 26; i++) { const x = r() * 256, y = r() * 256, rr = 30 + r() * 70, a = (.035 + r() * .04) * str, lt = r() < .5;
    for (const dx of [-256, 0, 256]) for (const dy of [-256, 0, 256]) { const gr = g.createRadialGradient(x + dx, y + dy, 0, x + dx, y + dy, rr); gr.addColorStop(0, lt ? `rgba(255,250,240,${a})` : `rgba(20,10,0,${a})`); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(x + dx - rr, y + dy - rr, rr * 2, rr * 2); } }

    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a + .6) * l * .5, y + Math.sin(a + .6) * l * .5, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }

const PC = {}; const OUTC = document.getElementById('out'), X0 = OUTC.getContext('2d');
function pp(col, str = 1) { const key = col + str; if (!PC[key]) PC[key] = X0.createPattern(makePaper(col, col.length * 97 + Math.round(parseInt(col.slice(1), 16) % 9973), str), 'repeat'); return PC[key]; }
// Farben (gemessen am Original, siehe STILBIBEL.md)
const C = { n0: '#171b38', n1: '#1f2142', n2: '#292646', n3: '#353958', n4: '#484454', lil: '#6e6571', core: '#f1ebe1', cream: '#e7d8bf', moon: '#e6d6ad', star: '#e8d9b8',
  catO: '#e3a263', catS: '#cf6f36', catC: '#f3e2c4', ink: '#4a2818', pink: '#eea7a0', red: '#c8352c', gold: '#d9a441', teal: '#2f6d6a', wall: '#caa98f', wall2: '#b8927a' };

// ---------- gerissene Kanten ----------
// Kantenpunkte entlang x; y = base + Welligkeit + Zacken
function edge(x0, x1, base, seed, amp = 18, fq = .006, jag = 3.2) { const p = []; for (let x = x0; x <= x1 + 6; x += 6) { const y = base + (vn1(x * fq, seed) - .5) * 2 * amp + (vn1(x * fq * 4, seed + 7) - .5) * amp * .5 + (hsh(x, seed) - .5) * jag; p.push([x, y]); } return p; }

function torn(g, pts, dir, fill, seed, o = {}) {
  const far = dir > 0 ? 4000 : -4000, rim = o.rim ?? 1, sh = o.shadow ?? 1;
  const poly = (off) => { g.beginPath(); pts.forEach(([x, y], i) => { const k = off ? (2.5 + 7 * vn1(x * .02, seed + 3) + 2 * hsh(x, seed + 5)) * rim * dir : 0; i ? g.lineTo(x, y + k) : g.moveTo(x, y + k); }); g.lineTo(pts[pts.length - 1][0], far); g.lineTo(pts[0][0], far); g.closePath(); };
  g.save(); if (sh) { g.shadowColor = `rgba(8,6,20,${.55 * sh})`; g.shadowBlur = 22; g.shadowOffsetY = 7 * dir; }

// senkrechte Risskante (für Split und Übergänge): Fläche rechts (dir=1) oder links (dir=-1)
function tornV(g, x, seed, dir, fill, amp = 16) {
  const pts = []; for (let y = -20; y <= H + 26; y += 6) pts.push([x + (vn1(y * .008, seed) - .5) * 2 * amp + (hsh(y, seed) - .5) * 3.4, y]);
  const far = dir > 0 ? 6000 : -6000;
  const poly = off => { g.beginPath(); pts.forEach(([px, y], i) => { const k = off ? (2.5 + 7 * vn1(y * .02, seed + 3)) * dir : 0; i ? g.lineTo(px + k, y) : g.moveTo(px + k, y); }); g.lineTo(far, H + 30); g.lineTo(far, -30); g.closePath(); };

}
// ---------- Kleinteile aus Papier ----------
function shadowed(g, fn, blur = 14, oy = 5, a = .45) { g.save(); g.shadowColor = `rgba(10,6,20,${a})`; g.shadowBlur = blur; g.shadowOffsetY = oy; fn(); g.restore(); }

  if (glow > 0) { const gr = g.createRadialGradient(x, y, r * .8, x, y, r * 3.2); gr.addColorStop(0, `rgba(255,226,170,${.42 * glow})`); gr.addColorStop(.4, `rgba(220,180,140,${.14 * glow})`); gr.addColorStop(1, 'rgba(120,100,120,0)'); g.fillStyle = gr; g.fillRect(x - r * 3.3, y - r * 3.3, r * 6.6, r * 6.6); }

  shadowed(g, () => { path(); g.fillStyle = pp(C.core, .6); g.fill(); }, 16, 4, .5);
  g.save(); g.translate(0, 0); path(); g.clip();
  g.fillStyle = pp(C.moon, 1.2); g.beginPath(); g.arc(x, y, r - 4, 0, 6.283); g.fill();

  g.strokeStyle = 'rgba(140,110,70,.12)'; g.lineWidth = 1; for (let i = -r; i < r; i += r / 7) { g.beginPath(); g.moveTo(x + i, y - r); g.lineTo(x + i, y + r); g.stroke(); g.beginPath(); g.moveTo(x - r, y + i); g.lineTo(x + r, y + i); g.stroke(); }
  g.restore();
}
function cloud(g, x, y, s, col = '#b9b0d0', flip = 1) {
  shadowed(g, () => { g.save(); g.translate(x, y); g.scale(s * flip, s); g.fillStyle = pp(col, .9);
    g.beginPath(); g.moveTo(-120, 30); g.arc(-80, 0, 38, Math.PI * .9, Math.PI * 1.9); g.arc(-20, -22, 48, Math.PI * 1.1, Math.PI * 1.95); g.arc(48, -8, 40, Math.PI * 1.2, Math.PI * 2.1); g.arc(98, 12, 26, Math.PI * 1.3, Math.PI * 2.4); g.lineTo(120, 30); g.closePath(); g.fill(); g.restore(); }, 10, 4, .45);
  g.save(); g.translate(x, y); g.scale(s * flip, s); g.strokeStyle = 'rgba(120,100,140,.55)'; g.lineWidth = 2.2;
  for (const [cx, cy, rr] of [[-78, 4, 16], [-18, -14, 22], [48, 0, 17]]) { g.beginPath(); for (let a = 0; a < 9; a += .2) { const k = rr * (1 - a / 10); g.lineTo(cx + Math.cos(a) * k, cy + Math.sin(a) * k); } g.stroke(); }
  g.restore();
}
function vignette(X, a = .55) { const v = X.createRadialGradient(W / 2, H * .48, H * .3, W / 2, H / 2, H * 1.02); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, `rgba(12,4,10,${a})`); X.fillStyle = v; X.fillRect(0, 0, W, H); }

// =====================================================================================
// Die Katze (Sticker: weißer Schnittrand, Tintenkontur, Papierfarbe, Streifen, Kulleraugen)
// =====================================================================================
const INK = 6.5;
function catFront(g, x, y, s, o = {}) {
  // o: eyes ('open'|'wide'|'closed'|'angry'|'sad'), mouth ('o'|'smile'|'frown'|'hiss'), tilt, earsBack, pawUp (0..1), tail (Winkel), blink, look [dx,dy], spikes
  g.save(); g.translate(x, y); g.scale(s, s); g.rotate(o.bodyTilt || 0);
  const tilt = o.tilt || 0, eb = o.earsBack || 0, lk = o.look || [0, 0];
  const tailA = o.tail ?? 0;
  const tailPath = () => { g.beginPath(); g.moveTo(70, 190); g.bezierCurveTo(170, 210 + tailA * 30, 190, 120 - tailA * 60, 150 + tailA * 20, 70 - tailA * 40); };
  const bodyPath = () => { g.beginPath(); g.ellipse(0, 132, 98, 96, 0, 0, 6.283); };
  const earP = sd => { const bx = sd * 60, tipx = sd * mix(92, 118, eb), tipy = mix(-132, -84, eb); g.beginPath(); g.moveTo(bx - sd * 38, -62); g.quadraticCurveTo(tipx - sd * 4, tipy - 6, tipx, tipy); g.quadraticCurveTo(sd * 102, -60, sd * 96, -26); g.closePath(); };
  const headP = () => { g.beginPath(); g.ellipse(0, 0, 104, 94, 0, 0, 6.283); };
  // 1) weißer Schnittrand + Schatten
  g.save(); g.shadowColor = 'rgba(10,6,18,.5)'; g.shadowBlur = 22; g.shadowOffsetY = 10;
  g.fillStyle = pp(C.core, .5); g.strokeStyle = pp(C.core, .5); g.lineWidth = 24; g.lineJoin = 'round'; g.lineCap = 'round';
  tailPath(); g.lineWidth = 56; g.stroke(); g.lineWidth = 24;
  bodyPath(); g.fill(); g.stroke(); g.save(); g.rotate(tilt); earP(-1); g.fill(); g.stroke(); earP(1); g.fill(); g.stroke(); headP(); g.fill(); g.stroke(); g.restore();
  if (o.spikes) { g.beginPath(); for (let i = 0; i < 26; i++) { const a = -Math.PI * .95 + i / 25 * Math.PI * .9; const r1 = 110 + (i % 2 ? 26 * o.spikes : 0); g.lineTo(Math.cos(a) * r1 * 1.05, 120 + Math.sin(a) * r1); } g.lineWidth = 24; g.stroke(); }
  g.restore();
  g.lineJoin = 'round'; g.lineCap = 'round'; g.strokeStyle = C.ink; g.lineWidth = INK;
  // 2) Schwanz
  tailPath(); g.lineWidth = 34 + INK * 2; g.strokeStyle = C.ink; g.stroke(); g.lineWidth = 34; g.strokeStyle = pp(C.catO); g.stroke();
  g.save(); tailPath(); g.lineWidth = 34; g.setLineDash([10, 22]); g.strokeStyle = pp(C.catS); g.stroke(); g.restore();
  // 3) Körper
  if (o.spikes) { g.fillStyle = pp(C.catO); g.beginPath(); for (let i = 0; i < 26; i++) { const a = -Math.PI * .95 + i / 25 * Math.PI * .9; const r1 = 100 + (i % 2 ? 22 * o.spikes : 0); g.lineTo(Math.cos(a) * r1 * 1.05, 128 + Math.sin(a) * r1); } g.fill(); g.lineWidth = INK; g.strokeStyle = C.ink; g.stroke(); }
  bodyPath(); g.fillStyle = pp(C.catO); g.fill(); g.lineWidth = INK; g.strokeStyle = C.ink; g.stroke();
  g.save(); bodyPath(); g.clip(); g.fillStyle = pp(C.catC); g.beginPath(); g.ellipse(0, 150, 56, 70, 0, 0, 6.283); g.fill();
  g.strokeStyle = pp(C.catS); g.lineWidth = 12; for (const [a, b, c2, d] of [[-96, 110, -62, 118], [-98, 150, -66, 154], [96, 110, 62, 118], [98, 150, 66, 154]]) { g.beginPath(); g.moveTo(a, b); g.lineTo(c2, d); g.stroke(); } g.restore();
  // Pfoten
  const pu = o.pawUp || 0;
  for (const sd of [-1, 1]) { const up = sd > 0 ? pu : 0; const px = sd * 34 + up * 30, py = 212 - up * 110;
    g.save(); g.translate(px, py); g.rotate(sd * .05 - up * .9); g.fillStyle = pp(C.catO); g.beginPath(); g.ellipse(0, 0, 26, 20 + up * 14, 0, 0, 6.283); g.fill(); g.lineWidth = INK; g.stroke();
    g.lineWidth = 3; g.beginPath(); g.moveTo(-8, 6); g.lineTo(-8, 16); g.moveTo(8, 6); g.lineTo(8, 16); g.stroke(); g.restore(); }
  // 4) Kopf
  g.save(); g.translate(0, 0); g.rotate(tilt);
  for (const sd of [-1, 1]) { earP(sd); g.fillStyle = pp(C.catO); g.fill(); g.lineWidth = INK; g.strokeStyle = C.ink; g.stroke();
    g.save(); g.translate(sd * 70, -70); g.scale(.55, .55); g.translate(-sd * 70, 70); earP(sd); g.fillStyle = pp(C.pink); g.fill(); g.restore(); }
  headP(); g.fillStyle = pp(C.catO); g.fill(); g.lineWidth = INK; g.strokeStyle = C.ink; g.stroke();
  g.save(); headP(); g.clip();
  // Maul-Feld
  g.fillStyle = pp(C.catC); g.beginPath(); g.moveTo(-70, 60); g.bezierCurveTo(-70, 10, -30, 12, 0, 22); g.bezierCurveTo(30, 12, 70, 10, 70, 60); g.bezierCurveTo(60, 100, -60, 100, -70, 60); g.fill();
  // Streifen
  g.fillStyle = pp(C.catS); for (const [sx, h] of [[-26, 46], [0, 56], [26, 46]]) { g.beginPath(); g.moveTo(sx - 7, -94); g.lineTo(sx + 7, -94); g.lineTo(sx + 2, -94 + h); g.lineTo(sx - 2, -94 + h); g.closePath(); g.fill(); }
  for (const sd of [-1, 1]) for (const yy of [-8, 18]) { g.beginPath(); g.moveTo(sd * 106, yy - 6); g.lineTo(sd * 106, yy + 6); g.lineTo(sd * 76, yy + 2); g.lineTo(sd * 76, yy); g.closePath(); g.fill(); }

  const eyes = o.eyes || 'open', blink = o.blink || 0;

    if (eyes === 'closed' || blink > .85) { g.strokeStyle = C.ink; g.lineWidth = 5; g.beginPath(); g.arc(cx, cy - 4, 18, .2 * Math.PI, .8 * Math.PI); g.stroke(); continue; }
    const ry = (eyes === 'wide' ? 34 : eyes === 'angry' ? 18 : 29) * (1 - blink), rx = eyes === 'wide' ? 30 : 26;
    g.save(); g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, 6.283); const gr = g.createLinearGradient(0, cy - ry, 0, cy + ry); gr.addColorStop(0, '#2a1208'); gr.addColorStop(.6, '#4a2410'); gr.addColorStop(1, '#8a5a2a'); g.fillStyle = gr; g.fill(); g.lineWidth = 4; g.strokeStyle = C.ink; g.stroke();
    g.clip(); g.fillStyle = '#fff'; g.beginPath(); g.arc(cx - rx * .3, cy - ry * .38, rx * .36, 0, 6.283); g.fill(); g.beginPath(); g.arc(cx + rx * .35, cy + ry * .32, rx * .16, 0, 6.283); g.fill();
    g.fillStyle = 'rgba(255,220,180,.35)'; g.beginPath(); g.ellipse(cx, cy + ry * .55, rx * .7, ry * .3, 0, 0, 6.283); g.fill(); g.restore();
    if (eyes === 'angry') { g.strokeStyle = C.ink; g.lineWidth = 6; g.beginPath(); g.moveTo(cx - 24 * (i ? -1 : 1), cy - 30); g.lineTo(cx + 18 * (i ? -1 : 1), cy - 20); g.stroke(); }

  }

  g.fillStyle = '#5a2a1c'; g.beginPath(); g.moveTo(-9, 34); g.lineTo(9, 34); g.lineTo(0, 44); g.closePath(); g.fill();
  const m = o.mouth || 'smile'; g.strokeStyle = C.ink; g.lineWidth = 4.5;
  if (m === 'o') { g.fillStyle = '#8a2a20'; g.beginPath(); g.ellipse(0, 60, 9, 11, 0, 0, 6.283); g.fill(); g.stroke(); }
  else if (m === 'hiss') { g.fillStyle = '#6a1a18'; g.beginPath(); g.moveTo(-22, 54); g.quadraticCurveTo(0, 90, 22, 54); g.closePath(); g.fill(); g.stroke(); g.fillStyle = '#fff'; g.beginPath(); g.moveTo(-14, 56); g.lineTo(-9, 68); g.lineTo(-5, 56); g.moveTo(14, 56); g.lineTo(9, 68); g.lineTo(5, 56); g.fill(); }
  else if (m === 'frown') { g.beginPath(); g.moveTo(-12, 64); g.quadraticCurveTo(0, 54, 12, 64); g.stroke(); }

  // Schnurrhaare: innen dunkel, außen als weiße Papierstreifen
  for (const sd of [-1, 1]) for (const [yy, dy] of [[36, -8], [48, 0], [60, 8]]) {
    g.strokeStyle = 'rgba(74,40,24,.8)'; g.lineWidth = 2; g.beginPath(); g.moveTo(sd * 40, yy); g.lineTo(sd * 104, yy + dy); g.stroke();
    g.strokeStyle = '#f5efe4'; g.lineWidth = 5; g.beginPath(); g.moveTo(sd * 104, yy + dy); g.lineTo(sd * 150, yy + dy * 1.6); g.stroke(); g.strokeStyle = 'rgba(74,40,24,.5)'; g.lineWidth = 1.2; g.stroke(); }

  g.restore();
}
// Katze von hinten (Schlussbild des Originals)
function catBack(g, x, y, s, o = {}) {

const L = { A: [mk(), mk()], B: [mk(), mk()] }; const TBc = mk(), TB = TBc.getContext('2d');
