<script>
// V5 – Bildsprache des Shotbase-Launchvideos: geblurrtes macOS-Wallpaper / Galerie-Weiß, weiße Werkzeugleiste,
// großer macOS-Zeiger, echtes Material in Karten.
// V7: keine mitgebauten Sätze mehr. Text nur als Beschriftung am UI-Objekt (ein Wort/Name/Zahl) plus zwei Headlines
// wie im Original ("30 Minuten", Schlusszeile), jeweils als Ganzes, fertig auf dem Wort. Alle Zeiten aus K/CUT (zeiten.js).
const W = 1920, H = 1080;
const cv = document.getElementById('c'), X = cv.getContext('2d');
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v)), lin = (t, a, b) => clamp((t - a) / (b - a)), mix = (a, b, k) => a + (b - a) * k;

const back = x => { if (x <= 0) return 0; if (x >= 1) return 1; const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function rr(g, x, y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function hex(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mixc(a, b, k) { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(mix(v, B[i], k))).join(',')})`; }
function mixa(a, b, k) { return '#' + hex(a).map((v, i) => Math.round(mix(v, hex(b)[i], k)).toString(16).padStart(2, '0')).join(''); }
const F = (w, s) => `${w} ${s}px SF`;
const C = { white: '#fafafa', bar: '#f7f7f7', edge: '#e1e6e8', icon: '#8e8e93', label: '#a2a2a2', cyan: '#1fb9ee', ink: '#0a0a0a', ink2: '#393939',
  gray: '#a2a2a2', navy: '#0d3989', blue: '#2365dc', fresh: '#97ceea', freshD: '#6d97a7', sum: '#43a9c6', red: '#ff1a1a', key: '#1c1c1e', glow: '#6a7dff',
  yel: '#f0c46b', mag: '#ba35ff', bl2: '#2f66e8' };

// ---------- Ebenen mit Blur (Grundgeste: Blur-in / Blur-out) ----------
const pool = []; let depth = 0;
function lay(g, b, a, fn) {
  if (a <= .004) return;
  if (b < .35) { g.save(); g.globalAlpha *= a; fn(g); g.restore(); return; }
  const c = pool[depth] || (pool[depth] = mk(W, H)); depth++;
  const lg = c.getContext('2d'); lg.setTransform(1, 0, 0, 1, 0, 0); lg.clearRect(0, 0, W, H); lg.globalAlpha = 1; lg.filter = 'none';
  lg.setTransform(g.getTransform()); fn(lg); depth--;
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha *= a; g.filter = `blur(${b.toFixed(1)}px)`; g.drawImage(c, 0, 0); g.restore();
}
// Blur-in/out Parameter: gibt [blur, alpha, scale] für Ein- (a0..a1) und Ausblendung (o0..o1)
function bio(t, a0, a1, o0 = 1e9, o1 = 1e9, bmax = 36) {
  const p = ex(lin(t, a0, a1)), q = eio(lin(t, o0, o1));
  return { b: bmax * (1 - p) + bmax * q, a: p * (1 - q), s: mix(.9, 1, p) + .06 * q, p, q };
}
function drift(g, t, t0, k = 1, px = -16, py = 3) { const d = Math.max(0, t - t0); scaleAt(g, 1 + .013 * d * k, 960, 540); g.translate(px * d, py * d); }
function scaleAt(g, s, x, y) { g.translate(x, y); g.scale(s, s); g.translate(-x, -y); }

// ---------- Wallpaper: riesig geblurrte, fließende Farbbänder ----------
const WP = { dark: ['#07142d', '#44443d', '#2a323b', '#192a41', '#010a2f', '#0c2441', '#2d3a48', '#171816'],
  blue: ['#0a4390', '#8e8f86', '#b4c8d0', '#4f7f9a', '#022783', '#1b5fa6', '#7fb0d0', '#608396'],
  light: ['#6f9fda', '#dfe6ea', '#ffffff', '#9cbee0', '#6599d9', '#8db4e2', '#e6eef6', '#c8d8ea'] };
const wa = mk(320, 180), wb = mk(320, 180), wag = wa.getContext('2d'), wbg = wb.getContext('2d');
function wallpaper(g, t, kBlue, kLight = 0) {
  const P = WP.dark.map((c, i) => { const m1 = mixa(c, WP.blue[i], kBlue); return mixa(m1, WP.light[i], kLight); });
  const s = 320 / 1920, T = t * .42;
  wag.setTransform(1, 0, 0, 1, 0, 0); wag.fillStyle = P[0]; wag.fillRect(0, 0, 320, 180); wag.scale(s, s);
  const band = (col, w, pts, al = 1) => { wag.globalAlpha = al; wag.strokeStyle = col; wag.lineWidth = w; wag.lineCap = 'round'; wag.beginPath(); wag.moveTo(pts[0], pts[1]); wag.bezierCurveTo(pts[2], pts[3], pts[4], pts[5], pts[6], pts[7]); wag.stroke(); wag.globalAlpha = 1; };
  const sn = (f, p, a) => Math.sin(T * f + p) * a;
  // unten rechts Mittelblau, großer Navy-Schwung, Petrol-Band, helle Lichtkante, Oliv-Ecke oben links
  wag.fillStyle = P[5]; wag.beginPath(); wag.ellipse(1500 + sn(.5, 1, 80), 1000, 900, 420, -.3, 0, 7); wag.fill();
  band(P[4], 420, [-200, 1080 + sn(.6, 0, 50), 500, 560 + sn(.8, 1, 60), 1150, 820 + sn(.5, 2, 70), 2200, 520 + sn(.7, 3, 60)]);
  band(P[3], 300, [-250, 640 + sn(.7, 1, 50), 500, 330 + sn(.6, 2, 60), 1200, 470 + sn(.9, 0, 60), 2200, 120 + sn(.5, 1, 50)]);
  band(P[2], 120, [-150, 560 + sn(.8, 2, 50), 520, 250 + sn(.7, 1, 60), 1180, 380 + sn(.6, 3, 60), 2150, 60 + sn(.6, 2, 50)], .95);
  band(P[6], 70, [700, 1150, 1100 + sn(.6, 1, 60), 820, 1500, 900 + sn(.5, 2, 60), 2150, 640], .8);
  wag.fillStyle = P[1]; wag.beginPath(); wag.ellipse(180 + sn(.7, 1, 50), 60 + sn(.5, 2, 30), 560, 260, -.3, 0, 7); wag.fill();
  band(P[7], 160, [-100, 300 + sn(.6, 2, 40), 300, 180, 700, 120 + sn(.7, 0, 40), 1100, -60], .8);
  wbg.setTransform(1, 0, 0, 1, 0, 0); wbg.filter = 'blur(7px)'; wbg.drawImage(wa, -20, -20, 360, 220); wbg.filter = 'none';
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.imageSmoothingQuality = 'high'; g.drawImage(wb, 12, 12, 296, 156, 0, 0, W, H); g.restore();
}

// ---------- Headline Wort für Wort (aus Unschärfe, frisches Wort hellblau) ----------
// words: [[text, zeit, farbe?]]; Wort ist zur Zeit vollständig da (Einblendung 0,3 s davor)
function headline(g, words, cx, y, size, t, o = {}) {
  const dark = !o.onWhite, wgt = o.w || 560, ls = -size * .03, out0 = o.out ?? 1e9;
  g.save(); g.font = F(wgt, size); g.letterSpacing = ls + 'px'; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  const sp = g.measureText(' ').width, ws = words.map(w => g.measureText(w[0]).width);
  const total = ws.reduce((a, b) => a + b, 0) + sp * (ws.length - 1);
  let x = o.left ? cx : cx - total / 2;
  const oq = eio(lin(t, out0, out0 + .28));
  words.forEach((w, i) => {
    const t0 = w[1] - .3, p = ex(lin(t, t0, w[1])), set = eo(lin(t, w[1], w[1] + .6));
    if (p > 0 && oq < 1) {
      const fin = w[2] || (dark ? '#ffffff' : C.ink), fr = dark ? C.fresh : C.freshD;
      g.fillStyle = w[2] ? mixc(fr, fin, set) : mixc(fr, fin, set);
      const b = 14 * (1 - p) + 20 * oq; g.filter = b > .3 ? `blur(${b.toFixed(1)}px)` : 'none';
      g.globalAlpha = p * (1 - oq); g.fillText(w[0], x, y + 10 * (1 - p) + 18 * oq);
    }
    x += ws[i] + sp;
  });
  g.restore();
  return total;
}

// ---------- macOS-Zeiger ----------
const ARROW = [[0, 0], [0, 23], [5.6, 17.6], [9.6, 26.8], [13.4, 25.2], [9.5, 16.4], [16.8, 16.4]];
function pointer(g, x, y, rot = 0, press = 0, a = 1, s = 3.1) {
  if (a <= 0) return; g.save(); g.globalAlpha *= a; g.translate(x, y); g.rotate(rot); const k = s * (1 - press * .12); g.scale(k, k);
  g.shadowColor = 'rgba(0,0,0,.35)'; g.shadowBlur = 10; g.shadowOffsetY = 3;
  g.beginPath(); ARROW.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath();
  g.lineJoin = 'round'; g.strokeStyle = '#fff'; g.lineWidth = 2.6; g.stroke(); g.shadowColor = 'transparent'; g.fillStyle = '#000'; g.fill(); g.restore();
}
// Pfad: [[t, x, y, klick?]]; Zeiger gleitet mit expo-Kurven, kippt in Bewegungsrichtung
function path(keys, t) {
  let i = 0; while (i < keys.length - 1 && t > keys[i + 1][0]) i++;
  const A = keys[i], B = keys[Math.min(i + 1, keys.length - 1)];
  const d = Math.max(.001, B[0] - A[0]), k = t <= A[0] ? 0 : eio(clamp((t - A[0]) / d));
  const x = mix(A[1], B[1], k), y = mix(A[2], B[2], k);
  const v = (B[1] - A[1]) * (k > 0 && k < 1 ? Math.sin(Math.PI * clamp((t - A[0]) / d)) : 0) / (d * 2400);
  let press = 0; for (const q of keys) if (q[3]) press = Math.max(press, 1 - Math.abs(t - q[0]) / .09);
  return { x, y, rot: clamp(v, -.35, .35) - .08, press: clamp(press) };
}

// ---------- Strichicons (grau, 3 px) ----------
function icon(g, kind, x, y, s, col = C.icon, lw = 3) {
  g.save(); g.translate(x, y); g.strokeStyle = col; g.fillStyle = col; g.lineWidth = lw; g.lineCap = 'round'; g.lineJoin = 'round'; const h = s / 2;
  if (kind === 'photo') { rr(g, -h, -h * .8, s, s * .8, 5); g.stroke(); g.beginPath(); g.moveTo(-h + 4, h * .6); g.lineTo(-h * .2, -h * .05); g.lineTo(h * .2, h * .3); g.lineTo(h * .45, h * .1); g.lineTo(h - 4, h * .6); g.stroke(); g.beginPath(); g.arc(h * .4, -h * .38, 3, 0, 7); g.fill(); }
  else if (kind === 'cam') { rr(g, -h, -h * .62, s, s * .78, 6); g.stroke(); g.beginPath(); g.arc(0, h * .06, h * .36, 0, 7); g.stroke(); rr(g, -h * .35, -h * .86, h * .7, h * .3, 3); g.stroke(); }
  else if (kind === 'warn') { g.beginPath(); g.moveTo(0, -h); g.lineTo(h, h * .8); g.lineTo(-h, h * .8); g.closePath(); g.stroke(); g.beginPath(); g.moveTo(0, -h * .25); g.lineTo(0, h * .25); g.stroke(); g.beginPath(); g.arc(0, h * .52, 1.8, 0, 7); g.fill(); }
  else if (kind === 'wrench') { g.beginPath(); g.moveTo(-h * .8, h * .8); g.lineTo(h * .15, -h * .15); g.stroke(); g.beginPath(); g.arc(h * .42, -h * .42, h * .42, 2.6, 2.6 + 5.2); g.stroke(); }
  else if (kind === 'bars') { [-.6, 0, .6].forEach((q, i) => { g.beginPath(); g.moveTo(q * h, h * .8); g.lineTo(q * h, h * (.8 - [.7, 1.5, 1.05][i])); g.stroke(); }); }
  else if (kind === 'doc') { rr(g, -h * .72, -h, h * 1.44, s, 4); g.stroke(); [-.4, 0, .4].forEach(q => { g.beginPath(); g.moveTo(-h * .38, q * h); g.lineTo(h * .38, q * h); g.stroke(); }); }
  else if (kind === 'phone') { g.beginPath(); g.moveTo(-h * .7, -h * .8); g.quadraticCurveTo(-h * .9, h * .2, h * .2, h * .85); g.lineTo(h * .75, h * .4); g.lineTo(h * .25, -.05 * h); g.lineTo(0, h * .2); g.quadraticCurveTo(-h * .35, 0, -h * .3, -h * .35); g.lineTo(-h * .05, -h * .6); g.lineTo(-h * .4, -h); g.closePath(); g.fill(); }
  else if (kind === 'house') { g.beginPath(); g.moveTo(-h * .8, -h * .05); g.lineTo(0, -h * .8); g.lineTo(h * .8, -h * .05); g.stroke(); rr(g, -h * .55, -h * .2, h * 1.1, h * .95, 3); g.stroke(); rr(g, -h * .15, h * .25, h * .3, h * .5, 2); g.fill(); }
  else if (kind === 'x') { g.beginPath(); g.moveTo(-h * .5, -h * .5); g.lineTo(h * .5, h * .5); g.moveTo(h * .5, -h * .5); g.lineTo(-h * .5, h * .5); g.stroke(); }
  else if (kind === 'check') { g.beginPath(); g.moveTo(-h * .6, 0); g.lineTo(-h * .15, h * .45); g.lineTo(h * .65, -h * .5); g.stroke(); }
  else if (kind === 'bubble') { g.beginPath(); g.ellipse(0, -h * .1, h, h * .78, 0, 0, 7); g.fill(); g.beginPath(); g.moveTo(-h * .55, h * .4); g.lineTo(-h * .8, h * .95); g.lineTo(-h * .1, h * .6); g.fill(); }
  else if (kind === 'clock') { g.beginPath(); g.arc(0, 0, h * .9, 0, 7); g.stroke(); g.beginPath(); g.moveTo(0, -h * .5); g.lineTo(0, 0); g.lineTo(h * .35, h * .2); g.stroke(); }
  else if (kind === 'pin') { g.beginPath(); g.arc(0, -h * .2, h * .55, Math.PI * .85, Math.PI * 2.15); g.lineTo(0, h * .95); g.closePath(); g.stroke(); g.beginPath(); g.arc(0, -h * .2, h * .18, 0, 7); g.fill(); }

}
function domusMark(g, x, y, s, a = 1) { // Logo: cyan Kachel mit weißem Haus
  g.save(); g.globalAlpha *= a; const gr = g.createLinearGradient(x, y - s / 2, x, y + s / 2); gr.addColorStop(0, '#3cc8f4'); gr.addColorStop(1, '#12a6e0');
  g.fillStyle = gr; rr(g, x - s / 2, y - s / 2, s, s, s * .26); g.fill(); icon(g, 'house', x, y + s * .02, s * .56, '#fff', s * .065); g.restore();
}

// ---------- Weiße schwebende Leiste ----------
function panel(g, x, y, w, h, r, o = {}) {
  g.save(); g.shadowColor = o.shadow || 'rgba(8,26,70,.28)'; g.shadowBlur = o.sb ?? 70; g.shadowOffsetY = o.sy ?? 22;
  const gr = g.createLinearGradient(0, y, 0, y + h); gr.addColorStop(0, o.top || '#fbfbfb'); gr.addColorStop(1, o.bot || '#f3f3f3');
  g.fillStyle = gr; rr(g, x, y, w, h, r); g.fill(); g.restore();
  g.save(); g.strokeStyle = o.edge || '#dfe3e6'; g.lineWidth = 1.5; rr(g, x + .75, y + .75, w - 1.5, h - 1.5, r); g.stroke(); g.restore();
}
function small(g, s, x, y, size, col, wgt = 500, align = 'center', ls = -.2) { g.font = F(wgt, size); g.fillStyle = col; g.textAlign = align; g.letterSpacing = ls + 'px'; g.fillText(s, x, y); g.letterSpacing = '0px'; }

// ---------- Fotos (prozedural gemalt, fotografisch weich) ----------
function grain(c, amt, seed) {
  const g = c.getContext('2d'), d = g.getImageData(0, 0, c.width, c.height), r = rng(seed);

  g.putImageData(d, 0, 0);
}
function kitchen(wet) {
  const c = mk(720, 520), g = c.getContext('2d'), r = rng(7);
  // Wand, Fliesen, Arbeitsplatte (oberer Rand)
  let gr = g.createLinearGradient(0, 0, 720, 0); gr.addColorStop(0, '#e6e1d8'); gr.addColorStop(1, '#c7c0b4'); g.fillStyle = gr; g.fillRect(0, 0, 720, 70);
  g.strokeStyle = 'rgba(150,140,125,.4)'; for (let x = 0; x < 720; x += 48) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 60); g.stroke(); } g.beginPath(); g.moveTo(0, 30); g.lineTo(720, 30); g.stroke();
  gr = g.createLinearGradient(0, 58, 0, 86); gr.addColorStop(0, '#6a6864'); gr.addColorStop(.25, '#3d3c3a'); gr.addColorStop(1, '#222120'); g.fillStyle = gr; g.fillRect(0, 58, 720, 28); g.fillStyle = 'rgba(255,255,255,.4)'; g.fillRect(0, 58, 720, 2);

  const door = (x, w) => { gr = g.createLinearGradient(x, 86, x + w, 330); gr.addColorStop(0, '#f5f2ed'); gr.addColorStop(1, '#d4cdc2'); g.fillStyle = gr; g.fillRect(x, 88, w, 244); g.fillStyle = '#5e5b57'; g.fillRect(x + w / 2 - 26, 104, 52, 7); g.fillStyle = 'rgba(0,0,0,.14)'; g.fillRect(x + w - 3, 88, 3, 244); };
  door(0, 190); door(530, 190);
  // offener Schrank innen dunkel, Siphon, Leck
  gr = g.createLinearGradient(0, 88, 0, 332); gr.addColorStop(0, '#2c2824'); gr.addColorStop(1, '#16130f'); g.fillStyle = gr; g.fillRect(190, 88, 340, 244);
  g.strokeStyle = '#b9bec2'; g.lineWidth = 16; g.lineCap = 'round'; g.beginPath(); g.moveTo(360, 88); g.lineTo(360, 170); g.bezierCurveTo(360, 215, 420, 215, 420, 175); g.lineTo(420, 160); g.lineTo(505, 160); g.stroke();
  g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 3; g.beginPath(); g.moveTo(354, 92); g.lineTo(354, 170); g.stroke();
  g.fillStyle = '#e2e0da'; g.fillRect(215, 250, 70, 80); g.fillStyle = '#3b7bd1'; g.fillRect(222, 262, 56, 22); // Putzmittel
  // offene Tür schräg rechts
  g.fillStyle = '#e9e5de'; g.beginPath(); g.moveTo(530, 88); g.lineTo(600, 70); g.lineTo(600, 350); g.lineTo(530, 332); g.closePath(); g.fill();
  g.fillStyle = '#2e2b28'; g.fillRect(0, 332, 720, 14);
  // Boden
  gr = g.createLinearGradient(0, 346, 0, 520); gr.addColorStop(0, '#a4957f'); gr.addColorStop(1, '#7d6d58'); g.fillStyle = gr; g.fillRect(0, 346, 720, 174);
  g.strokeStyle = 'rgba(60,48,36,.35)'; g.lineWidth = 1.5; for (let k = -8; k < 14; k++) { g.beginPath(); g.moveTo(360 + k * 60, 346); g.lineTo(360 + k * 150, 520); g.stroke(); } [372, 410, 462].forEach(y => { g.beginPath(); g.moveTo(0, y); g.lineTo(720, y); g.stroke(); });

    g.strokeStyle = 'rgba(215,232,245,.9)'; g.lineWidth = 5; g.beginPath(); g.moveTo(392, 205); g.bezierCurveTo(396, 250, 388, 300, 394, 340); g.stroke();
    g.strokeStyle = 'rgba(215,232,245,.6)'; g.lineWidth = 2; g.beginPath(); g.moveTo(400, 205); g.bezierCurveTo(410, 260, 405, 300, 412, 338); g.stroke();
    for (let i = 0; i < 9; i++) { g.fillStyle = 'rgba(225,238,250,.85)'; g.beginPath(); g.ellipse(380 + r() * 40, 215 + r() * 110, 2, 4, 0, 0, 7); g.fill(); }
    g.fillStyle = 'rgba(60,50,40,.35)'; g.fillRect(190, 318, 340, 14);

    g.save(); g.beginPath(); g.moveTo(60, 380); g.bezierCurveTo(180, 350, 520, 348, 640, 372); g.bezierCurveTo(740, 392, 700, 470, 610, 500); g.bezierCurveTo(470, 540, 180, 530, 80, 490); g.bezierCurveTo(0, 460, 0, 400, 60, 380); g.closePath(); g.clip();
    gr = g.createLinearGradient(0, 350, 0, 520); gr.addColorStop(0, 'rgba(60,72,82,.55)'); gr.addColorStop(1, 'rgba(110,125,138,.45)'); g.fillStyle = gr; g.fillRect(0, 340, 720, 180);
    g.globalAlpha = .6; g.translate(0, 680); g.scale(1, -1); g.drawImage(c, 0, 88, 720, 250, 0, 20, 720, 250); g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalAlpha = 1; for (let i = 0; i < 40; i++) { g.fillStyle = `rgba(255,255,255,${.2 + r() * .35})`; g.beginPath(); g.ellipse(80 + r() * 560, 372 + r() * 130, 5 + r() * 38, .6 + r() * 1.4, 0, 0, 7); g.fill(); }
    for (let i = 0; i < 4; i++) { g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 1.5; g.beginPath(); g.ellipse(394, 350, 20 + i * 26, 5 + i * 6, 0, 0, 7); g.stroke(); }
    g.restore();
  } else {
    g.fillStyle = 'rgba(255,255,255,.12)'; g.fillRect(0, 346, 720, 6);

        g.save(); g.fillStyle = col; rr(g, bx, by, Math.max(20, bw), 52, 10); g.fill(); g.fillStyle = 'rgba(255,255,255,.9)'; rr(g, bx + 6, by + 10, 5, 32, 2); g.fill(); if (bw > 60) { rr(g, bx + bw - 11, by + 10, 5, 32, 2); g.fill(); }
        g.globalAlpha *= clamp((p - .5) * 2); small(g, lab, bx + 26, by + 36, 26, i === 0 ? '#5a3c00' : '#fff', 650, 'left'); g.restore();
      });
      // Abspielkopf
      const ph = cx + cw * clamp(mix(0, 1, lin(t, K.live, K.erledigt + .45))); g.fillStyle = C.bl2; g.fillRect(ph - 1.5, 670, 3, 230); g.beginPath(); g.arc(ph, 668, 9, 0, 7); g.fill();
    });
  }
  g.restore();
}

// ================= SZENE I+J: Esstisch, Schluss =================
function sceneIJ(g, t) {
  g.fillStyle = C.white; g.fillRect(0, 0, W, H);
  const j = eio(lin(t, CUT.end, CUT.end + .35));
  const cI = { x: 230, y: 190, w: 1460, h: 822 }, cJ = { x: 150, y: 355, w: 640, h: 360 };
  const c = { x: mix(cI.x, cJ.x, j), y: mix(cI.y, cJ.y, j), w: mix(cI.w, cJ.w, j), h: mix(cI.h, cJ.h, j) };
  const cs = 1 + .03 * lin(t, CUT.ij0 + .15, CUT.end + .1) + .02 * lin(t, K.schluss + .02, DUR);
  g.save(); scaleAt(g, cs, 960, 560); drift(g, t, CUT.ij0, .5, 10, 2);
  // Karte mit Foto
  g.save(); g.shadowColor = 'rgba(0,0,0,.2)'; g.shadowBlur = 70; g.shadowOffsetY = 24; g.fillStyle = '#222'; rr(g, c.x, c.y, c.w, c.h, 20); g.fill(); g.restore();
  g.save(); rr(g, c.x, c.y, c.w, c.h, 20); g.clip();
  // Hervorhebung „Esstisch“: Kamera fährt auf den Tisch, angekommen auf dem Wort
  const zk = eio(lin(t, CUT.ij1, K.esstisch)), zz = 1.02 + .12 * zk, sw = 1440 / zz, sh = 810 / zz, sy = clamp(mix(405, 520, zk) - sh / 2, 0, 810 - sh);
  g.drawImage(DIN, 720 - sw / 2, sy, sw, sh, c.x, c.y, c.w, c.h);
  // Mitteilung „Erledigt“ oben rechts
  const s = c.w / cI.w; const np = ex(lin(t, K.bleiben + .03, K.bleiben + .38));
  if (np > 0) { g.save(); g.globalAlpha *= np; g.translate(c.x + c.w - 30 * s, c.y + 30 * s + (1 - np) * -40 * s); g.scale(s, s);
    g.shadowColor = 'rgba(0,0,0,.35)'; g.shadowBlur = 40; g.shadowOffsetY = 10; g.fillStyle = 'rgba(240,241,244,.93)'; rr(g, -560, 0, 560, 128, 28); g.fill(); g.shadowColor = 'transparent';
    domusMark(g, -490, 64, 64); small(g, 'Domus', -440, 54, 28, '#111', 650, 'left'); small(g, 'Erledigt', -440, 94, 27, '#1f8f3a', 600, 'left');
    g.fillStyle = '#28c840'; g.beginPath(); g.arc(-64, 64, 26, 0, 7); g.fill(); icon(g, 'check', -64, 64, 26, '#fff', 4.5); g.restore(); }
  // Dock
  g.save(); g.translate(c.x + c.w / 2, c.y + c.h - 60 * s); g.scale(s, s); g.fillStyle = 'rgba(255,255,255,.28)'; rr(g, -250, -46, 500, 92, 26); g.fill();
  ['#34c759', '#0a84ff', '#ff3b30', '#1c1c1e', '#1fb9ee', '#ff9f0a'].forEach((col, i) => { g.fillStyle = col; rr(g, -222 + i * 78, -32, 64, 64, 15); g.fill(); if (i === 4) icon(g, 'house', -222 + i * 78 + 32, 0, 36, '#fff', 3); });
  g.restore();
  // J: Ecken-Knöpfe wie im Original
  if (j > .5) { g.save(); g.globalAlpha *= (j - .5) * 2; [[0, 0, 'x'], [1, 0, 'check'], [0, 1, 'house']].forEach(([a, b, k]) => { const bx = c.x + 18 + a * (c.w - 90), by = c.y + 18 + b * (c.h - 90); g.fillStyle = 'rgba(245,245,247,.92)'; rr(g, bx, by, 72, 72, 18); g.fill(); icon(g, k, bx + 36, by + 36, 24, '#333', 3); }); g.restore(); }
  g.restore();
  // Schlusskarte: Logo + Name (auf „Domus“), Angebot in 2 Teilen wie „Share you're done“ (Navy / letztes Wort Blau), Kontakt
  const rx = 870;
  g.save();
  const dm = bio(t, K.schluss - .31, K.schluss - .01, 1e9, 1e9, 26);
  lay(g, dm.b, dm.a, g => { domusMark(g, rx + 55, 440, 110); small(g, 'Domus', rx + 140, 420, 96, '#0a0a0a', 600, 'left', -3); small(g, 'Hausverwaltung', rx + 144, 488, 50, C.navy, 500, 'left', -1); });
  headline(g, [['1. Monat', K.monat, C.navy], ['kostenlos', K.kostenlos, C.blue]], rx, 640, 100, t, { onWhite: true, left: true, w: 560 });
  const kp = ex(lin(t, K.kostenlos + .3, K.kostenlos + .7)); g.globalAlpha *= kp; small(g, 'domus-verwaltung.de  ·  0221 987 654 0', rx + 4, 730, 30, '#8e8e93', 500, 'left'); g.restore();
  const P = path([[CUT.ij0 + .15, 1300, 1000], [K.esstisch, 1250, 900], [CUT.end + .3, 900, 900], [K.kostenlos - .35, 760, 425], [K.kostenlos - .1, 754, 412, 1], [DUR - 1, 780, 470]], t);
  pointer(g, P.x, P.y, P.rot, P.press, ex(lin(t, K.schluss + .2, K.schluss + .6)));
  g.restore();
}

// ---------- Pixel-Mosaik-Blende zwischen zwei Szenen ----------
const tA = mk(W, H), tB = mk(W, H), tS = mk(96, 54);
function mosaicCut(g, fa, fb, t, t0, t1, circle = false) {
  const k = lin(t, t0, t1);
  const ga = tA.getContext('2d'), gb = tB.getContext('2d');
  [ga, gb].forEach(q => { q.setTransform(1, 0, 0, 1, 0, 0); q.filter = 'none'; q.globalAlpha = 1; });
  fa(ga, t); fb(gb, t);
  const bs = 40, nx = W / bs, ny = Math.ceil(H / bs), r = rng(4);
  g.drawImage(tA, 0, 0);
  const pix = Math.sin(Math.PI * k); // Pixelgröße wächst zur Mitte
  const n = Math.round(mix(1, 1 / 24, pix) * 96) || 1;
  g.imageSmoothingEnabled = false;
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    let th = r(); if (circle) { const d = Math.hypot(i * bs - 960, j * bs - 540) / 1100; th = d * .75 + th * .25; }
    const src = k > th ? tB : tA;
    if (src === tB || pix > .1) g.drawImage(src, i * bs, j * bs, bs, bs, i * bs, j * bs, bs, bs);
  }
  if (pix > .15) { const sg = tS.getContext('2d'); tS.width = Math.max(8, Math.round(96 * (1 - pix * .8))); tS.height = Math.round(tS.width * 9 / 16); sg.imageSmoothingEnabled = true; sg.drawImage(cv, 0, 0, tS.width, tS.height); g.globalAlpha = pix * .8; g.drawImage(tS, 0, 0, W, H); g.globalAlpha = 1; }
  g.imageSmoothingEnabled = true;
}

// ---------- Ablauf ----------
function draw(t) {
  const g = X; g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.filter = 'none';
  if (t < CUT.cd) sceneAB(g, t);
  else if (t < CUT.ef0) sceneCD(g, t);
  else if (t < CUT.ef1) mosaicCut(g, sceneCD, sceneEF, t, CUT.ef0, CUT.ef1);
  else if (t < CUT.gh) sceneEF(g, t);
  else if (t < CUT.ij0) sceneGH(g, t);
  else if (t < CUT.ij1) mosaicCut(g, sceneGH, sceneIJ, t, CUT.ij0, CUT.ij1, true);
  else sceneIJ(g, t);
  // Ausblende ans Ende
  const fo = lin(t, DUR - .5, DUR); if (fo > 0) { g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = `rgba(250,250,250,${fo})`; g.fillRect(0, 0, W, H); }
}
