<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<title>Wärmewerk – V7</title>
<style>
@font-face{font-family:'CP';src:url(CourierPrime-Bold.ttf)}
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="zeiten.js"></script>
<script>
// Wärmewerk V5 – im Stil des LASIK-Explainers (Andy Diep, Version A): gekörnter Nachthimmel mit glühendem Punkt,
// Creme-Papierstreifen mit Schreibmaschinenschrift, Pergament mit Wolkenflecken, blaue Raster-Flächen (Halbton),
// Material aus seinem eigenen Wort, blaue Etikettenstapel oben links, rot-orange Kreise/Striche/Schnittlinien. Siehe ../STILBIBEL.md
const W = 1920, H = 1080;
const P = { sky: '#253c6c', parch: '#e6ddc3', blue: '#446db3', blueD: '#2f4f8a', cream: '#efe7d4', navyT: '#27365f', red: '#d9603f', redL: '#e8784f', band: '#efe8d6' };
const cv = document.getElementById('c'), X = cv.getContext('2d');
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v)), lin = (t, a, b) => clamp((t - a) / (b - a)), mix = (a, b, k) => a + (b - a) * k;
const eo = x => 1 - Math.pow(1 - x, 3), eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const idle = (t, f, a, ph = 0) => Math.sin(t * f + ph) * a;
function trace(g, pts) { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); }
function partial(pts, p) { if (p >= 1) return pts; if (p <= 0) return [pts[0]]; let L = 0; const d = [0]; for (let i = 1; i < pts.length; i++) { L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); d.push(L); }
  const tg = L * p, o = [pts[0]]; for (let i = 1; i < pts.length; i++) { if (d[i] <= tg) o.push(pts[i]); else { const k = (tg - d[i - 1]) / (d[i] - d[i - 1] || 1); o.push([mix(pts[i - 1][0], pts[i][0], k), mix(pts[i - 1][1], pts[i][1], k)]); break; } } return o; }
function stroke(g, pts, col, lw, p = 1, dash = null, off = 0) { if (p <= 0) return; g.save(); g.strokeStyle = col; g.lineWidth = lw; g.lineCap = 'round'; g.lineJoin = 'round'; if (dash) { g.setLineDash(dash); g.lineDashOffset = off; } trace(g, partial(pts, p)); g.stroke(); g.restore(); }
function wobEll(cx, cy, rx, ry, seed = 1, turns = 1.12) { const o = []; for (let i = 0; i <= 70; i++) { const a = -2.6 + i / 70 * Math.PI * 2 * turns, r = 1 + .06 * Math.sin(i * .35 + seed); o.push([cx + Math.cos(a) * rx * r, cy + Math.sin(a) * ry * r]); } return o; }
function fnt(g, s) { g.font = `${s}px CP`; }
// Gasflamme mit seitlicher Zunge (Icon-Form, kein Tropfen)
function flamePath(g, r, fl = 1) { const P0 = (x, y) => [x * r, y * r]; g.beginPath(); g.moveTo(...P0(.08, -1 * fl)); g.bezierCurveTo(...P0(.45, -.55), ...P0(.66, -.2), ...P0(.62, .28)); g.bezierCurveTo(...P0(.6, .72), ...P0(.3, .95), ...P0(0, .95));
  g.bezierCurveTo(...P0(-.32, .95), ...P0(-.62, .7), ...P0(-.6, .28)); g.bezierCurveTo(...P0(-.58, -.02), ...P0(-.42, -.25), ...P0(-.3, -.5)); g.bezierCurveTo(...P0(-.24, -.2), ...P0(-.14, -.08), ...P0(-.06, -.04)); g.bezierCurveTo(...P0(-.14, -.45), ...P0(-.04, -.75), ...P0(.08, -1 * fl)); g.closePath(); }

// ---------- Texturen ----------
let SKY, PARCH, HT, HTD, BORDER; const jagBill = (() => { const R = rng(31), p = []; for (let x = -290; x <= 290; x += 12) p.push([x, -175 + (R() - .5) * 3]); for (let y = -175; y <= 175; y += 6) p.push([290 + (R() - .5) * 4, y]); for (let x = 290; x >= -290; x -= 12) p.push([x, 175 + (R() - .5) * 3]); for (let y = 175; y >= -175; y -= 6) p.push([-290 + (R() - .5) * 4, y]); return p; })();
function grainOn(g, w, h, amt, seed, speck = 0) { const im = g.getImageData(0, 0, w, h), d = im.data, R = rng(seed); for (let i = 0; i < d.length; i += 4) { let v = (R() + R() - 1) * amt; if (speck && R() < speck) v += 40 + R() * 60; d[i] += v; d[i + 1] += v; d[i + 2] += v; } g.putImageData(im, 0, 0); }
function blots(g, w, h, R, n, cols, rMin, rMax, aMin, aMax) { for (let i = 0; i < n; i++) { const x = R() * w, y = R() * h, r = mix(rMin, rMax, R()), c = cols[Math.floor(R() * cols.length)], a = mix(aMin, aMax, R());
  const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(${c},${a})`); gr.addColorStop(1, `rgba(${c},0)`); g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r); } }
function mkSky() { const c = mk(W + 200, H + 200), g = c.getContext('2d'), R = rng(3); g.fillStyle = P.sky; g.fillRect(0, 0, c.width, c.height);
  blots(g, c.width, c.height, R, 70, ['70,100,160', '22,36,80', '85,115,170'], 140, 420, .06, .2); grainOn(g, c.width, c.height, 22, 4, .06); return c; }
function mkParch() { const c = mk(W + 1400, H + 600), g = c.getContext('2d'), R = rng(5); g.fillStyle = P.parch; g.fillRect(0, 0, c.width, c.height);
  blots(g, c.width, c.height, R, 90, ['165,146,112', '245,238,222', '190,172,138'], 160, 520, .2, .55); grainOn(g, c.width, c.height, 14, 6, .006); return c; }
function mkHT(base, dot, seed) { const c = mk(96, 96), g = c.getContext('2d'), R = rng(seed); g.fillStyle = base; g.fillRect(0, 0, 96, 96); g.fillStyle = dot;
  for (let y = 0; y < 96; y += 6) for (let x = (y / 6 % 2) * 3; x < 96; x += 6) { g.beginPath(); g.arc(x, y, 1.35 + R() * .3, 0, 7); g.fill(); }
  grainOn(g, 96, 96, 14, seed + 1); return g.createPattern(c, 'repeat'); }
function mkBorder() { const c = mk(W, H), g = c.getContext('2d'); g.fillStyle = P.blueD;
  for (let y = 0; y < H; y += 14) for (let x = (y / 14 % 2) * 7; x < W; x += 14) { const dx = Math.max(0, Math.abs(x - W / 2) - W * .36) / (W * .14), dy = Math.max(0, Math.abs(y - H / 2) - H * .3) / (H * .2), d = Math.min(1, Math.max(dx, dy)); if (d <= 0) continue; g.beginPath(); g.arc(x, y, d * 5.5, 0, 7); g.fill(); } return c; }

// ---------- Papierstreifen mit Schreibmaschinenschrift ----------
const LBS = new Map();
function jag(w, h, seed) { const R = rng(seed), p = []; p.push([0, 0]); for (let x = 0; x <= w; x += 14) p.push([x, (R() - .5) * 2]); for (let y = 0; y <= h; y += 5) p.push([w + (y / 5 % 2 ? 3 : -2) + R() * 2, y]);
  for (let x = w; x >= 0; x -= 14) p.push([x, h + (R() - .5) * 2]); for (let y = h; y >= 0; y -= 5) p.push([(y / 5 % 2 ? -3 : 2) - R() * 2, y]); return p; }
// o: t0 (Aufklatschen), cps, kind 'cream'|'blue', size, rot, align, a, strike:[t, c0, c1], circle:[t, c0, c1], fade:[t0,t1]
function label(g, t, x, y, s, o) { const t0 = o.t0; if (t < t0) return 0; const sz = o.size || 32, cw = (() => { g.save(); fnt(g, sz); const w = g.measureText('M').width; g.restore(); return w; })();
  const pad = sz * .55, w = cw * s.length + pad * 2, h = sz * 1.45, k = eo(lin(t, t0, t0 + .2)), a = (o.a ?? 1) * k * (o.fade ? 1 - lin(t, o.fade[0], o.fade[1]) : 1); if (a <= 0) return w;
  const x0 = o.align === 'center' ? x - w / 2 : o.align === 'right' ? x - w : x;
  g.save(); g.globalAlpha *= a; g.translate(x0 + w / 2, y); g.rotate(o.rot || 0); const sc = mix(1.08, 1, k); g.scale(sc, sc); g.translate(-w / 2, -h / 2);
  const key = s + '|' + sz + '|' + (o.seed || 1); if (!LBS.has(key)) LBS.set(key, jag(w, h, (o.seed || 1) + s.length * 7)); const pts = LBS.get(key);
  g.save(); g.shadowColor = 'rgba(20,20,40,.35)'; g.shadowBlur = 6; g.shadowOffsetY = 3; trace(g, pts); g.closePath(); g.fillStyle = o.kind === 'blue' ? HT : P.cream; g.fill(); g.restore();
  if (o.kind !== 'blue') { g.save(); trace(g, pts); g.closePath(); g.clip(); g.fillStyle = 'rgba(160,140,100,.10)'; for (let i = 0; i < 6; i++) g.fillRect(0, h * (i / 6), w, 1); g.restore(); }
  const n = s.length; fnt(g, sz); g.fillStyle = o.col || (o.kind === 'blue' ? '#f4eee0' : P.navyT); g.textBaseline = 'middle'; g.fillText(s.slice(0, Math.max(0, n)), pad, h / 2 + sz * .04);
  if (o.strike && t > o.strike[0]) { const q = lin(t, o.strike[0], o.strike[0] + .2); stroke(g, [[pad + o.strike[1] * cw - 4, h / 2 + 2], [pad + o.strike[2] * cw + 4, h / 2 - 1]], P.red, 4, q); }
  if (o.circle && t > o.circle[0]) { const q = eo(lin(t, o.circle[0], o.circle[0] + .3)), cx = pad + (o.circle[1] + o.circle[2]) / 2 * cw, rx = (o.circle[2] - o.circle[1]) / 2 * cw + 16; stroke(g, wobEll(cx, h / 2, rx, h * .62, 2), P.red, 3.4, q); }
  g.restore(); return w; }
// Stapel oben links (blaue Streifen), wie „machine 1: …“
function stack(g, t, items, x = 110, y = 120, fade) { x += Math.sin(t * .7) * 6; let yy = y + Math.sin(t * .9) * 4; items.forEach((it, i) => { const [s, t0, sz0, extra] = it; const sz = (sz0 || 34) * .9; label(g, t, x, yy, s, Object.assign({ t0, kind: 'blue', size: sz, rot: [-.006, .004, -.003, .005][i % 4], seed: i + 3, cps: 44, fade }, extra || {})); yy += sz * 1.45 + 14; }); }

// ---------- Diagramm-Teile ----------
function starburst(g, x, y, r, t, col = [232, 96, 58]) { const R = rng(9); const pulse = .85 + .15 * Math.sin(t * 6);
  const gr = g.createRadialGradient(x, y, 0, x, y, r * 2.4); gr.addColorStop(0, `rgba(${col},.55)`); gr.addColorStop(1, `rgba(${col},0)`); g.fillStyle = gr; g.fillRect(x - r * 2.5, y - r * 2.5, r * 5, r * 5);
  g.save(); g.strokeStyle = `rgba(${col},.9)`; g.lineWidth = 1.6; for (let i = 0; i < 26; i++) { const a = i / 26 * Math.PI * 2 + R() * .2, l = r * (.6 + R() * .9) * pulse; g.beginPath(); g.moveTo(x + Math.cos(a) * 3, y + Math.sin(a) * 3); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); } g.restore();
  g.beginPath(); g.arc(x, y, 4.5, 0, 7); g.fillStyle = '#ffd9b8'; g.fill(); }
function wordFill(g, pts, word, col, sz, t, reveal = 1, lineH = 1.25, off = 0) { if (reveal <= 0) return; g.save(); trace(g, pts); g.closePath(); g.clip(); const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]); const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  g.fillStyle = col; fnt(g, sz); g.textBaseline = 'middle'; const line = (word + ' ').repeat(Math.ceil((x1 - x0) / (sz * .6 * (word.length + 1))) + 2); let r = 0;
  for (let y = y0 + sz * .6; y < y1 + sz; y += sz * lineH, r++) { if ((y - y0) / (y1 - y0 + 1) > reveal) break; g.fillText(line, x0 - (r * sz * 1.7 % (sz * .6 * (word.length + 1))) - off, y); } g.restore(); }
// Rund gebogenes Wortband (wie das „cornea“-Band): Wörter entlang konzentrischer Bögen
function arcBand(g, cx, cy, r0, r1, a0, a1, word, col, sz, reveal, t) { g.save(); g.beginPath(); g.arc(cx, cy, r1, a0, a1); g.arc(cx, cy, r0, a1, a0, true); g.closePath(); g.fillStyle = P.band; g.fill(); g.clip();
  fnt(g, sz); g.fillStyle = col; g.textBaseline = 'middle'; const cw = g.measureText('m').width; let row = 0;
  for (let r = r0 + sz * .7; r < r1; r += sz * 1.15, row++) { const step = cw / r, n = Math.floor((a1 - a0) / step); const aEnd = mix(a0, a1, reveal); let i = 0; const txt = (word + ' ').repeat(400); const sh = (row * 3) % (word.length + 1);
    for (let a = a0 + step / 2; a < aEnd; a += step, i++) { const ch = txt[i + sh]; if (ch === ' ') continue; g.save(); g.translate(cx + Math.cos(a) * r, cy + Math.sin(a) * r); g.rotate(a + Math.PI / 2); g.fillText(ch, -cw / 2, 0); g.restore(); } }
  g.restore(); g.save(); g.strokeStyle = 'rgba(47,79,138,.55)'; g.lineWidth = 2; g.beginPath(); g.arc(cx, cy, r1, a0, mix(a0, a1, reveal)); g.stroke(); g.beginPath(); g.arc(cx, cy, r0, a0, mix(a0, a1, reveal)); g.stroke(); g.restore(); }
function machineBox(g, x, y, w, h, o = {}) { g.save(); g.translate(x, y); g.save(); g.shadowColor = 'rgba(40,40,60,.35)'; g.shadowBlur = 8; g.shadowOffsetX = 5; g.shadowOffsetY = 6;
  g.beginPath(); g.rect(-w / 2, -h / 2, w, h); g.fillStyle = HT; g.fill(); g.restore();
  g.fillStyle = P.cream; g.fillRect(-w / 2, -h / 2 + h * .12, w, h * .08); g.fillStyle = P.red; g.fillRect(-w / 2, -h / 2 + h * .22, w, 3);
  if (o.fan) { g.beginPath(); g.arc(-w * .12, h * .12, h * .27, 0, 7); g.fillStyle = P.cream; g.fill(); g.strokeStyle = P.blueD; g.lineWidth = 2.5; g.stroke(); for (let i = 0; i < 3; i++) { const a = o.fan * 12 + i * 2.09; g.beginPath(); g.moveTo(-w * .12, h * .12); g.quadraticCurveTo(-w * .12 + Math.cos(a + .6) * h * .2, h * .12 + Math.sin(a + .6) * h * .2, -w * .12 + Math.cos(a) * h * .24, h * .12 + Math.sin(a) * h * .24); g.stroke(); } }
  if (o.dot !== false) { g.beginPath(); g.arc(w * .3, h * .15, 7, 0, 7); g.fillStyle = o.dotCol || P.red; g.fill(); }
  g.fillStyle = P.blueD; g.fillRect(-w * .2, h / 2, w * .4, 8); g.restore(); }

// ---------- Hausquerschnitt (Welt-Koordinaten auf dem Pergament) ----------
const HX0 = 1080, HX1 = 1640, GY = 820, KY = 1000;
const rooms = [[HX0 + 24, 600, 256, 196], [1368, 600, 248, 196], [HX0 + 24, 404, 256, 176], [1368, 404, 248, 176]];
function rectP(x, y, w, h) { return [[x, y], [x + w, y], [x + w, y + h], [x, y + h]]; }
function diagram(g, t, st) {
  // Erdreich (Halbton), Keller ausgeschnitten
  g.save(); g.fillStyle = HT; g.fillRect(-400, GY, 2800, 500); g.restore();
  g.save(); g.strokeStyle = 'rgba(239,231,212,.7)'; g.lineWidth = 3; g.beginPath(); g.moveTo(-400, GY); g.lineTo(2400, GY); g.stroke(); g.restore();
  // Haus: Mauern + Dach als blaue Rasterfläche mit Creme-Kontur
  g.save(); g.shadowColor = 'rgba(40,40,60,.3)'; g.shadowBlur = 10; g.shadowOffsetX = 6; g.shadowOffsetY = 6; g.beginPath(); g.moveTo(HX0 - 30, 392); g.lineTo(1360, 210); g.lineTo(HX1 + 30, 392); g.lineTo(HX1, 392); g.lineTo(HX1, KY); g.lineTo(HX0, KY); g.lineTo(HX0, 392); g.closePath(); g.fillStyle = HT; g.fill(); g.restore();
  g.save(); g.strokeStyle = 'rgba(239,231,212,.85)'; g.lineWidth = 2.5; g.beginPath(); g.moveTo(HX0 - 30, 392); g.lineTo(1360, 210); g.lineTo(HX1 + 30, 392); g.closePath(); g.stroke();
  g.strokeStyle = 'rgba(40,62,110,.9)'; g.lineWidth = 2.5; g.beginPath(); g.moveTo(HX0 - 36, 396); g.lineTo(1360, 204); g.lineTo(HX1 + 36, 396); g.lineTo(HX1 + 4, 396); g.lineTo(HX1 + 4, GY); g.moveTo(HX0 - 4, GY); g.lineTo(HX0 - 4, 396); g.lineTo(HX0 - 36, 396); g.stroke(); g.restore();
  // Räume + Keller (Papier-Innen)
  const inner = '#efe6cf'; [...rooms, [HX0 + 24, GY + 12, HX1 - HX0 - 48, KY - GY - 30]].forEach((r, i) => { g.fillStyle = inner; g.fillRect(...r); });
  // Kälte: Räume füllen sich mit „kalt“, Wärme: mit „warm“
  rooms.forEach((r, i) => { const kp = st.cold * (1 - st.warm), wp = st.warm;
    if (kp > 0) { g.save(); g.globalAlpha = kp; g.fillStyle = 'rgba(120,160,215,.16)'; g.fillRect(...r); wordFill(g, rectP(...r), 'kalt', 'rgba(47,79,138,.62)', 13, t, st.coldRev, 1.15); g.restore(); }
    if (wp > 0) { g.save(); g.globalAlpha = wp; g.fillStyle = 'rgba(232,120,79,.14)'; g.fillRect(...r); wordFill(g, rectP(...r), 'warm', 'rgba(217,96,63,.8)', 13, t, st.warmRev, 1.15, -((t * 12) % 40)); g.restore(); } });
  // Heizkörper
  rooms.forEach((r, i) => { const x = r[0] + (i % 2 ? r[2] - 70 : 16), y = r[1] + r[3] - 62; g.fillStyle = st.warm > .5 ? '#f3c7b0' : P.cream; g.fillRect(x, y, 54, 40); g.strokeStyle = P.blueD; g.lineWidth = 2; g.strokeRect(x, y, 54, 40); for (let k = 1; k < 5; k++) { g.beginPath(); g.moveTo(x + k * 11, y + 4); g.lineTo(x + k * 11, y + 36); g.stroke(); } });
  // Fenster
  [[HX0 + 110, 440], [1450, 440], [HX0 + 110, 630], [1450, 630]].forEach(([x, y]) => { g.fillStyle = 'rgba(68,109,179,.18)'; g.fillRect(x, y, 70, 80); g.strokeStyle = P.blueD; g.lineWidth = 2; g.strokeRect(x, y, 70, 80); g.beginPath(); g.moveTo(x + 35, y); g.lineTo(x + 35, y + 80); g.moveTo(x, y + 40); g.lineTo(x + 70, y + 40); g.stroke(); });
  // Rohre (Creme / später warm)
  g.save(); g.strokeStyle = st.warm > .3 ? P.red : 'rgba(47,79,138,.7)'; g.lineWidth = 4; g.setLineDash(st.warm > .3 ? [10, 8] : []); g.lineDashOffset = -t * 40;
  g.beginPath(); g.moveTo(1240, 930); g.lineTo(1240, GY + 12); g.lineTo(1240, 770); g.lineTo(HX0 + 96, 770); g.moveTo(1240, 770); g.lineTo(1540, 770); g.moveTo(1240, 600); g.lineTo(1240, 560); g.lineTo(HX0 + 96, 560); g.moveTo(1240, 560); g.lineTo(1540, 560); g.moveTo(1240, 770); g.lineTo(1240, 600); g.stroke(); g.restore();
  // Kessel (fährt heraus) bzw. neuer Speicher
  const lift = st.lift; if (lift < 1) { g.save(); g.translate(eio(lift) * 40, -eio(lift) * 70); g.globalAlpha = 1 - lin(lift, .15, .6);
    machineBox(g, 1200, 912, 120, 150, { dotCol: st.flame > 0 ? P.red : '#6d7fa3' }); if (st.flame > 0) { g.save(); g.globalAlpha *= st.flame; starburst(g, 1236, 935, 26, t); g.restore(); } g.restore(); }
  if (st.tank > 0) { g.save(); g.globalAlpha = st.tank; g.translate(0, (1 - eo(st.tank)) * -120); g.beginPath(); g.ellipse(1440, 912, 50, 66, 0, 0, 7); g.fillStyle = HT; g.fill(); g.fillStyle = P.cream; g.fillRect(1390, 890, 100, 6); g.beginPath(); g.arc(1470, 935, 6, 0, 7); g.fillStyle = P.redL; g.fill(); g.restore(); }
}
function garden(g, t, st) {
  // Luft aus Wörtern: großer Bogen „wärme“ über dem Garten
  if (st.air > 0) arcBand(g, 560, 1200, 630, 790, Math.PI * 1.04, Math.PI * 1.96, 'wärme', 'rgba(217,96,63,.88)', 14, st.air, t);
  // Thermometer
  if (st.therm > 0) { g.save(); g.globalAlpha = st.therm; const x = 380, y = 520; g.beginPath(); g.roundRect(x - 22, y - 180, 44, 250, 22); g.fillStyle = P.cream; g.fill(); g.strokeStyle = P.blueD; g.lineWidth = 3; g.stroke();
    g.beginPath(); g.arc(x, y + 100, 40, 0, 7); g.fillStyle = HT; g.fill(); g.stroke(); const top = mix(y - 130, y + 20, st.merc || 0); g.fillStyle = HT; g.fillRect(x - 10, top, 20, y + 80 - top);

function skyScene(g, t, end) {

function frame(t) { const g = X; g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1;
