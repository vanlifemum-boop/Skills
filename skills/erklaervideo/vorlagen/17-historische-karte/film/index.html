<script>
// Stadtbote Kurier – V5 im Stil von Andy Dieps „Saratoga“-Karte: Pergament, feine Sepia-Tuschelinien,
// dicke rote Pinselrouten mit Widerhaken-Pfeil, gesperrte Serifen-Versalien, Doppelrahmen-Kartusche, Baum-Kreise.
const W = 1920, H = 1080;
const P = { paper: '#E6D9BE', paperL: '#EEE3CE', water: '#EAE2CD', ink: '#4E4230', inkD: '#3A2E1B', lab: '#5B4E3A', red: '#9C3A2B', redD: '#7A2A1F',
  redL: '#C07A68', redF: 'rgba(158,90,70,.30)', blue: '#4A5670', blueF: '#8A93A3', blot: '#2B2217' };
const SERIF = '"Iowan Old Style", "Hoefler Text", Georgia, serif';
const cv = document.getElementById('c'), X = cv.getContext('2d');
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v)), lin = (t, a, b) => clamp((t - a) / (b - a)), mix = (a, b, k) => a + (b - a) * k;

function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function chaikin(p, n = 3) { for (let k = 0; k < n; k++) { const q = [p[0]]; for (let i = 0; i < p.length - 1; i++) { const a = p[i], b = p[i + 1]; q.push([a[0] * .75 + b[0] * .25, a[1] * .75 + b[1] * .25], [a[0] * .25 + b[0] * .75, a[1] * .25 + b[1] * .75]); } q.push(p[p.length - 1]); p = q; } return p; }
function poly(p) { const L = [0]; for (let i = 1; i < p.length; i++) L.push(L[i - 1] + Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1])); return { p, L, len: L[L.length - 1] }; }
function ptAt(P, u) { const d = clamp(u) * P.len; let lo = 1, hi = P.L.length - 1; while (lo < hi) { const m = (lo + hi) >> 1; if (P.L[m] < d) lo = m + 1; else hi = m; } const i = lo; const k = (d - P.L[i - 1]) / ((P.L[i] - P.L[i - 1]) || 1), a = P.p[i - 1], b = P.p[i]; return [mix(a[0], b[0], k), mix(a[1], b[1], k), Math.atan2(b[1] - a[1], b[0] - a[0])]; }
function subPts(P, u0, u1) { const out = [ptAt(P, u0)]; const d0 = u0 * P.len, d1 = u1 * P.len; for (let i = 0; i < P.p.length; i++) if (P.L[i] > d0 && P.L[i] < d1) out.push(P.p[i]); out.push(ptAt(P, u1)); return out; }

// Handzittern: Punkte entlang der Normalen versetzen
function wob(p, amp, seed, step = 7, freq = 45) { const r = resample(p, step), o = []; let d = 0; for (let i = 0; i < r.length; i++) { if (i) d += Math.hypot(r[i][0] - r[i - 1][0], r[i][1] - r[i - 1][1]);
  const a = r[Math.max(0, i - 1)], b = r[Math.min(r.length - 1, i + 1)], ang = Math.atan2(b[1] - a[1], b[0] - a[0]), n = amp * (vn(d / freq, seed) + .35 * vn(d / 9, seed + 9));

function txt(g, s, x, y, size, col, opt = {}) { g.font = `${opt.w || 400} ${size}px ${SERIF}`; g.fillStyle = col; g.textAlign = opt.align || 'left'; g.textBaseline = 'alphabetic'; g.letterSpacing = (opt.ls || 0) + 'px'; g.fillText(s, x, y); g.letterSpacing = '0px'; }
function tw(g, s, size, ls = 0, w = 400) { g.font = `${w} ${size}px ${SERIF}`; g.letterSpacing = ls + 'px'; const m = g.measureText(s).width; g.letterSpacing = '0px'; return m; }

// ---------- Kamera ----------
let CX = 0, CY = 0, CZ = 1;
const S = (x, y) => [(x - CX) * CZ + W / 2, (y - CY) * CZ + H / 2];
const KUN = [640, -240], SIE = [-640, 250], VZ = [-3600, 1500];
function camAt(t) {
  const k = [
    [0, 600, -235, 2.6], [K.sonst - .3, 600, -235, 2.6], [K.sonst + .2, 20, -10, .64], [K.post - .5, 70, -30, .67],
    [K.post - .02, -1500, 700, .265], [K.ueberm + .34, -1400, 650, .28], [K.ueber - .06, VZ[0] + 10, VZ[1] - 10, 1.45], [K.stadtbote - .62, VZ[0] + 60, VZ[1] + 10, 1.55],
    [K.stadtbote - .3, -1500, 700, .3], [K.stadtbote - .04, 0, -10, .64], [K.direkt + .25, 30, -20, .67], [K.abgeholt - .03, SIE[0] + 120, SIE[1] - 20, 1.3], [K.quer - .27, SIE[0] + 160, SIE[1] - 50, 1.38],
    [K.stadt - .16, 'F'], [K.umweg - .33, 20, -10, .63], [K.halb - .37, 40, -20, .66], [K.halb - .02, KUN[0] - 80, KUN[1] + 10, 1.3], [K.da + .03, KUN[0] - 40, KUN[1] + 20, 1.42], [K.mit, KUN[0], KUN[1] + 10, 3.2],
    [K.auftrag2 - .38, KUN[0] + 60, KUN[1] + 30, 4.8], [K.auftrag2 - .02, 150, -60, .7], [K.name - .31, 170, -70, .74], [K.name, 420, -160, .78], [DUR, -560, 180, .95]];
  // Abschnitt „quer durch die Stadt“: Kamera folgt dem Kurier
  if (t >= K.quer - .27 && t < K.stadt - .16) { const a = camAt(K.quer - .271), c = courierPos(t), k2 = eio(lin(t, K.quer - .27, K.quer)); return [mix(a[0], c[0] + 60, k2), mix(a[1], c[1], k2), mix(a[2], 1.12, k2)]; }

  const u = eio(lin(t, A[0], B[0]));

}
function setCam(t) { const c = camAt(t); CZ = c[2] * (1 + .012 * Math.sin(t * .55)); CX = c[0] + 16 * Math.sin(t * .41) / CZ; CY = c[1] + 10 * Math.sin(t * .33 + 1) / CZ; }

// ---------- Welt ----------
const rx = y => 150 + 170 * Math.sin((y + 260) / 640) + 40 * Math.sin(y / 230);   // Fluss-Mittellinie
const RW = 62;
let U140 = .64, CLEAR = [], AREA = [], AREA_EDGE = [], STREETS = [], HOUSES = [], RIVER_L, RIVER_R, BLOCKS = [], TREES = [], PARKS = [], ROADS = [], FIELDS = [], TOWNS = [], LABELS = [], FORT, BRIDGES = [], DIRECT, DETOUR, VZB = {};
const warp = (x, y) => [x + 34 * Math.sin(y / 410 + 1.3) + 14 * Math.sin(x / 230), y + 26 * Math.sin(x / 380 + .4) + 12 * Math.sin(y / 190)];
const inCity = (x, y) => Math.pow((x + 40) / 1300, 2) + Math.pow((y + 20) / 760, 2) + .14 * vn(x / 300 + y / 500, 5);
const ALT = [-430, -130];
const DET1 = [SIE, [-820, 300], [-1150, 330], [-1900, 480], [-2800, 700], [-3700, 950], [-4250, 1200], [-4300, 1460], [VZ[0] - 360, VZ[1] - 10], [VZ[0] - 300, VZ[1]]];
const DET2 = [[VZ[0] + 300, VZ[1] + 20], [VZ[0] + 380, VZ[1] + 30], [-2700, 1560], [-1800, 1380], [-900, 1080], [-100, 860], [rx(540) - RW - 60, 560], [rx(540) + RW + 60, 530], [720, 250], [KUN[0] + 30, KUN[1] + 60], [KUN[0] + 6, KUN[1] + 22]];
function buildWorld() {
  const R = rng(7);
  // Fluss
  const ys = []; for (let y = -3200; y <= 3600; y += 30) ys.push(y);
  RIVER_L = wob(ys.map(y => [rx(y) - RW, y]), 5, 11, 8); RIVER_R = wob(ys.map(y => [rx(y) + RW, y]), 5, 12, 8);
  DIRECT = poly(wob(chaikin([SIE, [-520, 225], [-360, 160], [-170, 80], [40, 8], [rx(-22) - RW - 10, -22], [rx(-22) + RW + 10, -26], [330, -70], [470, -150], [KUN[0] - 18, KUN[1] + 8]], 3), 4, 51, 6, 60));
  const DETP = poly(chaikin(DET1.slice(0, 4), 3));
  const nearPath = (Q, x, y, r) => { for (let i = 0; i < Q.p.length; i += 2) if (Math.hypot(Q.p[i][0] - x, Q.p[i][1] - y) < r) return true; return false; };
  // Straßenraster -> Blöcke
  const gx = [], gy = []; for (let x = -1900; x <= 1900; x += 150) gx.push(x + (R() - .5) * 40); for (let y = -1200; y <= 1200; y += 116) gy.push(y + (R() - .5) * 30);
  for (let i = 0; i < gx.length - 1; i++) for (let j = 0; j < gy.length - 1; j++) {
    const sx = (i % 4 === 1) ? 22 : 12, sy = (j % 3 === 2) ? 20 : 11;
    const x0 = gx[i] + sx, x1 = gx[i + 1] - sx, y0 = gy[j] + sy, y1 = gy[j + 1] - sy, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    const c = inCity(cx, cy); if (c > 1.05 + R() * .25) continue;
    if (Math.abs(cx - rx(cy)) < RW + 95) continue;
    if (Math.hypot(cx - ALT[0], (cy - ALT[1]) * 1.3) < 420 && Math.hypot(cx - ALT[0], (cy - ALT[1]) * 1.3) > 330) continue; // Wallring
    const inAlt = Math.hypot(cx - ALT[0], (cy - ALT[1]) * 1.3) < 330;
    if (!inAlt) continue;
    const subs = inAlt ? [[x0, y0, cx - 5, cy - 5], [cx + 5, y0, x1, cy - 5], [x0, cy + 5, cx - 5, y1], [cx + 5, cy + 5, x1, y1]] : [[x0, y0, x1, y1]];
    for (const s of subs) {
      { const cs = [[(s[0] + s[2]) / 2, (s[1] + s[3]) / 2, 60], [s[0], s[1], 36], [s[2], s[1], 36], [s[0], s[3], 36], [s[2], s[3], 36]].map(c => [...warp(c[0], c[1]), c[2]]); if (cs.some(c => nearPath(DIRECT, c[0], c[1], c[2]) || nearPath(DETP, c[0], c[1], c[2]))) continue; }
      const q = []; const e = (a, b) => { for (let k = 0; k < 3; k++) q.push(warp(mix(a[0], b[0], k / 3), mix(a[1], b[1], k / 3))); };

      BLOCKS.push({ alt: inAlt, q: jq, c: warp(cx, cy), ang: R() < .5 ? .785 : -.785, d: 0, seed: (R() * 1e6) | 0, tone: .8 + R() * .4 });
    }
  }
  // Bäume in Parks und Wäldern (Kreis mit zwei Punkten wie im Original)
  for (const p of PARKS) { const n = 9 + (R() * 6 | 0); for (let k = 0; k < n; k++) { const x = mix(p[0], p[2], R()), y = mix(p[1], p[3], R()); const w = warp(x, y); TREES.push([w[0], w[1], 9 + R() * 6, R() * 6.28]); } }
  const RF = rng(99);
  for (let k = 0; k < 5200; k++) { const x = -6200 + RF() * 11400, y = -3400 + RF() * 7200; const c = inCity(x, y); if (c < 1.35) continue;
    if (Math.abs(x - rx(y)) < RW + 30) continue; const f = vn(x / 900, 3) + vn(y / 700, 4) * .8 + (Math.hypot(x - VZ[0], y - VZ[1]) < 1100 ? .5 : 0); if (f < .15) continue; if (Math.hypot(x - VZ[0], y - VZ[1]) < 400) continue;
    TREES.push([x, y, 13 + RF() * 10, RF() * 6.28]); }
  const L1 = chaikin(DET1, 3), L2 = chaikin(DET2, 3);
  const Lin = [[VZ[0] - 300, VZ[1]], [VZ[0] + 300, VZ[1] + 20]];
  DETOUR = poly(wob(L1.concat(Lin, L2), 6, 52, 10, 80));
  // V7: „140 km“ an die Stelle der Geisterlinie, die in der Stadtansicht sichtbar ist (südlich des Flusses)
  { let best = 1e9; for (let u = .5; u <= .999; u += .001) { const q = ptAt(DETOUR, u), d = Math.hypot(q[0] - 600, q[1] - 490); if (d < best) { best = d; U140 = u; } } }
  // Wald rund um die Lichtung des Verteilzentrums (wie Freeman's Farm)
  CLEAR = wob(Array.from({ length: 41 }, (_, k) => { const an = k / 40 * Math.PI * 2; return [VZ[0] + Math.cos(an) * (470 + 40 * vn(k * .7, 61)), VZ[1] + Math.sin(an) * (330 + 30 * vn(k * .7, 62))]; }), 4, 63, 10, 60);
  for (let k = 0; k < 1400; k++) { const an = RF() * 6.28, d = 1.08 + RF() * 1.6, x = VZ[0] + Math.cos(an) * 480 * d, y = VZ[1] + Math.sin(an) * 345 * d; if (nearPath(DETOUR, x, y, 55)) continue; TREES.push([x, y, 11 + RF() * 9, RF() * 6.28]); }
  // Felder (gestrichelte Parzellen)
  for (let k = 0; k < 140; k++) { const x = -6000 + RF() * 11000, y = -3200 + RF() * 6800; if (inCity(x, y) < 1.5) continue; if (Math.abs(x - rx(y)) < RW + 200) continue; if (Math.hypot(x - VZ[0], y - VZ[1]) < 600) continue;
    const w = 220 + RF() * 300, h = 150 + RF() * 200, a = (RF() - .5) * .6; FIELDS.push({ x, y, w, h, a, s: (RF() * 1e5) | 0 }); }
  // Altstadt-Wall mit Bastionen (Zickzack wie Bemis Heights)
  const fw = []; const NB = 11; for (let k = 0; k <= NB * 2; k++) { const a = k / (NB * 2) * Math.PI * 2, r = k % 2 ? 372 : 418; fw.push([ALT[0] + Math.cos(a) * r, ALT[1] + Math.sin(a) * r / 1.3]); }
  FORT = wob(fw, 3, 21, 6, 30);
  // Straßen: Hauptstraßen als Doppellinie, Nebenstraßen als feine Einzellinie; Häuser nur als kleine Rechtecke an den Straßen
  const bx = y => rx(y);
  const main = [
    [[ALT[0] - 470, ALT[1] + 20], [-900, -90], [-1350, -40]], [[ALT[0] - 330, ALT[1] - 260], [-980, -560], [-1180, -760]], [[ALT[0] + 10, ALT[1] - 320], [-380, -600], [-460, -820]],
    [[ALT[0] - 300, ALT[1] + 270], [-900, 330], [-1250, 480]], [[ALT[0] + 20, ALT[1] + 320], [-520, 520], [-620, 800]], [[ALT[0] + 330, ALT[1] + 230], [-150, 330], [40, 560], [bx(540) - RW - 30, 540]],
    [[ALT[0] + 300, ALT[1] - 230], [-100, -480], [bx(-620) - RW - 30, -620]],
    [[bx(-620) + RW + 30, -620], [500, -660], [900, -690], [1300, -720]], [[bx(-22) + RW + 30, -26], [330, -70], [470, -150], [KUN[0], KUN[1]], [900, -330], [1300, -420]],
    [[bx(540) + RW + 30, 530], [700, 560], [1000, 600], [1300, 640]],
    [[480, -800], [520, -400], [560, 0], [620, 380], [700, 800]], [[980, -800], [1020, -300], [1040, 200], [1060, 800]],
    ys.filter(y => y > -800 && y < 800).map(y => [bx(y) - RW - 34, y])];
  const minor = [[[bx(-350) + RW + 30, -350], [700, -330], [1300, -300]], [[bx(250) + RW + 30, 250], [800, 260], [1300, 280]], [[-1300, 200], [-950, 120], [ALT[0] - 380, ALT[1] + 180]],
    [[-1300, -380], [-950, -330], [ALT[0] - 440, ALT[1] - 120]], [[-200, 700], [-80, 250], [bx(0) - RW - 34, 60]], [[-900, 700], [-760, 420], [-640, 250]], [[300, -800], [bx(-760) + RW + 40, -760]], [[800, -100], [1300, -60]]];
  STREETS = main.map((p, i) => ({ p: wob(chaikin(p, 3), 4, 200 + i, 8, 70), main: true })).concat(minor.map((p, i) => ({ p: wob(chaikin(p, 3), 4, 300 + i, 8, 70), main: false })));
  STREETS.push({ p: wob(Array.from({ length: 49 }, (_, k) => { const an = k / 48 * Math.PI * 2; return [ALT[0] + Math.cos(an) * 490, ALT[1] + Math.sin(an) * 490 / 1.3]; }), 3, 400, 8, 60), main: true });
  const RH = rng(17);
  for (const st of STREETS) { const q = resample(st.p, 34); for (let i = 1; i < q.length - 1; i++) for (const side of [-1, 1]) { if (RH() < (st.main ? .45 : .6)) continue;
    const a0 = Math.atan2(q[i + 1][1] - q[i - 1][1], q[i + 1][0] - q[i - 1][0]), off = (st.main ? 26 : 18) + RH() * 6, x = q[i][0] - Math.sin(a0) * off * side, y = q[i][1] + Math.cos(a0) * off * side;
    if (inCity(x, y) > 1.02 || Math.abs(x - rx(y)) < RW + 26) continue; const dA = Math.hypot(x - ALT[0], (y - ALT[1]) * 1.3); if (dA < 440) continue;
    if (nearPath(DIRECT, x, y, 24) || Math.hypot(x - KUN[0], y - KUN[1]) < 60 || Math.hypot(x - SIE[0], y - SIE[1]) < 50) continue;
    const w = 16 + RH() * 14, h = 10 + RH() * 7, c = Math.cos(a0), sn = Math.sin(a0); HOUSES.push([[-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h / 2], [-w / 2, h / 2]].map(p => [x + p[0] * c - p[1] * sn, y + p[0] * sn + p[1] * c])); } }
  { const bank = ys.filter(y => y > -620 && y < 560).map(y => [rx(y) + RW, y]); AREA_EDGE = wob(chaikin([[rx(560) + RW, 560], [700, 600], [1050, 620], [1240, 380], [1270, -100], [1220, -560], [900, -660], [rx(-620) + RW, -640]], 3), 7, 501, 8, 50); AREA = bank.concat(AREA_EDGE); }
  // Parks
  for (const [px, py, pr] of [[-950, -470, 150], [880, 380, 130], [-180, 560, 110], [1100, -520, 120], [-1150, 250, 100]]) for (let k = 0; k < 26; k++) { const an = RH() * 6.28, d = Math.sqrt(RH()) * pr; TREES.push([px + Math.cos(an) * d * 1.3, py + Math.sin(an) * d, 10 + RH() * 6, RH() * 6.28]); }
  // Brücken
  for (const y of [-620, -22, 540]) { const x = rx(y); BRIDGES.push([x, y]); }
  // Überlandstraßen (Doppellinie)
  const road = (pts, s) => ROADS.push({ p: wob(chaikin(pts, 3), 6, s, 10, 90), s });
  road(DET1.slice(2), 31); road(DET2.slice(0, -3), 32);
  road([[1500, 300], [2300, 700], [3300, 1300], [4600, 1900]], 33);
  road([[1200, -800], [1900, -1500], [2600, -2400], [3300, -3300]], 34);
  road([[-1700, -200], [-2600, -500], [-3700, -700], [-5200, -800]], 35);
  road([[0, 1150], [-300, 1800], [-700, 2600], [-900, 3400]], 36);
  road([[VZ[0] - 280, VZ[1]], [-4600, 2500], [-5600, 3000]], 37);
  // Dörfer
  for (const [x, y] of [[-2700, -560], [2500, 820], [-600, 2500], [2100, -1700], [-4800, 2700], [3500, 1400], [-3000, 1250]]) { const n = 6 + (RF() * 5 | 0); const b = [];
    for (let k = 0; k < n; k++) { const bx = x + (RF() - .5) * 200, by = y + (RF() - .5) * 140, w = 34 + RF() * 40, h = 24 + RF() * 30; b.push([[bx, by], [bx + w, by], [bx + w, by + h], [bx, by + h]]); } TOWNS.push(b); }
  // Routen
  // Verteilzentrum: Grundriss
  VZB = { x: VZ[0], y: VZ[1], w: 600, h: 330 };
  // Beschriftungen [Text, x, y, Größe, zMin, zMax, Farbe, Laufweite]
