<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<title>Riegel 24 – V7 Holzschnitt</title>
<style>
@font-face{font-family:'CB';src:local('Comic Sans MS Bold'),local('ComicSansMS-Bold'),url(Kalam-Bold.ttf)}
@font-face{font-family:'CL';src:local('Superclarendon Black'),local('Superclarendon-Black'),url(Kalam-Bold.ttf)}
html,body{margin:0;background:#050505;overflow:hidden}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="zeiten.js"></script>
<script>
// Riegel 24 – V5 im Stil von Andy Dieps Holzschnitt-Traum („almost asleep“ / „falling“):
// tiefschwarzer Grund, gestochene weiße Schnittlinien mit spitzen Enden, die 12×/s „boilen“, massive helle Lichtflächen mit
// Stanz-Kanten und Kerben, Tapetenmuster (Punkt + Kelch), Zentralperspektive, getippte weiße Etiketten, 7-Segment-Uhr.
const W = 1920, H = 1080;
const WH = '#F0ECE4', BK = '#050505', RED = '#D9432F';
const cv = document.getElementById('c'), X = cv.getContext('2d');
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v)), lin = (t, a, b) => clamp((t - a) / (b - a)), mix = (a, b, k) => a + (b - a) * k;
const eo = x => 1 - Math.pow(1 - x, 3), eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2, es = x => x * x * (3 - 2 * x), ei = x => x * x * x;
const back = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const at = (t, w, d = .32) => eo(lin(t, w - d, w - .02));
function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(i, s) { let h = Math.imul((i | 0) ^ Math.imul(s | 0, 374761393), 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vn(x, s = 0) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return mix(hash(i, s), hash(i + 1, s), u) * 2 - 1; }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
let BOIL = 0;   // wechselt 12×/s: alle Schnitte zittern neu

// ---------- Schnittlinie: weißer, spitz auslaufender Stichel-Strich ----------
function cutPts(g, pts, w, opt = {}) {
  if (pts.length < 2) return; const col = opt.col || WH, seed = opt.seed || 1, taper = opt.taper ?? .18;
  // nachrechnen der Länge
  const L = [0]; for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); const len = L[L.length - 1]; if (len < .5) return;
  const n = Math.max(2, Math.ceil(len / 5)); const q = []; let j = 1;
  for (let k = 0; k <= n; k++) { const d = k / n * len; while (j < L.length - 1 && L[j] < d) j++; const u = (d - L[j - 1]) / ((L[j] - L[j - 1]) || 1); q.push([mix(pts[j - 1][0], pts[j][0], u), mix(pts[j - 1][1], pts[j][1], u), d]); }
  const left = [], right = [];
  for (let k = 0; k < q.length; k++) { const a = q[Math.max(0, k - 1)], b = q[Math.min(q.length - 1, k + 1)], an = Math.atan2(b[1] - a[1], b[0] - a[0]); const u = q[k][2] / len;
    const tp = Math.min(1, u / taper, (1 - u) / taper); let hw = w / 2 * Math.pow(clamp(tp), .55) * (.78 + .32 * vn(q[k][2] / 23 + BOIL * 3.1, seed)) + .15;
    const jx = .9 * vn(q[k][2] / 40 + BOIL * 7.7, seed + 5), nx = -Math.sin(an), ny = Math.cos(an);
    left.push([q[k][0] + nx * (hw + jx), q[k][1] + ny * (hw + jx)]); right.push([q[k][0] - nx * (hw - jx), q[k][1] - ny * (hw - jx)]); }
  g.fillStyle = col; g.beginPath(); left.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); for (let i = right.length - 1; i >= 0; i--) g.lineTo(right[i][0], right[i][1]); g.closePath(); g.fill();
}
function cutL(g, x1, y1, x2, y2, w, opt = {}) { cutPts(g, [[x1, y1], [x2, y2]], w, Object.assign({ seed: ((x1 * 7 + y1 * 13 + x2 * 3) | 0) % 997 }, opt)); }
function cutRect(g, x, y, w, h, lw, opt = {}) { const o = Object.assign({ taper: .06 }, opt); cutL(g, x, y, x + w, y, lw, o); cutL(g, x + w, y, x + w, y + h, lw, o); cutL(g, x + w, y + h, x, y + h, lw, o); cutL(g, x, y + h, x, y, lw, o); }
function cutCirc(g, cx, cy, r, lw, a0 = 0, a1 = Math.PI * 2, opt = {}) { const p = []; const n = Math.max(12, Math.ceil(r * Math.abs(a1 - a0) / 6)); for (let i = 0; i <= n; i++) { const a = mix(a0, a1, i / n); p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } cutPts(g, p, lw, Object.assign({ taper: .04, seed: (r | 0) + 3 }, opt)); }
// helle Fläche mit Stanz-Kante, Kerben und Maserung (nicht ausgehobenes Holz)
function slab(g, pts, opt = {}) {
  const seed = opt.seed || 3, col = opt.col || WH; const e = [];
  for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length], L = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.max(1, Math.ceil(L / 9)), an = Math.atan2(b[1] - a[1], b[0] - a[0]);
    for (let k = 0; k < n; k++) { const u = k / n, r = (opt.rough ?? 2.2) * vn(i * 17 + k * .7 + BOIL * .9, seed) + (hash(i * 31 + k, seed + BOIL) < .06 ? -5 : 0); e.push([mix(a[0], b[0], u) - Math.sin(an) * r, mix(a[1], b[1], u) + Math.cos(an) * r]); } }
  g.save(); g.fillStyle = col; g.beginPath(); e.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); g.fill();
  if (opt.grain !== false) { g.clip(); let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const p of pts) { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); }
    const R = rng(seed * 7 + 1), area = (x1 - x0) * (y1 - y0); g.fillStyle = BK;
    for (let k = 0; k < area / 2600; k++) { const x = mix(x0, x1, R()), y = mix(y0, y1, R()), r = .7 + R() * 1.6; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
    const ang = opt.grainAng ?? 0, nl = Math.ceil((y1 - y0) / 26); for (let k = 0; k < nl * (opt.grainK ?? .5); k++) { const yy = mix(y0, y1, R()), xs = mix(x0, x1, R() * .7), l = (x1 - x0) * (.15 + R() * .35);
      const p = []; for (let s = 0; s <= 8; s++) { const x = xs + l * s / 8; p.push([x, yy + 3 * Math.sin(x / 60 + k) + (x - xs) * Math.tan(ang)]); } cutPts(g, p, 2.4, { col: BK, seed: k + seed, taper: .4 }); } }
  g.restore();
}
function specks(g, seed, n, alpha = 1, box = [0, 0, W, H]) { const R = rng(seed); g.save(); g.fillStyle = WH; for (let k = 0; k < n; k++) { const x = box[0] + R() * box[2], y = box[1] + R() * box[3], r = R() < .9 ? .8 + R() * .9 : 1.8 + R(); const fl = hash(k, BOIL + seed) < .15 ? .3 : 1;
  g.globalAlpha = alpha * fl; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); } g.restore(); }
// Tapetenmotiv: Punkt über einem kleinen Kelch
function motif(g, x, y, s, a = 1) { if (s < .08) return; g.save(); g.globalAlpha = a; g.fillStyle = WH; g.beginPath(); g.arc(x, y - 7 * s, 2.3 * s + .3, 0, 7); g.fill();
  cutPts(g, [[x - 7 * s, y - 1 * s], [x - 2 * s, y + 5 * s], [x, y + 2 * s]], 2.4 * s + .5, { seed: 11, taper: .35 }); cutPts(g, [[x + 7 * s, y - 1 * s], [x + 2 * s, y + 5 * s], [x, y + 2 * s]], 2.4 * s + .5, { seed: 12, taper: .35 }); g.restore(); }

// ---------- Zentralperspektive ----------
const CAM = { x: 0, y: 0, z: 0, roll: 0, F: 900, cx: W / 2, cy: H / 2 };
function P3(x, y, z) { const dz = z - CAM.z; if (dz < .04) return null; const X0 = (x - CAM.x) * CAM.F / dz, Y0 = (y - CAM.y) * CAM.F / dz, c = Math.cos(CAM.roll), s = Math.sin(CAM.roll); return [CAM.cx + X0 * c - Y0 * s, CAM.cy + X0 * s + Y0 * c, CAM.F / dz]; }
function L3(g, a, b, w = 3, opt) { let A = a.slice(), B = b.slice(); const zn = CAM.z + .06; if (A[2] < zn && B[2] < zn) return; if (A[2] < zn) { const k = (zn - A[2]) / (B[2] - A[2]); A = [mix(A[0], B[0], k), mix(A[1], B[1], k), zn]; } if (B[2] < zn) { const k = (zn - B[2]) / (A[2] - B[2]); B = [mix(B[0], A[0], k), mix(B[1], A[1], k), zn]; }
  const p = P3(...A), q = P3(...B); if (!p || !q) return; const sc = Math.sqrt((p[2] + q[2]) / 2 / 300); cutL(g, p[0], p[1], q[0], q[1], clamp(w * 1.8 * sc, 1.6, w * 3), opt); }
function poly3(g, pts, opt) { const q = pts.map(p => P3(...p)); if (q.some(p => !p)) return; slab(g, q.map(p => [p[0], p[1]]), opt); }

// ---------- Figuren: schwarze Silhouette mit weißer Schnittkante ----------
function figure(g, x, y, s, pose, opt = {}) {
  // pose: {rot, la:[a1,a2], ra, ll, rl} Winkel in Radiant (0 = nach unten)
  g.save(); g.translate(x, y); g.rotate(pose.rot || 0); g.scale(s, s);
  const limb = (x0, y0, a1, l1, a2, l2) => { const xm = x0 + Math.sin(a1) * l1, ym = y0 + Math.cos(a1) * l1; return [[x0, y0], [xm, ym], [xm + Math.sin(a2) * l2, ym + Math.cos(a2) * l2]]; };
  const parts = [limb(-16, -62, pose.la[0], 34, pose.la[1], 32), limb(16, -62, pose.ra[0], 34, pose.ra[1], 32), limb(-8, 0, pose.ll[0], 40, pose.ll[1], 40), limb(8, 0, pose.rl[0], 40, pose.rl[1], 40)];
  const draw = (col, add) => { g.strokeStyle = col; g.fillStyle = col; g.lineCap = g.lineJoin = 'round';
    g.lineWidth = 16 + add; for (const p of parts) { g.beginPath(); g.moveTo(p[0][0], p[0][1]); g.lineTo(p[1][0], p[1][1]); g.lineTo(p[2][0], p[2][1]); g.stroke(); }
    g.lineWidth = 34 + add; g.beginPath(); g.moveTo(0, -60); g.lineTo(0, -6); g.stroke(); g.lineWidth = 16 + add; g.beginPath(); g.moveTo(-14, -64); g.lineTo(14, -64); g.stroke();
    g.beginPath(); g.arc(0, -92, 17 + add / 2, 0, 7); g.fill();
    if (opt.cap) { g.beginPath(); g.moveTo(-19 - add / 2, -98); g.quadraticCurveTo(0, -126 - add / 2, 19 + add / 2, -98); g.lineTo(30 + add / 2, -96); g.closePath(); g.fill(); }
    if (opt.box) { g.fillRect(24 - add / 2, -8 - add / 2, 40 + add, 26 + add); } };
  draw(WH, 10); draw(BK, 0);
  if (opt.box) { g.fillStyle = WH; g.fillRect(34, -2, 20, 3); }
  g.restore();
}

// ---------- 7-Segment-Anzeige (Uhr / Nummer) ----------
const SEG = { '0': 'abcdef', '1': 'bc', '2': 'abged', '3': 'abgcd', '4': 'fgbc', '5': 'afgcd', '6': 'afgedc', '7': 'abc', '8': 'abcdefg', '9': 'abcdfg', '-': 'g', ' ': '' };
function seg7(g, s, x, y, h, col = WH, lw = null) { const w = h * .56, t = lw || h * .13, e = t * .55; let cx = x;
  for (const ch of s) { if (ch === ':') { g.fillStyle = col; g.beginPath(); g.arc(cx + w * .2, y + h * .3, t * .55, 0, 7); g.arc(cx + w * .2, y + h * .72, t * .55, 0, 7); g.fill(); cx += w * .45; continue; }
    const on = SEG[ch] || ''; const S = { a: [[cx + e, y], [cx + w - e, y]], b: [[cx + w, y + e], [cx + w, y + h / 2 - e]], c: [[cx + w, y + h / 2 + e], [cx + w, y + h - e]], d: [[cx + e, y + h], [cx + w - e, y + h]], e: [[cx, y + h / 2 + e], [cx, y + h - e]], f: [[cx, y + e], [cx, y + h / 2 - e]], g: [[cx + e, y + h / 2], [cx + w - e, y + h / 2]] };
    for (const k of on) cutPts(g, S[k], t, { col, taper: .12, seed: k.charCodeAt(0) + (cx | 0) });
    cx += w + h * .24; } return cx - x; }
function seg7W(s, h) { let w = 0; for (const ch of s) w += ch === ':' ? h * .56 * .45 : h * .56 + h * .24; return w; }
function clockBox(g, x, y, s, str, a = 1) { if (a <= 0) return; g.save(); g.globalAlpha = a; const h = 70 * s, w = seg7W(str, h) + 60 * s, bh = h + 56 * s; g.fillStyle = BK; g.fillRect(x - 12 * s, y - 12 * s, w + 24 * s, bh + 24 * s);
  cutRect(g, x - 10 * s, y - 10 * s, w + 20 * s, bh + 20 * s, 5 * s); cutRect(g, x + 4 * s, y + 4 * s, w - 8 * s, bh - 8 * s, 2.6 * s); seg7(g, str, x + 30 * s, y + 28 * s, h); g.restore(); }

// ---------- Objekt-Zettel (V7): weißer Zettel wie das Etikett im Original, aber am Objekt, mit Führungslinie, als Ganzes ----------
function tag(g, t, w, txt, x, y, px, py) { const a = at(t, w, .25); if (a <= 0) return; g.save(); g.globalAlpha = a; g.font = '62px CB'; const tw = g.measureText(txt).width, bw = tw + 52, h = 94;
  cutL(g, px, py, x + bw / 2, y + h / 2, 3); slab(g, [[x, y], [x + bw, y], [x + bw, y + h], [x, y + h]], { seed: 170, grain: false, rough: 1.2 });
  g.fillStyle = BK; g.textBaseline = 'alphabetic'; g.fillText(txt, x + 26, y + 68); g.beginPath(); g.fillStyle = WH; g.arc(px, py, 7, 0, 7); g.fill(); g.restore(); }
// ---------- Szene A/E/G: Treppenhaus in Zentralperspektive ----------
const RM = { x0: -2, x1: 2, top: -1.55, fl: 1.35, back: 3.6 };
const DOOR = { x0: -.62, x1: .62, top: -.95 };
function room(g, t, st) {
  // st: {light, doorOpen(0..1), moon}
  const { x0, x1, top, fl, back: zb } = RM, zn = CAM.z + .06;
  // Innenraum hinter der Tür (hell) zuerst
  if (st.doorOpen > 0) { poly3(g, [[DOOR.x0, DOOR.top, zb], [DOOR.x1, DOOR.top, zb], [DOOR.x1, fl, zb], [DOOR.x0, fl, zb]], { seed: 91, grainK: .2 }); }
  // Kanten des Raums
  L3(g, [x0, top, zb], [x1, top, zb], 3.6); L3(g, [x0, fl, zb], [x1, fl, zb], 3.6); L3(g, [x0, top, zb], [x0, fl, zb], 3.6); L3(g, [x1, top, zb], [x1, fl, zb], 3.6);
  for (const [x, y] of [[x0, top], [x1, top], [x0, fl], [x1, fl]]) L3(g, [x, y, zn], [x, y, zb], 3.4);
  // Boden: Dielen in die Tiefe + Querfugen
  for (let x = x0 + .5; x < x1; x += .5) L3(g, [x, fl, zn], [x, fl, zb], 2.4);
  for (let z = zb - .55; z > zn; z -= .55) L3(g, [x0, fl, z], [x1, fl, z], 2.2);
  // Tapete auf Rückwand und Seitenwänden
  const pat = (pts) => { for (const p of pts) { const q = P3(...p); if (q) motif(g, q[0], q[1], q[2] / 300 * 1.7, .95); } };
  const pw = []; for (let x = x0 + .18; x < x1; x += .3) for (let y = top + .2; y < fl - .25; y += .3) { if (x > DOOR.x0 - .15 && x < DOOR.x1 + .15 && y > DOOR.top - .15) continue; if (x > -2 && x < -.75 && y > -1.45 && y < 0) continue; pw.push([x + (Math.round((y - top) / .3) % 2 ? .15 : 0), y, zb]); } pat(pw);
  const sw = []; for (let z = zb - .25; z > zn + .1; z -= .34) for (let y = top + .2; y < fl - .25; y += .3) { sw.push([x0, y, z], [x1, y, z]); } pat(sw);
  // Fenster in der Rückwand mit Mond
  { const xa = -1.85, xb = -.85, ya = -1.32, yb = -.08; poly3(g, [[xa, ya, zb], [xb, ya, zb], [xb, yb, zb], [xa, yb, zb]], { seed: 21, grainK: .9 });
    const c1 = P3(xa, (ya + yb) / 2, zb), c2 = P3(xb, (ya + yb) / 2, zb), d1 = P3((xa + xb) / 2, ya, zb), d2 = P3((xa + xb) / 2, yb, zb);
    if (c1 && c2) { cutL(g, c1[0], c1[1], c2[0], c2[1], 6, { col: BK }); cutL(g, d1[0], d1[1], d2[0], d2[1], 6, { col: BK }); const m = P3(xa + .52, ya + .22, zb); if (m) { const sc = m[2] / 300; g.save(); g.strokeStyle = BK; g.lineWidth = 2.6; g.beginPath(); g.arc(m[0], m[1], 26 * sc, 0, 7); g.stroke(); g.fillStyle = BK; for (const [dx, dy] of [[-7, -6], [6, 3], [-2, 11]]) { g.beginPath(); g.arc(m[0] + dx * sc, m[1] + dy * sc, 3 * sc, 0, 7); g.fill(); } g.restore(); } } }
  // Mondlicht-Fläche auf dem Boden mit Fensterkreuz
  if (st.moon > 0) { g.save(); g.globalAlpha = st.moon; const pz = [[-1.85, fl, .5], [-.75, fl, .5], [-.95, fl, 1.7], [-1.95, fl, 1.7]]; poly3(g, pz, { seed: 31, grainK: .3 });
    const a = P3(-1.33, fl, .5), b = P3(-1.43, fl, 1.7), c = P3(-1.88, fl, 1.1), d = P3(-.85, fl, 1.1); if (a && b) { cutL(g, a[0], a[1], b[0], b[1], 8, { col: BK }); cutL(g, c[0], c[1], d[0], d[1], 7, { col: BK }); } g.restore(); }
  // Deckenlampe und ihr Lichtkegel auf dem Boden
  { const lz = 2.3, p = P3(0, top, lz), q = P3(0, top + .35, lz); if (p && q) { cutL(g, p[0], p[1], q[0], q[1], 2.5); const r = 60 * q[2] / 300; slab(g, [[q[0] - r * .35, q[1]], [q[0] + r * .35, q[1]], [q[0] + r, q[1] + r * .55], [q[0] - r, q[1] + r * .55]], { seed: 41, grain: false }); } }
  if (st.light > 0) { g.save(); g.globalAlpha = st.light; poly3(g, [[-.55, fl, 2.9], [.55, fl, 2.9], [1.0, fl, 1.5], [-1.0, fl, 1.5]], { seed: 51, grainK: .25 }); g.restore(); }
  // Tür
  { const f = [[DOOR.x0 - .1, DOOR.top - .1, zb], [DOOR.x1 + .1, DOOR.top - .1, zb], [DOOR.x1 + .1, fl, zb], [DOOR.x0 - .1, fl, zb]]; for (let i = 0; i < 3; i++) L3(g, f[i], f[i + 1], 3.2);
    const op = st.doorOpen; // Türblatt dreht nach innen: sichtbare Breite schrumpft
    const xR = mix(DOOR.x1, DOOR.x0 + .1, op), zR = zb + op * .9; const leaf = [[DOOR.x0, DOOR.top, zb], [xR, DOOR.top, zR], [xR, fl, zR], [DOOR.x0, fl, zb]];
    const q = leaf.map(p => P3(...p)); if (q.every(Boolean)) { g.save(); g.fillStyle = BK; g.beginPath(); q.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); g.fill(); g.restore();
      for (let i = 0; i < 4; i++) cutL(g, q[i][0], q[i][1], q[(i + 1) % 4][0], q[(i + 1) % 4][1], 6.5);
      const ip = (u, v) => [mix(mix(q[0][0], q[1][0], u), mix(q[3][0], q[2][0], u), v), mix(mix(q[0][1], q[1][1], u), mix(q[3][1], q[2][1], u), v)];
      for (const [u0, u1, v0, v1] of [[.14, .46, .08, .44], [.54, .86, .08, .44], [.14, .46, .54, .92], [.54, .86, .54, .92]]) { const r = [ip(u0, v0), ip(u1, v0), ip(u1, v1), ip(u0, v1)]; for (let i = 0; i < 4; i++) cutL(g, r[i][0], r[i][1], r[(i + 1) % 4][0], r[(i + 1) % 4][1], 4.2); }
