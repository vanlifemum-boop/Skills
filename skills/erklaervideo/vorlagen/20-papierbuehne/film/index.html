<html lang="de"><head><meta charset="utf-8">
<title>Tonleiter – V7 Papierbühne</title>
<style>

<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="zeiten.js"></script>
<script>
// Tonleiter Musikschule – V7 (Text nur als Name und als Etikett am Objekt, alle Zeiten aus K) im Stil von Andy Lo „Hawking Radiation, a paper stage“ (siehe ../STILBIBEL.md).
const W = 1920, H = 1080, WX0 = 44, WY0 = 44, WX1 = 1876, WY1 = 1046, FL = 932;
const C = { frame: '#c49f6f', frameD: '#b18b5b', val: '#cb6b5f', dot: '#d9a24f', cur: '#e5877a', curD: '#cf6a60',
  wallA: '#ebc461', wallB: '#e5b64e', plank: '#a7703e', plankD: '#8a5a2e', plankL: '#c49f70', deskT: '#c49f70', desk: '#ae8a5f', deskD: '#94724a',
  skin: '#f2caa1', cheek: '#e7a598', hair: '#19141e', hairB: '#3a2b26', teal: '#349c8d', tealD: '#2b8276', coral: '#e38676', coralD: '#c9685a',
  orange: '#e6823a', mustard: '#f3c057', cream: '#f9ecd8', creamD: '#eadcc0', navy: '#1b2352', cloud: '#33306a', ink: '#2a2330',
  blue: '#3c67cd', sweater: '#5f7fc9', sweaterD: '#4d6bb0', edge: '#fbf4e6', wood: '#aa8356', woodD: '#86633e', mouth: '#6b2a2a',
  pants: '#2e3358', honey: '#d99a5b', honeyD: '#b8773f', rose: '#e7a598', shoe: '#2a2330', bezel: '#3a3548' };
const cv = document.getElementById('c'), X = cv.getContext('2d');
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v)), lin = (t, a, b) => clamp((t - a) / (b - a)), mix = (a, b, k) => a + (b - a) * k;
const eo = x => 1 - Math.pow(1 - x, 3), eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c1 = 1.7, c3 = c1 + 1; return x <= 0 ? 0 : x >= 1 ? 1 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const q12 = t => Math.floor(t * 12 + 1e-6) / 12; // Stop-Motion-Stufen
function hsh(n) { n = Math.imul((n | 0) ^ 0x9E3779B9, 0x85EBCA6B); n ^= n >>> 13; n = Math.imul(n, 0xC2B2AE35); n ^= n >>> 16; return (n >>> 0) / 4294967296; }

function hstr(s) { let h = 7; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); return h; }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
let T = 0, STR = null, GR = null, MOT = null, GHOST = 0, SC = 1;

// ---------- Punktlisten ----------
function dens(p, step = 13, closed = true) { const o = []; const n = p.length;
  for (let i = 0; i < (closed ? n : n - 1); i++) { const a = p[i], b = p[(i + 1) % n], d = Math.hypot(b[0] - a[0], b[1] - a[1]), k = Math.max(1, Math.ceil(d / step));
    for (let j = 0; j < k; j++) o.push([mix(a[0], b[0], j / k), mix(a[1], b[1], j / k)]); }
  if (!closed) o.push(p[n - 1]); return o; }
function E(cx, cy, rx, ry = rx, rot = 0) { const n = Math.max(20, Math.ceil((rx + ry) * 3.2 / 12)), o = [], c = Math.cos(rot), s = Math.sin(rot);
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, x = Math.cos(a) * rx, y = Math.sin(a) * ry; o.push([cx + x * c - y * s, cy + x * s + y * c]); } return o; }
function RR(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); const o = [], cs = [[x + w - r, y + r, -Math.PI / 2], [x + w - r, y + h - r, 0], [x + r, y + h - r, Math.PI / 2], [x + r, y + r, Math.PI]];
  for (const [cx, cy, a0] of cs) for (let i = 0; i <= 5; i++) { const a = a0 + i / 5 * Math.PI / 2; o.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return dens(o); }
function PL(p) { return dens(p); }
function CR(p, seg = 7) { const o = [], n = p.length; for (let i = 0; i < n; i++) { const p0 = p[(i - 1 + n) % n], p1 = p[i], p2 = p[(i + 1) % n], p3 = p[(i + 2) % n];
  for (let j = 0; j < seg; j++) { const t = j / seg, t2 = t * t, t3 = t2 * t;
    o.push([.5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
            .5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)]); } } return o; }
function TR(p, x, y, rot = 0, s = 1) { const c = Math.cos(rot) * s, si = Math.sin(rot) * s; return p.map(q => [x + q[0] * c - q[1] * si, y + q[0] * si + q[1] * c]); }
// Papier: statisches Schnittkanten-Zittern + Boil (8 fps)
function wob(p, id, amp) { const f = Math.floor(T * 8), o = []; let d = 0;
  for (let i = 0; i < p.length; i++) { if (i) d += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); const s = d / 44;
    o.push([p[i][0] + vn(id, s) * amp + vn(id + f * 131 + 3, s * .8) * .75, p[i][1] + vn(id + 17, s) * amp + vn(id + f * 131 + 9, s * .8) * .75]); } return o; }
function path(g, p, closed = true) { g.beginPath(); p.forEach((q, i) => i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1])); if (closed) g.closePath(); }
function paper(g, pts, fill, o = {}) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const q of pts) { if (q[0] < x0) x0 = q[0]; if (q[0] > x1) x1 = q[0]; if (q[1] < y0) y0 = q[1]; if (q[1] > y1) y1 = q[1]; }
  const id = o.id ?? ((hstr(fill) + pts.length * 31 + Math.round((x1 - x0) / 9) * 7 + Math.round((y1 - y0) / 9) * 13) | 0);
  const p = wob(pts, id, o.amp ?? 1.3); path(g, p);
  if (GHOST) { g.save(); g.setLineDash([15, 13]); g.lineDashOffset = -Math.floor(T * 8) * 3; g.lineWidth = 5; g.lineCap = 'round'; g.strokeStyle = `rgba(251,244,230,${GHOST})`; g.stroke(); g.restore(); return p; }
  g.save(); if (o.sh !== false) { g.shadowColor = `rgba(58,30,22,${o.sa ?? .22})`; g.shadowBlur = (o.sb ?? 10) * SC; g.shadowOffsetX = 1.5 * SC; g.shadowOffsetY = (o.so ?? 4) * SC; }
  g.fillStyle = fill; g.fill(); g.restore();
  if (o.tex !== false) { g.save(); g.clip(); STR.setTransform(new DOMMatrix().translate(o.ox ?? Math.round(x0), o.oy ?? Math.round(y0)).rotate(-50).scale(o.ts ?? 1));
    g.globalAlpha = o.ta ?? 1; g.fillStyle = STR; g.fillRect(x0 - 3, y0 - 3, x1 - x0 + 6, y1 - y0 + 6); g.restore(); }
  if (o.edge !== false) { g.lineJoin = 'round'; g.lineCap = 'round'; g.lineWidth = o.lw ?? 4; g.strokeStyle = o.ec ?? C.edge; g.stroke(); }
  return p; }
function line(g, p, col, w, o = {}) { if (GHOST) return; const q = o.nowob ? p : wob(p, o.id ?? (hstr(col) + p.length * 7), o.amp ?? .9); g.save(); g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round'; if (o.alpha) g.globalAlpha = o.alpha; path(g, q, false); g.stroke(); g.restore(); }
function dot(g, x, y, r, col) { if (GHOST) return; g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
// Buntstift-Strich (für die Kinderzeichnung)
function crayon(g, p, col, w, prog = 1, seed = 1) { const q = dens(p, 6, false); const n = Math.max(2, Math.ceil(q.length * prog)); if (prog <= 0) return;
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = col;
  for (let k = 0; k < 3; k++) { g.globalAlpha = [.85, .45, .35][k]; g.lineWidth = w * [1, .7, .5][k]; g.beginPath();
    for (let i = 0; i < n; i++) { const x = q[i][0] + vn(seed * 3 + k, i * .3) * w * .18, y = q[i][1] + vn(seed * 3 + k + 50, i * .3) * w * .18; i ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); }
  g.restore(); }

// ---------- Texturen ----------
function makeTex() {
  const w = 1100, c = mk(w, 4), g = c.getContext('2d'), im = g.createImageData(w, 4), R = rng(5), A = new Float32Array(w);
  for (let k = 0; k < 13; k++) { const cx = R() * w, sd = 8 + R() * 55, a = .05 + R() * .12; for (let x = 0; x < w; x++) for (const o of [-w, 0, w]) { const d = (x - cx + o) / sd; A[x] += a * Math.exp(-d * d); } }
  for (let k = 0; k < 9; k++) { const cx = Math.floor(R() * w), ww = 2 + Math.floor(R() * 5), a = .06 + R() * .08; for (let x = cx; x < cx + ww; x++) A[x % w] += a; }
  for (let y = 0; y < 4; y++) for (let x = 0; x < w; x++) { const i = (y * w + x) * 4; im.data[i] = 255; im.data[i + 1] = 250; im.data[i + 2] = 238; im.data[i + 3] = Math.min(255, A[x] * 255); }
  g.putImageData(im, 0, 0); STR = X.createPattern(c, 'repeat');
  const s = 512, c2 = mk(s, s), g2 = c2.getContext('2d'), im2 = g2.createImageData(s, s), R2 = rng(9);
  for (let i = 0; i < s * s; i++) { const v = 128 + (R2() + R2() + R2() - 1.5) * 70; im2.data[i * 4] = im2.data[i * 4 + 1] = im2.data[i * 4 + 2] = v; im2.data[i * 4 + 3] = 255; }
  g2.putImageData(im2, 0, 0); GR = X.createPattern(c2, 'repeat');
  const m = mk(240, 135), g3 = m.getContext('2d'), R3 = rng(21); g3.fillStyle = '#808080'; g3.fillRect(0, 0, 240, 135);
  for (let i = 0; i < 90; i++) { const x = R3() * 240, y = R3() * 135, r = 8 + R3() * 30, v = R3() < .5 ? 255 : 0; const gr = g3.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(${v},${v},${v},.10)`); gr.addColorStop(1, `rgba(${v},${v},${v},0)`); g3.fillStyle = gr; g3.fillRect(x - r, y - r, 2 * r, 2 * r); }
  MOT = m; }

// ---------- Bühne (steht immer) ----------
const CURL = [[WX0, WY0], [214, WY0], [196, 300], [160, 560], [178, 820], [236, WY1], [WX0, WY1]];
function curtainPts(side, sway) { const P = CURL.map(([x, y], i) => [side < 0 ? x : W - x, y]);
  const inner = [P[1], P[2], P[3], P[4], P[5]].map((q, i) => [q[0] + (i > 0 && i < 4 ? sway * side * [0, .5, 1, .6, 0][i] : 0), q[1]]);
  // Catmull-Rom offen über die Innenkante
  const cr = []; for (let i = 0; i < inner.length - 1; i++) { const p0 = inner[Math.max(0, i - 1)], p1 = inner[i], p2 = inner[i + 1], p3 = inner[Math.min(inner.length - 1, i + 2)];
    for (let j = 0; j < 12; j++) { const t = j / 12, t2 = t * t, t3 = t2 * t;
      cr.push([.5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
               .5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)]); } }
  cr.push(inner[inner.length - 1]); return { outer: P[0][0], edge: cr, poly: [P[0], ...cr, P[6]] }; }
function stage(g, t) {
  const sway = Math.sin(q12(t) * 1.1) * 5;
  for (const side of [-1, 1]) { const cp = curtainPts(side, sway);
    paper(g, dens(cp.poly, 14), C.cur, { sb: 22, so: 6, sa: .32, id: 40 + side, ta: .9 });
    // Faltenlinien folgen der Innenkante
    for (let k = 1; k <= 5; k++) { const f = k / 6.3, pts = cp.edge.filter((_, i) => i % 3 === 0).map(q => [mix(cp.outer, q[0], f) + side * -2, q[1] + 6]);
      pts[0][1] = WY0 + 60; line(g, pts, C.curD, 3.4, { id: 60 + k + side * 9, amp: 1.2, alpha: .9 }); } }
  // Borte: Bögen hängen durch, Spitzen zeigen nach oben, Senfpunkte
  const n = 10, bw = (WX1 - WX0) / n, bp = [[WX0 - 4, WY0], [WX1 + 4, WY0]];
  for (let i = n; i >= 0; i--) { const x = WX0 + i * bw; bp.push([x, 92]); if (i > 0) for (let j = 1; j < 8; j++) { const u = j / 8; bp.push([x - u * bw, 92 + Math.sin(u * Math.PI) * 33]); } }
  paper(g, bp, C.val, { sb: 16, so: 5, sa: .3, id: 77, ta: .8 });
  for (let i = 0; i < n; i++) { const x = WX0 + (i + .5) * bw; dot(g, x, 100, 7.5, C.dot); dot(g, x - 2, 98, 2.5, 'rgba(255,240,200,.5)'); }
  // Kraftpappe-Rahmen mit dünner weißer Innenlinie
  g.save(); g.beginPath(); g.rect(0, 0, W, H); g.rect(WX1, WY0, -(WX1 - WX0), WY1 - WY0); g.fillStyle = C.frame; g.fill('evenodd'); g.clip('evenodd');
  STR.setTransform(new DOMMatrix().rotate(-50).scale(1.6)); g.globalAlpha = .5; g.fillStyle = STR; g.fillRect(0, 0, W, H); g.globalAlpha = .18; g.fillStyle = C.frameD;
  for (let i = 0; i < 40; i++) g.fillRect(0, (i * 53) % H, W, 1.5); g.restore();
  g.save(); g.strokeStyle = C.edge; g.lineWidth = 3.5; g.shadowColor = 'rgba(60,30,20,.35)'; g.shadowBlur = 8; g.shadowOffsetY = 2; g.strokeRect(WX0 - 1, WY0 - 1, WX1 - WX0 + 2, WY1 - WY0 + 2); g.restore(); }

// ---------- Bühnenbild-Bausteine ----------
function wallStripes(g, a = C.wallA, b = C.wallB) { g.fillStyle = a; g.fillRect(-300, -300, 2520, FL + 300); g.fillStyle = b;
  for (let x = -300 + 46; x < 2220; x += 184) g.fillRect(x, -300, 92, FL + 300);
  g.save(); STR.setTransform(new DOMMatrix().rotate(-50).scale(2.2)); g.globalAlpha = .55; g.fillStyle = STR; g.fillRect(-300, -300, 2520, FL + 300); g.restore();
  const gr = g.createLinearGradient(0, FL - 160, 0, FL); gr.addColorStop(0, 'rgba(120,70,30,0)'); gr.addColorStop(1, 'rgba(120,70,30,.14)'); g.fillStyle = gr; g.fillRect(-300, FL - 160, 2520, 160); }
function floor(g) { g.fillStyle = C.plank; g.fillRect(-300, FL, 2520, 500);
  g.save(); STR.setTransform(new DOMMatrix().translate(0, FL).rotate(-50).scale(1.4)); g.globalAlpha = .6; g.fillStyle = STR; g.fillRect(-300, FL, 2520, 500); g.restore();
  g.fillStyle = C.plankL; g.fillRect(-300, FL - 4, 2520, 12); g.fillStyle = 'rgba(251,244,230,.8)'; g.fillRect(-300, FL - 5, 2520, 2.5);
  g.save(); g.strokeStyle = C.plankD; g.lineWidth = 3; g.globalAlpha = .75;
  const rows = [FL + 8, FL + 58, FL + 118, FL + 190];
  for (let r = 0; r < rows.length - 1; r++) { const ya = rows[r], yb = rows[r + 1]; if (r) { g.beginPath(); g.moveTo(-300, ya); g.lineTo(2220, ya); g.stroke(); }
    for (let x = -300 + (r % 2) * 80; x < 2220; x += 160) { const xa = x + (x - 960) * r * .05, xb = x + (x - 960) * (r + 1) * .05; g.beginPath(); g.moveTo(xa, ya); g.lineTo(xb, yb); g.stroke(); } }
  g.restore(); }
const STARS = (() => { const R = rng(33), o = []; for (let i = 0; i < 190; i++) o.push([R() * 1920, R() * 900, .8 + R() * 2.4, R() * 6.28, R() < .25 ? 1 : 0]); return o; })();
function nightSky(g, t) { g.fillStyle = C.navy; g.fillRect(-300, -300, 2520, FL + 300);
  g.save(); STR.setTransform(new DOMMatrix().rotate(-50).scale(2.4)); g.globalAlpha = .12; g.fillStyle = STR; g.fillRect(-300, -300, 2520, FL + 300); g.restore();
  for (const [x, y, rx, ry, id] of [[330, 190, 330, 55, 1], [1500, 150, 360, 60, 2], [1260, 600, 380, 62, 3], [420, 640, 300, 50, 4]]) {
    const dx = Math.sin(q12(t) * .25 + id) * 14; g.save(); g.shadowColor = 'rgba(51,48,106,.9)'; g.shadowBlur = 26;
    for (const [ox, oy, sx, sy] of [[0, 0, 1, 1], [-.45, .15, .55, .85], [.5, .1, .5, .8]]) paper(g, E(x + dx + ox * rx, y + oy * ry, rx * sx, ry * 1.35 * sy), C.cloud, { edge: false, sh: false, id: 300 + id * 3 + Math.round(ox * 4), ta: .8, amp: 5 });
    g.restore(); }

function starField(g, t, yMax = 900) { for (let i = 0; i < STARS.length; i++) { const [x, y, r, ph, col] = STARS[i]; if (y > yMax) continue;
  const tw = .55 + .45 * Math.sin(Math.floor(t * 8) * .9 + ph * 3); dot(g, x, y, r * (col ? 1.2 : 1), col ? `rgba(243,192,87,${tw})` : `rgba(251,244,230,${tw})`); } }
function duskSky(g, t) { const gr = g.createLinearGradient(0, 40, 0, FL); gr.addColorStop(0, '#3a3450'); gr.addColorStop(.45, '#5a4454'); gr.addColorStop(.8, '#9a6466'); gr.addColorStop(1, '#c98a70');
  g.fillStyle = gr; g.fillRect(-300, -300, 2520, FL + 300);
  g.save(); STR.setTransform(new DOMMatrix().rotate(-50).scale(2.4)); g.globalAlpha = .18; g.fillStyle = STR; g.fillRect(-300, -300, 2520, FL + 300); g.restore();
  starField(g, t, 560); }
function pin(g, x, y, col = C.coralD) { dot(g, x + 1, y + 2, 9, 'rgba(60,30,20,.25)'); dot(g, x, y, 8, col); dot(g, x - 2.5, y - 2.5, 2.5, 'rgba(255,255,255,.6)'); }
function string(g, x, y0, y1, a = .9) { g.save(); g.strokeStyle = `rgba(251,244,230,${a})`; g.lineWidth = 2.2; g.beginPath(); g.moveTo(x, y0); g.lineTo(x + Math.sin(T * 3) * .8, y1); g.stroke(); g.restore(); }

// ---------- Figuren ----------
// o: x,y (Füße bzw. Sitzfläche), s, who ('mom'|'teacher'|'kid'), sit, seatH, hands {L,R} in Weltkoordinaten, look, mouth, smile, sad, flip
function person(g, o) {
  const s = o.s, fl = o.flip ? -1 : 1; g.save(); g.translate(o.x, o.y); g.scale(s * fl, s);
  const br = 1 + Math.sin(q12(T) * 2.2 + (o.ph || 0)) * .012, kid = o.who === 'kid';
  const hipY = o.sit ? -14 : (kid ? -118 : -150), torH = kid ? 175 : (o.sit ? 220 : 245), top = hipY - torH * br, bw = kid ? 118 : 150;
  const local = w => w ? [((w[0] - o.x) / s) * fl, (w[1] - o.y) / s] : null;
  const col = o.who === 'teacher' ? C.teal : o.who === 'kid' ? C.coral : C.sweater;
  // Beine
  if (o.sit) { const sh = (o.seatH || 150) / s; for (const lx of [-36, 36]) { paper(g, RR(lx - 19, 10, 38, sh - 6, 16), kid ? C.skin : C.pants, { id: 910 + lx }); paper(g, E(lx + 4, sh - 6, 30, 12), C.shoe, { id: 920 + lx, lw: 3 }); }
    paper(g, RR(-84, -28, 168, 60, 26), kid ? C.coral : C.pants, { id: 905 }); }
  else { const st = o.step || 0; for (const [lx, k] of [[-26, 1], [26, -1]]) { const lift = Math.max(0, Math.sin(st + (k > 0 ? 0 : Math.PI))) * 16;
    paper(g, RR(lx - (kid ? 12 : 20), hipY - 6, kid ? 24 : 40, -hipY - 8 - lift, 14), kid ? C.skin : C.pants, { id: 930 + lx });
    paper(g, E(lx + 8, -9 - lift, kid ? 22 : 30, kid ? 10 : 12), C.shoe, { id: 940 + lx, lw: 3 }); } }
  // hinterer Arm
  const shL = [-bw / 2 + 12, top + 34], shR = [bw / 2 - 12, top + 34];

  person(g, { x: mx + 160, y: FL + 40, s: .6, who: 'kid', step: walk, smile: true, look: -1, ph: 2, hands: { L: [mx + 80, FL - 170], R: [mx + 230, FL - 110 - (t > K.kostenlos - .04 ? 120 * Math.abs(Math.sin(tq * 5)) : 0)] } });
  // Adresse als Papierschild am Pult
  const lk = back(lin(tq, K.kostenlos + .35, K.kostenlos + .68)); if (lk > 0) { g.save(); g.translate(890, 880); g.scale(lk, lk); g.rotate(-.015); paper(g, RR(-370, -44, 740, 88, 10), C.cream, { id: 1620, sb: 10 });
    g.font = '44px MA'; g.textAlign = 'center'; g.fillStyle = C.ink; g.fillText('tonleiter-musikschule.de · 0711 204 58 30', 0, 15); g.restore(); } }

// ---------- Titel (Buntstift) und Papierkarten ----------
const TCACHE = {};
function titleImg(s, size, col) { const key = s + size + col; if (TCACHE[key]) return TCACHE[key];
  const g0 = mk(10, 10).getContext('2d'); g0.font = `${size}px MA`; const w = Math.ceil(g0.measureText(s).width + size * .6), h = Math.ceil(size * 1.6);
  const c = mk(w, h), g = c.getContext('2d'); g.font = `${size}px MA`; g.lineJoin = 'round'; g.textBaseline = 'alphabetic'; const x = size * .3, y = size * 1.12;
  g.shadowColor = 'rgba(80,40,20,.25)'; g.shadowBlur = 6; g.shadowOffsetY = 3; g.strokeStyle = C.edge; g.lineWidth = size * .13; g.strokeText(s, x, y); g.shadowColor = 'transparent';
  g.fillStyle = col; g.fillText(s, x, y);
  // Buntstift-Korn: helle Sprenkel nur auf der Schrift
  g.globalCompositeOperation = 'source-atop'; const R = rng(hstr(s)); for (let i = 0; i < w * h / 40; i++) { g.fillStyle = `rgba(255,255,255,${R() * .16})`; g.fillRect(R() * w, R() * h, 2, 2); }
  g.fillStyle = 'rgba(255,255,255,.07)'; for (let i = 0; i < 6; i++) g.fillRect(0, y - size * .8 + i * size * .15, w, 2);
  TCACHE[key] = { c, w, h, ox: x, oy: y }; return TCACHE[key]; }
function title(g, t, s, x, y, size, col, t0, t1, tOut) { if (t < t0 || t > tOut + .14) return; const im = titleImg(s, size, col);
  const k = clamp((t - t0) / (t1 - t0)), out = clamp((t - tOut) / .14), f = Math.floor(T * 8);
  g.save(); g.globalAlpha = 1 - out; const bx = x - im.ox + (vn(hstr(s), f) * .8), by = y - im.oy - out * 16 + vn(hstr(s) + 3, f) * .8;
  g.beginPath(); const rw = im.w * k; g.moveTo(bx, by); g.lineTo(bx + rw, by); for (let i = 0; i <= 8; i++) g.lineTo(bx + rw + (i % 2 ? 10 : 0) * (k < 1 ? 1 : 0), by + im.h * i / 8); g.lineTo(bx, by + im.h); g.closePath(); g.clip();
  g.drawImage(im.c, bx, by); g.restore(); }
function card(g, t, s, x, y, size, t0, t1, tOut, o = {}) { if (t < t0 || t > tOut + .15) return; const k = back(lin(q12(t) + 1 / 24, t0, t1)), out = eio(clamp((t - tOut) / .15));
  g.save(); g.font = `${size}px MA`; const w = g.measureText(s).width + size * 1.1, h = size * 1.75; g.translate(x + w / 2, y + h / 2); g.rotate(o.rot || -.015); g.scale(k * (1 - out * .3), k * (1 - out * .3)); g.globalAlpha = 1 - out;
  paper(g, RR(-w / 2, -h / 2, w, h, 22), '#fbf6ec', { id: hstr(s), sb: 14, so: 5, sa: .28, ta: .5 });
  g.fillStyle = C.ink; g.textAlign = 'center'; g.fillText(s, 0, size * .36);
  if (o.under) { const u = clamp((t - o.under[0]) / (o.under[1] - o.under[0])); if (u > 0) { const w2 = g.measureText(o.under[2]).width, x2 = w / 2 - size * .55 - w2; crayon(g, [[x2, size * .62], [x2 + w2, size * .56]], C.coralD, 9, u, 90); } }
  g.restore(); }
// Papieretikett an einem Faden (Text am Objekt), Buntstift-Handschrift
function paperTag(g, ax, ay, cx, cy, s, k, size = 44) { if (k <= 0) return; g.save(); g.font = `${size}px MA`; const w = g.measureText(s).width + size * .9, h = size * 1.55, sw = Math.sin(q12(T) * 2.1) * .04;
  g.strokeStyle = 'rgba(251,244,230,.95)'; g.lineWidth = 2.2; g.beginPath(); g.moveTo(ax, ay); g.lineTo(cx, cy - h / 2 + 10); g.stroke();
  g.translate(cx, cy - h / 2 + 10); g.rotate(sw + (1 - Math.min(1, k)) * .6); g.scale(k, k); g.translate(0, h / 2 - 10);
  paper(g, RR(-w / 2, -h / 2, w, h, 10), '#fbf6ec', { id: hstr(s), sb: 10, so: 4, sa: .25, ta: .5 }); dot(g, 0, -h / 2 + 11, 5, C.creamD);
  g.fillStyle = C.blue; g.textAlign = 'center'; g.fillText(s, 0, size * .36 + 5); g.restore(); }
// Aufkleber „kostenlos“ – springt auf die Karte, auf seinem Wort
function sticker(g, t, s, x, y, size, t0, t1) { if (t < t0) return; const k = back(lin(q12(t) + 1 / 24, t0, t1)); g.save(); g.font = `${size}px MA`; const w = g.measureText(s).width + size * .9, h = size * 1.6;
  g.translate(x + w / 2, y + h / 2); g.rotate(-.09); g.scale(k, k); paper(g, RR(-w / 2, -h / 2, w, h, 16), C.coralD, { id: hstr(s) + 5, sb: 12, so: 5, sa: .3, ta: .6 });
  g.fillStyle = C.cream; g.textAlign = 'center'; g.fillText(s, 0, size * .36); g.restore(); }
function texts(g, t) { const BL = C.blue, X0 = 380, Y1 = 222;
  // Buntstift-Titel nur als Name – wie „Hawking Radiation“ im Original, als Ganzes, fertig auf dem Wort
  title(g, t, 'Tonleiter', X0, Y1, 92, BL, K.tonleiter - .34, K.tonleiter - .04, K.lehrer + .1);
  title(g, t, 'Tonleiter Musikschule', X0, Y1, 84, BL, K.tl2 - .36, K.tl2 - .04, 99);
  // Angebot: zwei Wörter, jedes auf seinem Wort
  card(g, t, 'Probestunde', 400, 290, 60, K.probe - .28, K.probe - .02, 99);
  X.save(); X.font = '60px MA'; const cw = X.measureText('Probestunde').width + 66; X.restore();
  sticker(g, t, 'kostenlos', 400 + cw + 18, 282, 58, K.kostenlos - .26, K.kostenlos - .02); }

// ---------- Kamera und Übergänge ----------
function camA(t) { const e = K.eins - .12, push = 1 + .035 * eio(lin(q12(t), 0, e)); return { s: push, cx: mix(960, 1020, lin(t, 0, e)), cy: 545 + 20 * lin(t, 0, e) }; }
function applyCam(g, c) { g.translate(960, 545); g.scale(c.s, c.s); g.translate(-c.cx, -c.cy); SC = c.s; }
function gentle(t, a, b, fx = 960, fy = 545, amt = .03) { const k = eio(lin(q12(t), a, b)); return { s: 1 + amt * k, cx: mix(960, fx, k), cy: mix(545, fy, k) }; }
function drawScene(g, id, t) { g.save();
  if (id === 'A') { applyCam(g, camA(t)); sceneA(g, t); }
  else if (id === 'B') { applyCam(g, gentle(t, K.eins + .05, K.tl - .39, 1000, 600, .035)); sceneB(g, t); }
  else if (id === 'C') { applyCam(g, gentle(t, K.tl - .49, K.ton1 - .55, 900, 560, .035)); sceneC(g, t); }
  else if (id === 'D') { applyCam(g, gentle(t, K.ton1 - .65, K.heute - .27, 1000, 520, .04)); sceneD(g, t); }
  else if (id === 'E') { applyCam(g, gentle(t, K.heute - .27, K.tl2 - .44, 1050, 620, .045)); sceneE(g, t); }
  else if (id === 'F') { applyCam(g, gentle(t, K.tl2 - .64, DUR, 940, 560, .03)); sceneF(g, t); }
  g.restore(); SC = 1; }
function roll(g, t, a, b, oldId, newId, up) { // Bühnenbild rollt sich wie eine Schriftrolle auf (up) oder ab
  const k = eio(lin(q12(t), a, b)), ry = up ? mix(WY1 + 20, WY0 - 60, k) : mix(WY0 - 60, WY1 + 20, k);
  drawScene(g, up ? newId : oldId, t);
  g.save(); g.beginPath(); g.rect(0, WY0, W, ry - WY0); g.clip(); drawScene(g, up ? oldId : newId, t); g.restore();
  // Rolle
  g.save(); const gr = g.createLinearGradient(0, ry - 26, 0, ry + 26); gr.addColorStop(0, '#d9c6a4'); gr.addColorStop(.45, '#f9ecd8'); gr.addColorStop(1, '#b89c74');
  g.shadowColor = 'rgba(40,20,20,.45)'; g.shadowBlur = 18; g.shadowOffsetY = 8; g.fillStyle = gr; g.fillRect(WX0, ry - 24, WX1 - WX0, 48); g.shadowColor = 'transparent';
  g.strokeStyle = C.edge; g.lineWidth = 3; g.strokeRect(WX0, ry - 24, WX1 - WX0, 48); g.restore(); }
function scenes(g, t) {
  const F0 = K.eins - .07, F1 = K.lied - .35;
  if (t < F0) drawScene(g, 'A', t);
  else if (t < F1) { // Fahrt in die Zeichnung: die Zeichnung wird zur Welt
    const k = eio(lin(q12(t) + 1 / 24, F0, F1)), c0 = camA(t), s1 = (WX1 - WX0) / DR.w, s = Math.exp(mix(Math.log(c0.s), Math.log(s1), k));
    const cx = mix(c0.cx, DR.x + DR.w / 2 - (960 - (WX0 + WX1) / 2) / s1, k), cy = mix(c0.cy, DR.y + DR.h / 2 - (545 - (WY0 + WY1) / 2) / s1, k);
    g.save(); applyCam(g, { s, cx, cy }); sceneA(g, t);
    const a = clamp((k - .3) / .55); if (a > 0) { g.save(); g.beginPath(); g.rect(DR.x, DR.y, DR.w, DR.h); g.clip(); g.globalAlpha = a; g.translate(DR.x, DR.y); g.scale(DR.w / (WX1 - WX0), DR.h / (WY1 - WY0)); g.translate(-WX0, -WY0); SC = 1; sceneB(g, t); g.restore(); }
    g.restore(); SC = 1; }
  else if (t < K.tl - .69) drawScene(g, 'B', t);
  else if (t < K.tl - .27) roll(g, t, K.tl - .69, K.tl - .27, 'B', 'C', true);
  else if (t < K.lehrer + .12) drawScene(g, 'C', t);
  else if (t < K.lehrer + .5) roll(g, t, K.lehrer + .12, K.lehrer + .5, 'C', 'D', true);  // erst nach „Lehrer“, damit der Kreis steht
  else if (t < K.heute - .31) drawScene(g, 'D', t);
  else if (t < K.heute - .03) roll(g, t, K.heute - .31, K.heute - .03, 'D', 'E', false);
  else if (t < K.tl2 - .74) drawScene(g, 'E', t);
  else if (t < K.tl2 - .4) roll(g, t, K.tl2 - .74, K.tl2 - .4, 'E', 'F', true);
  else drawScene(g, 'F', t); }

function draw(t) { T = t; const g = X; g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  g.save(); g.beginPath(); g.rect(WX0, WY0, WX1 - WX0, WY1 - WY0); g.clip(); scenes(g, t);
  // Papier-Wolkigkeit, Vignette im Bühnenfenster
  g.globalCompositeOperation = 'soft-light'; g.globalAlpha = .55; g.drawImage(MOT, WX0, WY0, WX1 - WX0, WY1 - WY0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  const vg = g.createRadialGradient(960, 560, 380, 960, 560, 1150); vg.addColorStop(0, 'rgba(40,20,30,0)'); vg.addColorStop(1, 'rgba(40,20,30,.22)'); g.fillStyle = vg; g.fillRect(0, 0, W, H);
  texts(g, t); g.restore();
  stage(g, t);
  g.globalCompositeOperation = 'overlay'; g.globalAlpha = .16; GR.setTransform(new DOMMatrix()); g.fillStyle = GR; g.fillRect(0, 0, W, H); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; }

const ready = (async () => { const f = new FontFace('MA', 'url(Mali-Bold.ttf)'); await f.load(); document.fonts.add(f); makeTex(); draw(0); })();
window.FILM = { duration: DUR, width: W, height: H, ready, seek(t) { draw(t); } };
</script></body></html>
