<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<title>Grün-Pfeil – V7 Pixel-Art</title>
<style>
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="zeiten.js"></script>
<script>
// Fahrschule Grün-Pfeil – V7 (Text und Timing neu, siehe ../REGIE.md) im Stil von Ahmed T'aide „It Wrote Every Frame“, Welt 1 (siehe ../STILBIBEL.md).
// Echte Welt in 320×180 Pixeln, Faktor 6 ohne Glättung. Parallax-Ebenen werden weich verschoben, Figuren laufen auf 12 fps.
const W = 1920, H = 1080, LW = 320, LH = 180, S = 6, GY = 148;
const P = { sky0: '#172141', sky: '#1b2a50', mag: '#7c2550', magD: '#64193f', pink: '#ff81c1', salmon: '#f2867c', sunY: '#fcec25', sunO: '#fda300', sunR: '#e70047',
  grass: '#00e432', grassD: '#00864e', brick: '#96443c', mortar: '#7a382e', speck: '#f3d3b0', ink: '#1b172c', ink2: '#111022', screen: '#291f41', cyan: '#67ffdf',
  orange: '#f88954', orangeL: '#ffb07a', cream: '#fef2ea', cloudL: '#eb649f', cloudD: '#922d69', white: '#ffffff', gray: '#5a5560', grayL: '#8a8494',
  housing: '#2b2842', housingL: '#4a4466', yel: '#fcec25', red: '#e70047', green: '#00e432', skin: '#f4b58c', hair: '#3a2230', navy2: '#2c3a6a' };
const cv = document.getElementById('c'), X = cv.getContext('2d'); X.imageSmoothingEnabled = false;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v)), lin = (t, a, b) => clamp((t - a) / (b - a)), mix = (a, b, k) => a + (b - a) * k;
const eo = x => 1 - Math.pow(1 - x, 3), eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const bounce = x => { if (x >= 1) return 1; const n = 7.5625, d = 2.75; if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + .75; if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + .9375; return n * (x -= 2.625 / d) * x + .984375; };
const q12 = t => Math.floor(t * 12 + 1e-6) / 12;
function hsh(n) { n = Math.imul((n | 0) ^ 0x9E3779B9, 0x85EBCA6B); n ^= n >>> 13; n = Math.imul(n, 0xC2B2AE35); n ^= n >>> 16; return (n >>> 0) / 4294967296; }
function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return c; }
const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
const bay = (x, y) => BAYER[((y % 4) + 4) % 4][((x % 4) + 4) % 4];
function R_(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); }
function px(g, x, y, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), 1, 1); }
function circ(g, cx, cy, r, c) { g.fillStyle = c; for (let y = -r; y <= r; y++) { const w = Math.floor(Math.sqrt(r * r + r * .8 - y * y)); if (w >= 0) g.fillRect(Math.round(cx - w), Math.round(cy + y), 2 * w + 1, 1); } }
function box(g, x, y, w, h, c, o = P.ink) { R_(g, x - 1, y - 1, w + 2, h + 2, o); R_(g, x, y, w, h, c); }
let T = 0;

// ---------- Pixel-Schrift (Silkscreen, 5 Zeilen, hart geschwellt) ----------
const FC = {}; let CAPTOP = 3;
function capTop() { const t = mk(16, 12), g = t.getContext('2d'); g.font = '8px SK'; g.textBaseline = 'top'; g.fillStyle = '#fff'; g.fillText('H', 1, 3); const d = g.getImageData(0, 0, 16, 12).data; for (let y = 0; y < 12; y++) for (let x = 0; x < 16; x++) if (d[(y * 16 + x) * 4 + 3] > 110) return y; return 3; }
function glyphs(s, col) { const key = s + '|' + col; if (FC[key]) return FC[key];
  const t = mk(8 * s.length + 8, 14), g = t.getContext('2d'); g.font = '8px SK'; g.textBaseline = 'top'; g.fillStyle = '#fff'; g.fillText(s, 1, 3);
  const d = g.getImageData(0, 0, t.width, 14).data; let x0 = 1e9, x1 = -1, y0 = 1e9, y1 = -1;
  for (let y = 0; y < 14; y++) for (let x = 0; x < t.width; x++) if (d[(y * t.width + x) * 4 + 3] > 110) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  const w = x1 - x0 + 1, h = 8, c = mk(w, h), cg = c.getContext('2d'); cg.fillStyle = col;
  const base = CAPTOP; // Versalhöhe (Umlautpunkte liegen 2 Zeilen darüber)
  for (let y = 0; y < 14; y++) for (let x = x0; x <= x1; x++) if (d[(y * t.width + x) * 4 + 3] > 110) cg.fillRect(x - x0, y - base + 2, 1, 1);
  return FC[key] = { c, w, h }; }
// Text in Welt-Pixeln: sc = Pixel pro Schriftpixel; sh = Schattenfarbe (Versatz), chroma = [links, rechts]
function ptext(g, s, x, y, sc, col, o = {}) { const gl = glyphs(s, col), w = gl.w * sc; const xx = Math.round(o.align === 'center' ? x - w / 2 : o.align === 'right' ? x - w : x), yy = Math.round(y - 2 * sc);
  if (o.chroma) { g.drawImage(glyphs(s, o.chroma[0]).c, xx - sc, yy + Math.ceil(sc / 2), w, gl.h * sc); g.drawImage(glyphs(s, o.chroma[1]).c, xx + sc, yy - Math.floor(sc / 2), w, gl.h * sc); }
  if (o.sh) g.drawImage(glyphs(s, o.sh).c, xx + (o.so ?? sc), yy + (o.so ?? sc), w, gl.h * sc);
  g.drawImage(gl.c, xx, yy, w, gl.h * sc); return w; }
const tw = (s, sc) => glyphs(s, '#fff').w * sc;

// ---------- statische Ebenen ----------
let SKYN, SKYD, HILLS, CITY, FAR, NEAR, GROUND, MASKS = [];
function makeSky(dawn) { const c = mk(LW, LH), g = c.getContext('2d');
  const sky0 = dawn ? '#2d3f7c' : P.sky0, sky = dawn ? '#3b4f8e' : P.sky, mag = dawn ? '#a13a6c' : P.mag, pink = dawn ? '#ffa0cf' : P.pink, dot2 = dawn ? '#ffc35a' : P.sunO;
  for (let y = 0; y < LH; y++) for (let x = 0; x < LW; x++) { let col;
    if (y < 14) col = bay(x, y) < (y / 14) * 16 ? sky : sky0;
    else if (y < 44) col = sky;
    else if (y < 50) col = (x % 2 === 0 && y % 2 === 0) ? mag : sky;                         // Nacht → Magenta: lockeres Punktraster
    else if (y < 55) col = (x + y) % 2 === 0 ? mag : sky;
    else if (y < 66) col = mag;
    else if (y < 72) col = (x % 2 === 0 && y % 2 === 0) ? pink : mag;                         // lockere rosa Punkte
    else if (y < 77) col = (x + y) % 2 === 0 ? pink : mag;                                     // Schachbrett
    else if (y < 81) col = (x % 2 === 0 && y % 2 === 1) ? mag : pink;
    else col = (x % 3 === 0 && y % 3 === 0 && y > 92) ? dot2 : pink;                           // Horizontglühen mit Orangepunkten
    g.fillStyle = col; g.fillRect(x, y, 1, 1); }
  return c; }
function makeMasks() { for (let k = 0; k <= 16; k++) { const c = mk(LW, LH), g = c.getContext('2d'); g.fillStyle = '#fff'; for (let y = 0; y < LH; y++) for (let x = 0; x < LW; x++) if (bay(x, y) < k) g.fillRect(x, y, 1, 1); MASKS.push(c); } }
function pine(g, x, base, top, w, col) { // Tanne mit treppigen Stufen
  const h = base - top; for (let y = top; y <= base; y++) { const k = (y - top) / h; let hw = Math.floor(k * w / 2 + (y % 5 < 2 ? 0 : 1) * k * 2.4); if (y - top < 3) hw = 0; g.fillStyle = col; g.fillRect(x - hw, y, hw * 2 + 1, 1); } }
function makeLayers() {
  // Hügel (Magenta), Welle periodisch über 640
  HILLS = mk(640, LH); let g = HILLS.getContext('2d');
  for (let x = 0; x < 640; x++) { const a = x / 640 * Math.PI * 2, top = Math.round(90 - 8 * Math.sin(a * 3 + .5) - 4 * Math.sin(a * 7 + 1.3) - 2 * Math.sin(a * 13)); R_(g, x, top, 1, LH - top, P.mag); }
  // Stadt-Silhouette statt Burg: Türme in Magenta, gelbe Fensterpixel
  CITY = mk(900, LH); g = CITY.getContext('2d'); const Rc = rng(7);
  const towers = [[64, 14, 58], [80, 18, 40], [100, 12, 62], [212, 12, 62], [226, 22, 34], [250, 12, 54], [452, 14, 56], [468, 18, 42], [562, 12, 60], [576, 16, 46], [704, 14, 60], [720, 18, 44], [812, 12, 64], [826, 16, 50]];
  for (const [x, w, top] of towers) { R_(g, x, top, w, 120 - top, P.mag); if (top < 60) { R_(g, x + 2, top - 3, w - 4, 3, P.mag); R_(g, x + Math.floor(w / 2) - 1, top - 9, 2, 6, P.mag); }
    for (let yy = top + 4; yy < 110; yy += 5) for (let xx = x + 2; xx < x + w - 2; xx += 4) if (Rc() < .22) R_(g, xx, yy, 1, 2, P.yel); }
  // ferne Tannen (Magenta), nahe Tannen (Nachtblau)
  FAR = mk(640, LH); g = FAR.getContext('2d'); const Rf = rng(11); R_(g, 0, 128, 640, 30, P.mag);
  for (let x = 4; x < 640; x += 7 + Math.floor(Rf() * 6)) pine(g, x, 150, 96 + Math.floor(Rf() * 22), 10 + Math.floor(Rf() * 6), P.mag);
  for (let x = 0; x < 640; x++) { const top = 118 + Math.round(4 * Math.sin(x / 640 * Math.PI * 12)); R_(g, x, top + 10, 1, 40, P.mag); }
  NEAR = mk(640, LH); g = NEAR.getContext('2d'); const Rn = rng(13);
  for (let x = 6; x < 640; x += 9 + Math.floor(Rn() * 12)) pine(g, x, 150, 74 + Math.floor(Rn() * 44), 12 + Math.floor(Rn() * 8), P.sky);
  // Boden: Grasnarbe mit Halmen und Blüten, Ziegel mit Fugen und Sprenkeln
  GROUND = mk(640, LH); g = GROUND.getContext('2d'); const Rg = rng(17);
  R_(g, 0, GY, 640, 3, P.grass); R_(g, 0, GY + 3, 640, 1, P.grassD); R_(g, 0, GY + 4, 640, LH - GY - 4, P.brick);
  for (let x = 0; x < 640; x++) { if (Rg() < .45) R_(g, x, GY - 1, 1, 1, P.grass); if (Rg() < .18) R_(g, x, GY - 2 - Math.floor(Rg() * 2), 1, 2, P.grass); if (Rg() < .02) R_(g, x, GY - 2, 2, 2, Rg() < .5 ? P.pink : P.yel); }
  for (let r = 0; r * 7 + GY + 4 < LH; r++) { const y = GY + 4 + r * 7; R_(g, 0, y + 6, 640, 1, P.mortar); for (let x = (r % 2) * 8; x < 640; x += 16) R_(g, x, y, 1, 6, P.mortar); }
  for (let i = 0; i < 900; i++) R_(g, Math.floor(Rg() * 640), GY + 5 + Math.floor(Rg() * 27), 1, 1, P.speck); }
function tile(img, off, f = 1) { const w = img.width, o = ((off % w) + w) % w; X.drawImage(img, -o * S, 0, w * S, LH * S); if (-o + w < LW + 2) X.drawImage(img, (-o + w) * S, 0, w * S, LH * S); }

// ---------- Figuren (12 fps) ----------
function car(g, x, y, o = {}) { // x = linke Kante, y = Bodenlinie
  x = Math.round(x); y = Math.round(y); const k = o.flash ? '#ffffff' : null, body = k || P.orange, scr = k || P.screen, eye = k || P.cyan;
  // Dachschild: vor dem Power-up gelbes „L“-Schild, danach das Grünpfeil-Schild
  if (o.sign === 1) { box(g, x + 11, y - 27, 9, 5, k || P.yel); R_(g, x + 14, y - 26, 1, 4, P.ink); R_(g, x + 14, y - 23, 3, 1, P.ink); }
  else if (o.sign === 2) { box(g, x + 9, y - 28, 12, 6, k || P.ink2, k ? P.ink : P.cream); R_(g, x + 11, y - 26, 6, 2, k || P.green); R_(g, x + 17, y - 27, 1, 4, k || P.green); R_(g, x + 18, y - 26, 1, 2, k || P.green); }
  if (o.sign) R_(g, x + 14, y - 22, 2, 2, P.ink);
  box(g, x + 5, y - 20, 20, 10, body); R_(g, x + 7, y - 18, 16, 7, scr);                      // Kabine = Bildschirmgesicht
  const bl = Math.floor(T * 8) % 23 === 0 ? 1 : 3, lk = o.look || 0; R_(g, x + 10 + lk, y - 16 + (3 - bl), 3, bl, eye); R_(g, x + 16 + lk, y - 16 + (3 - bl), 3, bl, eye);
  box(g, x + 1, y - 11, 30, 8, body); R_(g, x + 2, y - 10, 28, 1, k || P.orangeL);
  R_(g, x + 28, y - 9, 3, 2, k || P.yel); R_(g, x + 1, y - 9, 1, 3, k || P.red);
  if (o.blink && Math.floor(T * 6) % 2) R_(g, x + 29, y - 6, 2, 2, P.sunO);
  const sp = Math.floor(T * 12) % 2; for (const wx of [x + 4, x + 21]) { circ(g, wx + 3, y - 2, 4, P.ink); R_(g, wx + 2 + sp, y - 3 + sp, 2, 2, P.grayL); } }
function person(g, x, y, o = {}) { x = Math.round(x); y = Math.round(y); const st = o.walk ? Math.floor(T * 8) % 2 : 0;
  R_(g, x + 1, y - 6, 3, 6 - st * 2, P.ink); R_(g, x + 5, y - 6, 3, 6 - (1 - st) * (o.walk ? 2 : 0), P.ink); R_(g, x + 2, y - 6, 1, 5 - st * 2, P.navy2); R_(g, x + 6, y - 6, 1, 5 - (1 - st) * (o.walk ? 2 : 0), P.navy2);
  box(g, x + 1, y - 13, 7, 7, P.orange); R_(g, x + 3, y - 12, 3, 1, P.orangeL); box(g, x + 1, y - 21, 7, 7, P.skin); R_(g, x, y - 22, 9, 3, P.hair); R_(g, x, y - 20, 2, 3, P.hair);
  R_(g, x + 5, y - 17, 1, 2, P.ink); R_(g, x + 7, y - 17, 1, 2, P.ink); }
function crown(g, x, y, c = P.yel) { R_(g, x, y, 22, 5, P.ink); R_(g, x + 1, y + 1, 20, 3, c); for (const sx of [0, 8, 16]) { R_(g, x + sx, y - 5, 6, 5, P.ink); R_(g, x + sx + 1, y - 4, 4, 5, c); R_(g, x + sx + 2, y - 6, 2, 1, P.ink); }
  R_(g, x + 3, y + 2, 2, 1, P.red); R_(g, x + 10, y + 2, 2, 1, P.cyan); R_(g, x + 17, y + 2, 2, 1, P.red); }
// Boss: die Prüfungs-Ampel. state: 'angry' | 'white' | 'hurt' | 'green'
function boss(g, cx, top, st = 'angry', o = {}) { cx = Math.round(cx); top = Math.round(top); const w = 48, h = 88, x = cx - w / 2, wh = st === 'white', rd = st === 'red';
  const fill = wh ? P.cream : rd ? P.red : P.housing;
  R_(g, cx - 4, top + h, 8, GY - top - h, P.ink); R_(g, cx - 3, top + h, 6, GY - top - h, wh ? P.cream : P.gray); R_(g, cx - 3, top + h, 1, GY - top - h, wh ? P.cream : P.grayL);
  box(g, x, top, w, h, fill); if (!wh && !rd) { R_(g, x, top, 1, h, P.housingL); R_(g, x + 2, top + 2, w - 4, 1, P.housingL); }
  crown(g, cx - 11, top - 5, wh ? P.cream : P.yel);
  const lamps = [top + 16, top + 44, top + 72], on = st === 'green' ? 2 : st === 'hurt' ? -1 : 0;
  lamps.forEach((ly, i) => { if (!wh && !rd) { R_(g, x + 4, ly - 15, w - 8, 2, P.ink); }
    const lit = i === on, col = wh ? P.cream : rd ? P.red : i === 0 ? (lit ? P.red : '#5a1026') : i === 1 ? (lit ? P.sunO : '#5a4014') : (lit ? P.green : '#0c4a2c');
    circ(g, cx, ly, 13, P.ink); circ(g, cx, ly, 12, col); if (lit && !wh) { circ(g, cx - 4, ly - 5, 2, 'rgba(255,255,255,.55)'); } });
  if (wh || rd) return;
  if (st === 'angry' || st === 'hurt') { const ly = lamps[0], bl = Math.floor(T * 8) % 17 === 0;
    if (st === 'hurt') { for (const ex of [-5, 5]) { R_(g, cx + ex - 2, ly - 3, 1, 1, P.ink); R_(g, cx + ex - 1, ly - 2, 1, 1, P.ink); R_(g, cx + ex, ly - 1, 1, 1, P.ink); R_(g, cx + ex, ly - 3, 1, 1, P.ink); R_(g, cx + ex - 2, ly - 1, 1, 1, P.ink); } }
    else { for (const ex of [-5, 5]) { R_(g, cx + ex - 3, ly - 4, 6, bl ? 1 : 5, P.cream); if (!bl) R_(g, cx + ex - (ex < 0 ? 0 : 1) + (o.look || 0), ly - 3, 2, 3, P.red); }
      R_(g, cx - 8, ly - 6, 4, 1, P.ink); R_(g, cx - 5, ly - 5, 2, 1, P.ink); R_(g, cx + 4, ly - 6, 4, 1, P.ink); R_(g, cx + 3, ly - 5, 2, 1, P.ink); }
    R_(g, cx - 5, ly + 4, 10, 4, P.ink); R_(g, cx - 4, ly + 4, 2, 1, P.cream); R_(g, cx - 1, ly + 4, 2, 1, P.cream); R_(g, cx + 2, ly + 4, 2, 1, P.cream); R_(g, cx - 4, ly + 6, 8, 1, '#ff5a8a'); }
  if (st === 'green') { const ly = lamps[2]; R_(g, cx - 5, ly - 3, 3, 3, P.ink); R_(g, cx + 3, ly - 3, 3, 3, P.ink); R_(g, cx - 5, ly + 3, 1, 1, P.ink); R_(g, cx - 4, ly + 4, 8, 1, P.ink); R_(g, cx + 4, ly + 3, 1, 1, P.ink); } }
function arrowL(g, x, y, c = P.sunO) { x = Math.round(x); y = Math.round(y); // Blinker-Pfeil „links“
  for (let i = 0; i < 4; i++) { R_(g, x + i - 1, y - i - 1, 1, 2 * i + 3, P.ink); } R_(g, x + 3, y - 2, 7, 5, P.ink);
  for (let i = 0; i < 4; i++) R_(g, x + i, y - i, 1, 2 * i + 1, c); R_(g, x + 4, y - 1, 5, 3, c); }
function coin(g, x, y, ph) { x = Math.round(x); y = Math.round(y); const w = [4, 2, 1, 2][Math.floor(ph) % 4]; R_(g, x - Math.floor(w / 2) - 1, y - 1, w + 2, 8, P.ink); R_(g, x - Math.floor(w / 2), y, w, 6, P.yel); if (w > 2) R_(g, x - 1, y + 1, 1, 4, '#fff7b0'); }
function sign(g, x, y, sc = 1) { // Grünpfeil-Schild: schwarze Tafel, grüner Pfeil nach rechts
  x = Math.round(x); y = Math.round(y); R_(g, x - sc, y - sc, 14 * sc + 2 * sc, 10 * sc + 2 * sc, P.cream); R_(g, x, y, 14 * sc, 10 * sc, P.ink2);
  R_(g, x + 2 * sc, y + 4 * sc, 7 * sc, 2 * sc, P.green); for (let i = 0; i < 4; i++) R_(g, x + (8 + i) * sc, y + (1 + i) * sc, sc, (8 - 2 * i) * sc, P.green); }
function lamp(g, x, flick) { R_(g, x, GY - 26, 2, 26, P.gray); R_(g, x - 1, GY - 28, 4, 3, P.mortar); const f = flick % 3; R_(g, x - 1, GY - 33 + f % 2, 4, 5 - f % 2, P.sunO); R_(g, x, GY - 32 + f % 2, 2, 3, P.yel); }
function tag(g, s, x, y, bg, fg = P.ink) { const w = tw(s, 1) + 6; R_(g, x - w / 2, y - 7, w, 9, bg); R_(g, x - w / 2 + 1, y - 8, w - 2, 1, bg); R_(g, x - w / 2 + 1, y + 2, w - 2, 1, bg); ptext(g, s, x, y - 5, 1, fg, { align: 'center' }); }
function dotted(g, pts, c = P.yel, gap = 3) { for (let i = 0; i < pts.length; i += gap) R_(g, pts[i][0], pts[i][1], 1, 1, c); }

// ---------- Zeitachse ----------
// Alle Zeiten sind Abstände zu den gemessenen Wortzeiten K (zeiten.js), keine festen Sekunden.
const HIT = K.bestanden - .04, FREEZE = [HIT, HIT + .3];            // Einschlag = Wortanfang „bestanden“
const PAN1 = [K.dabei - .3, K.sechs - .1], CARGO = K.ohne, PANB = [K.sitzt + .17, K.dann + .28], LAND = K.probe, JUMP = K.diesmal, MORN = K.mont, ARR = K.arbeit - .27, ENDC = K.fahr - .2;
const tfz = t => (t >= FREEZE[0] && t < FREEZE[1]) ? FREEZE[0] : t;
function camX(t) { // langsame Dauerfahrt wie im Original, dazwischen Schwenks
  if (t < PAN1[0]) return 10 * t / PAN1[0]; if (t < PAN1[1]) return mix(10, 260, eio(lin(t, PAN1[0], PAN1[1]))); if (t < K.und1) return mix(260, 272, lin(t, PAN1[1], K.und1));
  if (t < K.zehn) return mix(272, 300, lin(t, K.und1, K.zehn)); if (t < PANB[0]) return mix(300, 560, lin(t, K.zehn, PANB[0])); if (t < PANB[1]) return mix(560, 820, eo(lin(t, PANB[0], PANB[1])));
  if (t < MORN) return mix(820, 838, lin(t, PANB[1], MORN)); if (t < ARR) return mix(838, 1300, eio(lin(t, MORN, ARR))); return mix(1300, 1330, lin(t, ARR, DUR)); }
const PX = 345 + 50, BOSS_A = 236, BOSS_B = 1070, BUILD = 1528;
const TOK = n => K.zehn - .05 + (n + 1) * (K.sitzt - K.zehn + .05) / 10 - .02; // gleiche Formel wie die Level-Töne
const DODGE = [K.echten, K.strecke + .45];   // Ausweich-Sprünge: Scheitel auf „echten“ und nach „Strecke“

const SKYF = mk(LW, LH), CITYF = mk(900, LH), SP = mk(LW + 2, LH), UI = mk(LW, LH), TMP = mk(LW, LH);

function texts(g, t) { const RED = P.red, Y = P.yel, WH = P.white;

  title(g, t, 'BESTANDEN!', 36, 4, Y, HIT - .28, HIT, K.mont - .15, { chroma: [RED, '#67ffdf'], swap: t > HIT + .6 ? P.pink : null });
  // Schlussbild: Name als Ganzes, dann Logo

    const k = drop(t, K.gruen2 - .3, K.gruen2); if (k >= 0) { const w = tw('GRÜN-PFEIL', 3), x0 = 160 - (w + 48) / 2, yy = Math.round(mix(64, 44, k)); /* steigt von unten ein, kreuzt „FAHRSCHULE“ nicht */ sign(g, x0, yy - 1, 3); ptext(g, 'GRÜN-PFEIL', x0 + 48, yy, 3, P.green, { sh: P.ink2 }); } }
  if (t > K.kostenlos + .3) { const CT = 'GRUENPFEIL-FAHRSCHULE.DE  0421 55 90 21', k = eo(lin(t, K.kostenlos + .3, K.kostenlos + .5)); ptext(g, CT, 160 - tw(CT, 1) / 2, 113 + Math.round((1 - k) * 6), 1, P.white, { sh: P.ink2 }); }

  if (t > W0 && t < W1) { const bx = 112, by = 84, kp = eo(lin(t, W0, K.ueben - .02)), hh = Math.max(2, Math.round(22 * kp)), oy = Math.round((22 - hh) / 2);
    R_(g, bx - 1, by - 1 + oy, 98, hh, Y); R_(g, bx, by + oy, 96, Math.max(0, hh - 2), P.ink);
    if (kp >= 1) { ptext(g, 'LINKSABBIEGEN', bx + 4, by + 3, 1, WH);
      let n = 0; for (let i = 0; i < 10; i++) if (t > TOK(i)) n++; const lvl = Math.max(2, n); for (let i = 0; i < 10; i++) { const c = i < lvl ? (lvl <= 3 ? (Math.floor(t * 6) % 2 && t < K.zehn ? '#6a1030' : RED) : lvl < 10 ? P.sunO : P.green) : '#3a3355'; R_(g, bx + 4 + i * 5, by + 12, 4, 4, c); }

      for (const [sx, sy, dx, dy] of [[bx - m - 2, by - m - 2, 1, 1], [bx + 96 + m + 1, by - m - 2, -1, 1], [bx - m - 2, by + 20 + m + 1, 1, -1], [bx + 96 + m + 1, by + 20 + m + 1, -1, -1]]) { R_(g, sx + Math.min(0, dx * 6), sy, 6, 1, col); R_(g, sx, sy + Math.min(0, dy * 6), 1, 6, col); R_(g, sx + Math.min(0, dx * 6), sy + dy, 6, 1, col); R_(g, sx + dx, sy + Math.min(0, dy * 6), 1, 6, col); } }

    if (t > K.sitzt - .22) { const k = clamp((t - (K.sitzt - .22)) / .22), ox = bx + 102, oy = by + 6, n1 = Math.round(4 * clamp(k * 2)), n2 = Math.round(9 * clamp(k * 2 - 1));
      for (let i = 0; i < n1; i++) R_(g, ox + i - 1, oy + i - 1, 4, 4, P.ink); for (let i = 0; i < n2; i++) R_(g, ox + 4 + i - 1, oy + 3 - i - 1, 4, 4, P.ink);
      for (let i = 0; i < n1; i++) R_(g, ox + i, oy + i, 2, 2, P.green); for (let i = 0; i < n2; i++) R_(g, ox + 4 + i, oy + 3 - i, 2, 2, P.green); } }
  // Etiketten am Job-Turm: Questtimer „6 WOCHEN“ auf „sechs“, „JOB“ auf „Job“

// ---------- Plakette (glatte Schrift wie „12 FPS“ im Original) ----------
function plaque(t) { const P0 = K.erste - .3; if (t < P0) return; const k = eo(clamp((t - P0) / .3)); const w = 900, h = 214, x = 960 - w / 2, y = 420;

  X.fillStyle = P.yel; X.font = '800 66px RB'; X.textAlign = 'center'; X.fillText('1. ÜBUNGSSTUNDE', 960, y + 80);

    const blink = t > K.kostenlos && t < K.kostenlos + .6 && Math.floor(t * 10) % 2; X.fillStyle = blink ? P.white : P.green; X.fillText('KOSTENLOS', 0, 22); X.restore(); }
  const n = Math.round(14 * lin(t, K.erste, K.kostenlos)); for (let i = 0; i < 14; i++) { X.fillStyle = i < n ? P.yel : '#3a3355'; X.fillRect(960 - 14 * 10 + i * 20, y + h - 36, 12, 12); }
  X.restore(); }

function draw(t) { T = t; X.setTransform(1, 0, 0, 1, 0, 0); X.imageSmoothingEnabled = false; X.fillStyle = '#0b0d17'; X.fillRect(0, 0, W, H);
  const tf = tfz(t); drawSky(tf, SKYF.getContext('2d')); const { cx, fx } = frameWorld(t);
  X.save();
  // Hit-Stop: Punch-in auf den Einschlag + Wackeln (zeigt kurz den dunklen Rand)

  const bossLand = t > LAND - .02 && t < LAND + .2 ? 1 : 0, shake = (t >= HIT && t < HIT + .3) || bossLand ? Math.round((hsh(Math.floor(t * 30)) - .5) * 30) : 0;
  if (pk > 0 || shake) { const ix = (BOSS_B - cx - 6) * S, iy = 70 * S, z = 1 + .4 * pk; X.translate(ix + shake, iy + shake * .6); X.scale(z, z); X.translate(-ix, -iy); }
