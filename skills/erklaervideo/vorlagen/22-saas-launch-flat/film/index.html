// Glyphen in den App-Kacheln
const GL = {

    g.beginPath(); g.arc(40, -40, 17, 0, 7); g.fillStyle = C.red; g.fill(); txt(g, '3', 40, -33, F(700, 20), '#fff', { align: 'center' }); },
  chat: g => { g.fillStyle = '#e6e6e0'; rr(g, -44, -34, 70, 42, 16); g.fill(); g.fillStyle = C.blue; rr(g, -18, 0, 64, 40, 16); g.fill(); g.fillStyle = '#fff'; for (let i = 0; i < 3; i++) { g.beginPath(); g.arc(-2 + i * 16, 20, 4, 0, 7); g.fill(); } },

  g.fillStyle = C.line; g.fillRect(40, 196, w - 80, 1.5); txt(g, 'Name', 110, 228, F(500, 18), C.grey); txt(g, 'Rolle', w * .45, 228, F(500, 18), C.grey); txt(g, 'Status', w * .72, 228, F(500, 18), C.grey);

    if (s.state === 'sick' || s.state === 'open') { g.save(); g.globalAlpha = s.k ?? 1; rr(g, 30, y, w - 60, 64, 10); g.fillStyle = 'rgba(222,89,81,.08)'; g.fill(); g.restore(); }

  if (ck > 0) { const press = t > K.schicht2 - .06 && t < K.schicht2 + .12 ? 1 : 0; g.save(); g.translate(960, 740); g.scale((.9 + .1 * ck) * (1 - press * .05), (.9 + .1 * ck) * (1 - press * .05)); g.globalAlpha = ck;
    rr(g, -200, -44, 400, 88, 44); g.shadowColor = 'rgba(11,116,222,.45)'; g.shadowBlur = 40; g.shadowOffsetY = 10; g.fillStyle = C.blue; g.fill(); g.shadowColor = 'transparent';
    txt(g, t > K.schicht2 + .05 ? 'Schicht gemeldet ✓' : 'Schicht melden', 0, 11, F(600, 30), '#fff', { align: 'center' }); g.restore();
    if (t > K.schicht2) { const r = lin(t, K.schicht2, K.schicht2 + .6); g.save(); g.globalAlpha = 1 - r; g.strokeStyle = C.blue; g.lineWidth = 3; rr(g, -200 - r * 40 + 960, 740 - 44 - r * 20, 400 + r * 80, 88 + r * 40, 44 + r * 20); g.stroke(); g.restore(); } }
  { const k = p3(lin(t, K.schicht2 + .1, K.schicht2 + .45)); if (k > 0) { g.save(); g.globalAlpha = k; txt(g, 'PFLEGEBRUECKE.DE   ·   030 577 01 48', 960, 850, M(24), C.grey, { align: 'center', ls: '3px' }); g.restore(); } }
  // Mauszeiger fährt ein und klickt auf „Schicht“
  if (t > K.heute - .1) { const k = eio(lin(t, K.heute - .1, K.schicht2 - .25)), press = t > K.schicht2 - .06 && t < K.schicht2 + .12 ? 1 : 0; cursor(g, mix(1500, 1010, k), mix(1000, 752, k), press); } }

// ---------- Schnitt und Überblendungen ----------
const LAY = [mk(W, H), mk(W, H)];
const SC = [[0, CUT.B, sA, 'd'], [CUT.B, CUT.C, sB, 'd'], [CUT.C, CUT.D, sC, 'd'], [CUT.D, CUT.E, sD, 'l'], [CUT.E, CUT.F, sE, 'l'], [CUT.F, CUT.G, sF, 'l'], [CUT.G, CUT.H, sG, 'l'], [CUT.H, 99, sH, 'l']];
function drawScene(i, t, g) { const [a, b, fn] = SC[i]; g.save(); const push = 1 + (i === 7 ? .12 : i === 2 ? .1 : .06) * Math.min(1, (t - a) / Math.min(5.5, b - a)); g.translate(960, 540); g.scale(push, push); g.translate(-960, -540); fn(g, t); g.restore(); }
function draw(t) { T = t; X.setTransform(1, 0, 0, 1, 0, 0); X.filter = 'none'; X.globalAlpha = 1;
  let i = SC.findIndex(s => t >= s[0] && t < s[1]); if (i < 0) i = SC.length - 1;
  const [a, , , kind] = SC[i], prev = SC[i - 1], D = .22;
  // hell ↔ dunkel: harter Schnitt; innerhalb derselben Helligkeit: Unschärfe-Überblendung
  if (prev && prev[3] === kind && t < a + D && i !== 2) { const k = (t - a) / D; const g0 = LAY[0].getContext('2d'), g1 = LAY[1].getContext('2d');
    g0.setTransform(1, 0, 0, 1, 0, 0); g0.filter = 'none'; g0.globalAlpha = 1; drawScene(i - 1, Math.min(t, prev[1] - .001), g0); g1.setTransform(1, 0, 0, 1, 0, 0); g1.filter = 'none'; g1.globalAlpha = 1; drawScene(i, t, g1);
    X.drawImage(LAY[0], 0, 0); X.filter = `blur(${(1 - k) * 16}px)`; X.globalAlpha = k; X.drawImage(LAY[1], 0, 0); X.filter = 'none'; X.globalAlpha = 1; }
  else drawScene(i, t, X); }

const ready = (async () => { for (const [n, u, d] of [['IN', 'Inter.ttf', { weight: '100 900' }], ['JB', 'JetBrainsMono.ttf', { weight: '100 800' }]]) { const f = new FontFace(n, `url(${u})`, d); await f.load(); document.fonts.add(f); } draw(0); })();
window.FILM = { duration: DUR, width: W, height: H, ready, seek(t) { draw(t); } };
